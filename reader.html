
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Reader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }
        #reader {
            width: 100%;
            min-height: 55vh;
        }
        #reader video {
            width: 100% !important;
            border: none !important;
        }
        #reader__scan_region {
            min-height: 50vh;
        }
        /* Esconder elementos desnecessários da lib */
        #reader__dashboard_section_swaplink,
        #reader__dashboard_section_fileselection,
        #reader__header_message,
        #reader img {
            display: none !important;
        }
        #reader__dashboard_section_csr select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 4px;
            border-radius: 4px;
        }
        .status-bar {
            padding: 10px;
            background: #111;
            text-align: center;
        }
        .status-bar .status {
            font-size: 0.9em;
            color: #4fc3f7;
        }
        .status-bar .last-read {
            font-size: 0.7em;
            color: #888;
            margin-top: 3px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 8px;
            background: #1a1a2e;
            font-size: 0.75em;
        }
        .stats div { text-align: center; }
        .stats .value { font-size: 1.2em; font-weight: bold; color: #4fc3f7; }
        .btn-logout {
            position: fixed;
            top: 5px;
            right: 5px;
            background: #333;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.7em;
            z-index: 100;
        }
        .debug {
            background: rgba(0,0,0,0.92);
            color: #0f0;
            font-family: monospace;
            font-size: 0.65em;
            padding: 6px;
            max-height: 18vh;
            overflow-y: auto;
        }
        .pulse { animation: pulse 1s ease-in-out; }
        @keyframes pulse {
            0% { background: #111; }
            50% { background: #1b5e20; }
            100% { background: #111; }
        }
    </style>
</head>
<body>
    <button class="btn-logout" onclick="logout()">Sair</button>
    
    <div id="reader"></div>
    
    <div class="status-bar" id="status-bar">
        <div class="status" id="status">Iniciando câmera...</div>
        <div class="last-read" id="last-read">Aguardando leitura...</div>
    </div>
    <div class="stats">
        <div>
            <div class="value" id="read-count">0</div>
            <div>Leituras</div>
        </div>
        <div>
            <div class="value" id="vars-count">0</div>
            <div>Variáveis</div>
        </div>
        <div>
            <div class="value" id="uptime">00:00</div>
            <div>Uptime</div>
        </div>
    </div>
    
    <!-- Debug - REMOVA depois que funcionar -->
    <div class="debug" id="debug"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- html5-qrcode (ZXing-based, robusto como pyzbar) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script>
        // ⚠️ SUBSTITUA com suas credenciais do Firebase
        var firebaseConfig = {
             apiKey: "AIzaSyBLx0ECcSQdS8uKnaXzDIuygK7Hi3JTcuU",
         authDomain: "dshutili.firebaseapp.com",
            databaseURL: "https://dshutili-default-rtdb.firebaseio.com",
             projectId: "dshutili",
        storageBucket: "dshutili.firebasestorage.app",
        messagingSenderId: "1065134772507",
        appId: "1:1065134772507:web:aed91d6d1953f69cb403be",
         measurementId: "G-B3NS6YKTLV"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        // ===== DEBUG =====
        var debugEl = document.getElementById('debug');
        function log(msg) {
            var time = new Date().toLocaleTimeString('pt-BR');
            debugEl.innerHTML = '[' + time + '] ' + msg + '<br>' + debugEl.innerHTML;
            var lines = debugEl.innerHTML.split('<br>');
            if (lines.length > 12) {
                debugEl.innerHTML = lines.slice(0, 12).join('<br>');
            }
        }

        // Verificar autenticação
        firebase.auth().onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                log('✅ Logado: ' + user.email);
                initReader();
            }
        });

        var readCount = 0;
        var startTime = Date.now();
        var lastData = null;
        var scanner = null;

        // ============================================================
        // PARSER - Aceita JSON e texto formatado
        // ============================================================
        function parsearDadosQR(dadosRaw) {
            // Tentar JSON primeiro
            try {
                var dados = JSON.parse(dadosRaw);
                log('📋 JSON válido!');
                
                // Formato {"d": [{id, v, u, a}, ...]}
                if (dados.d && Array.isArray(dados.d)) {
                    return { tipo: 'json', dados: dados };
                }
                // Formato objeto simples {"tag": valor, ...}
                return { tipo: 'json_simples', dados: dados };
            } catch (e) {
                // Não é JSON
            }

            // Parsear texto formatado
            log('📋 Parseando como texto...');
            var linhas = dadosRaw.split('\n');
            var tags = [];

            for (var i = 0; i < linhas.length; i++) {
                var linha = linhas[i].trim();
                if (!linha || linha.indexOf('===') >= 0) continue;
                
                var idxDoisPontos = linha.indexOf(':');
                if (idxDoisPontos < 0) continue;

                var nome = linha.substring(0, idxDoisPontos).trim();
                var resto = linha.substring(idxDoisPontos + 1).trim();

                var partes = resto.split('|');
                
                for (var p = 0; p < partes.length; p++) {
                    var parte = partes[p].trim();
                    var subIdx = parte.indexOf(':');
                    var subNome = nome;
                    var subValor = parte;
                    
                    if (p > 0 && subIdx > 0) {
                        subNome = parte.substring(0, subIdx).trim();
                        subValor = parte.substring(subIdx + 1).trim();
                    }

                    var tokens = subValor.split(/\s+/);
                    if (tokens.length > 0) {
                        var numStr = tokens[0].replace(',', '.');
                        var num = parseFloat(numStr);
                        if (!isNaN(num)) {
                            var unidade = tokens.slice(1).join(' ') || '';
                            tags.push({ id: subNome, v: num, u: unidade });
                        }
                    }
                }
            }

            return { tipo: 'texto', dados: tags };
        }

        // ============================================================
        // NORMALIZAR PARA FIREBASE
        // ============================================================
        function normalizarParaFirebase(resultado) {
            var dadosFirebase = {
                _timestamp: Date.now(),
                _readAt: new Date().toLocaleString('pt-BR'),
                _tipo: resultado.tipo
            };

            if (resultado.tipo === 'json' && resultado.dados.d) {
                var items = resultado.dados.d;
                dadosFirebase._varCount = items.length;
                dadosFirebase.d = items;
                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    dadosFirebase[item.id] = {
                        v: item.v,
                        u: item.u || '',
                        a: item.a || 0
                    };
                }
            } else if (resultado.tipo === 'json_simples') {
                var keys = Object.keys(resultado.dados);
                dadosFirebase._varCount = keys.length;
                for (var k = 0; k < keys.length; k++) {
                    var key = keys[k];
                    if (!key.startsWith('_')) {
                        dadosFirebase[key] = resultado.dados[key];
                    }
                }
            } else if (resultado.tipo === 'texto') {
                var tags = resultado.dados;
                dadosFirebase._varCount = tags.length;
                dadosFirebase.d = tags;
                for (var j = 0; j < tags.length; j++) {
                    dadosFirebase[tags[j].id] = {
                        v: tags[j].v,
                        u: tags[j].u || ''
                    };
                }
            }

            return dadosFirebase;
        }

        // ============================================================
        // INICIAR LEITOR (html5-qrcode com ZXing)
        // ============================================================
        function initReader() {
            log('📷 Iniciando html5-qrcode...');
            document.getElementById('status').textContent = '📷 Iniciando câmera...';

            scanner = new Html5Qrcode("reader");

            var config = {
                fps: 5,
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    var minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                    var qrboxSize = Math.floor(minEdge * 0.8);
                    return { width: qrboxSize, height: qrboxSize };
                },
                aspectRatio: 1.0,
                formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
            };

            scanner.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            ).then(function() {
                log('✅ Câmera ativa! Escaneando...');
                document.getElementById('status').textContent = '✅ Câmera ativa - Lendo...';
            }).catch(function(err) {
                log('❌ Erro câmera: ' + err);
                document.getElementById('status').textContent = '❌ Erro: ' + err;
            });
        }

        // ============================================================
        // CALLBACK - QR DETECTADO
        // ============================================================
        function onScanSuccess(decodedText, decodedResult) {
            log('🎯 QR! (' + decodedText.length + ' bytes)');
            
            // Parsear
            var resultado = parsearDadosQR(decodedText);
            
            if (!resultado || (resultado.tipo === 'texto' && resultado.dados.length === 0)) {
                log('⚠️ Sem dados úteis');
                return;
            }

            // Normalizar
            var dadosFirebase = normalizarParaFirebase(resultado);
            
            // Evitar duplicatas
            var checkStr = JSON.stringify(dadosFirebase.d || '');
            if (checkStr === lastData) {
                return; // Silencioso - não logar duplicatas para não poluir
            }
            lastData = checkStr;

            // Enviar para Firebase
            db.ref('current').set(dadosFirebase)
                .then(function() { log('☁️ Firebase OK'); })
                .catch(function(e) { log('❌ Firebase: ' + e.message); });
            
            db.ref('history').push().set(dadosFirebase);

            // Atualizar UI
            readCount++;
            var varCount = dadosFirebase._varCount || 0;
            document.getElementById('read-count').textContent = readCount;
            document.getElementById('vars-count').textContent = varCount;
            document.getElementById('last-read').textContent = 'Última: ' + dadosFirebase._readAt;
            document.getElementById('status').textContent = '✅ #' + readCount + ' | ' + varCount + ' vars | ' + resultado.tipo;
            document.getElementById('status-bar').classList.add('pulse');
            setTimeout(function() { 
                document.getElementById('status-bar').classList.remove('pulse');
                document.getElementById('status').textContent = '✅ Câmera ativa - Lendo...';
            }, 2000);

            log('✅ LEITURA #' + readCount + ' | ' + resultado.tipo + ' | ' + varCount + ' vars');
        }

        function onScanFailure(error) {
            // Silencioso - não fazer nada quando não encontra QR
        }

        // Uptime
        setInterval(function() {
            var elapsed = Math.floor((Date.now() - startTime) / 1000);
            var hrs = Math.floor(elapsed / 3600);
            var min = Math.floor((elapsed % 3600) / 60).toString();
            var sec = (elapsed % 60).toString();
            if (min.length < 2) min = '0' + min;
            if (sec.length < 2) sec = '0' + sec;
            document.getElementById('uptime').textContent = 
                hrs > 0 ? hrs + ':' + min + ':' + sec : min + ':' + sec;
        }, 1000);

        // Wake Lock
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(function(){});
        }

        function logout() {
            if (scanner) {
                scanner.stop().then(function() {
                    firebase.auth().signOut().then(function() {
                        window.location.href = 'index.html';
                    });
                }).catch(function() {
                    firebase.auth().signOut().then(function() {
                        window.location.href = 'index.html';
                    });
                });
            } else {
                firebase.auth().signOut().then(function() {
                    window.location.href = 'index.html';
                });
            }
        }
    </script>
</body>
</html>
