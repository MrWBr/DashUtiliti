
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Reader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        #video {
            width: 100%;
            height: 60vh;
            object-fit: cover;
            display: block;
            background: #222;
        }
        canvas { display: none; }
        .status-bar {
            padding: 8px;
            background: #111;
            text-align: center;
        }
        .status-bar .status {
            font-size: 0.9em;
            color: #4fc3f7;
        }
        .status-bar .last-read {
            font-size: 0.7em;
            color: #888;
            margin-top: 3px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 8px;
            background: #1a1a2e;
            font-size: 0.75em;
        }
        .stats div { text-align: center; }
        .stats .value { font-size: 1.2em; font-weight: bold; color: #4fc3f7; }
        .btn-logout {
            position: fixed;
            top: 5px;
            right: 5px;
            background: #333;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.7em;
            z-index: 10;
        }
        .debug {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.92);
            color: #0f0;
            font-family: monospace;
            font-size: 0.65em;
            padding: 6px;
            max-height: 20vh;
            overflow-y: auto;
            z-index: 20;
        }
        .pulse { animation: pulse 1s ease-in-out; }
        @keyframes pulse {
            0% { background: #111; }
            50% { background: #1b5e20; }
            100% { background: #111; }
        }
    </style>
</head>
<body>
    <button class="btn-logout" onclick="logout()">Sair</button>
    
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div class="status-bar" id="status-bar">
        <div class="status" id="status">Iniciando câmera...</div>
        <div class="last-read" id="last-read">Aguardando leitura...</div>
    </div>
    <div class="stats">
        <div>
            <div class="value" id="read-count">0</div>
            <div>Leituras</div>
        </div>
        <div>
            <div class="value" id="vars-count">0</div>
            <div>Variáveis</div>
        </div>
        <div>
            <div class="value" id="scan-count">0</div>
            <div>Scans</div>
        </div>
        <div>
            <div class="value" id="uptime">00:00</div>
            <div>Uptime</div>
        </div>
    </div>
    
    <!-- Debug console - REMOVA depois que funcionar -->
    <div class="debug" id="debug"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- jsQR - decodificador puro -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <script>
        // ⚠️ SUBSTITUA com suas credenciais do Firebase
        var firebaseConfig = {
             apiKey: "AIzaSyBLx0ECcSQdS8uKnaXzDIuygK7Hi3JTcuU",
         authDomain: "dshutili.firebaseapp.com",
            databaseURL: "https://dshutili-default-rtdb.firebaseio.com",
             projectId: "dshutili",
        storageBucket: "dshutili.firebasestorage.app",
        messagingSenderId: "1065134772507",
        appId: "1:1065134772507:web:aed91d6d1953f69cb403be",
         measurementId: "G-B3NS6YKTLV"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        // ===== DEBUG =====
        var debugEl = document.getElementById('debug');
        function log(msg) {
            var time = new Date().toLocaleTimeString('pt-BR');
            debugEl.innerHTML = '[' + time + '] ' + msg + '<br>' + debugEl.innerHTML;
            var lines = debugEl.innerHTML.split('<br>');
            if (lines.length > 15) {
                debugEl.innerHTML = lines.slice(0, 15).join('<br>');
            }
        }

        // Verificar autenticação
        firebase.auth().onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                log('✅ Logado: ' + user.email);
                initCamera();
            }
        });

        var readCount = 0;
        var scanCount = 0;
        var startTime = Date.now();
        var lastData = null;
        var video = document.getElementById('video');
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        var scanning = false;

        // ============================================================
        // PARSER - MESMA LÓGICA DO SEU PYTHON
        // Aceita JSON {"d":[...]} OU texto formatado "NOME: valor unidade"
        // ============================================================
        function parsearDadosQR(dadosRaw) {
            // Tentar JSON primeiro
            try {
                var dados = JSON.parse(dadosRaw);
                log('📋 Formato: JSON');
                
                // Formato {"d": [{id, v, u, a}, ...]}
                if (dados.d && Array.isArray(dados.d)) {
                    return { tipo: 'json', dados: dados };
                }
                // Formato objeto simples {"tag": valor, ...}
                return { tipo: 'json_simples', dados: dados };
            } catch (e) {
                // Não é JSON, parsear como texto
            }

            // Parsear texto (mesmo formato do seu VBS)
            log('📋 Formato: TEXTO');
            var linhas = dadosRaw.split('\n');
            var tags = [];

            for (var i = 0; i < linhas.length; i++) {
                var linha = linhas[i].trim();
                if (!linha || linha.indexOf('===') >= 0) continue;
                
                // Tentar extrair "NOME: valor unidade" ou "NOME:valor unidade"
                var idxDoisPontos = linha.indexOf(':');
                if (idxDoisPontos < 0) continue;

                var nome = linha.substring(0, idxDoisPontos).trim();
                var resto = linha.substring(idxDoisPontos + 1).trim();

                // Pode ter múltiplos valores na mesma linha separados por |
                var partes = resto.split('|');
                
                for (var p = 0; p < partes.length; p++) {
                    var parte = partes[p].trim();
                    // Extrair nome:valor se tiver sub-parte com ":"
                    var subIdx = parte.indexOf(':');
                    var subNome = nome;
                    var subValor = parte;
                    
                    if (p > 0 && subIdx > 0) {
                        subNome = parte.substring(0, subIdx).trim();
                        subValor = parte.substring(subIdx + 1).trim();
                    }

                    // Extrair número do valor
                    var tokens = subValor.split(/\s+/);
                    if (tokens.length > 0) {
                        var numStr = tokens[0].replace(',', '.');
                        var num = parseFloat(numStr);
                        if (!isNaN(num)) {
                            var unidade = tokens.slice(1).join(' ') || '';
                            tags.push({ id: subNome, v: num, u: unidade });
                        }
                    }
                }
            }

            return { tipo: 'texto', dados: tags };
        }

        // ============================================================
        // NORMALIZAR DADOS PARA FIREBASE
        // Converte qualquer formato para estrutura uniforme
        // ============================================================
        function normalizarParaFirebase(resultado) {
            var dadosFirebase = {
                _timestamp: Date.now(),
                _readAt: new Date().toLocaleString('pt-BR'),
                _tipo: resultado.tipo
            };

            if (resultado.tipo === 'json' && resultado.dados.d) {
                // Formato {"d": [{id, v, u, a}, ...]}
                var items = resultado.dados.d;
                dadosFirebase._varCount = items.length;
                dadosFirebase.d = items;
                
                // Também salvar como chave:valor para fácil acesso no dashboard
                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    dadosFirebase[item.id] = {
                        v: item.v,
                        u: item.u || '',
                        a: item.a || 0
                    };
                }
            } else if (resultado.tipo === 'json_simples') {
                // Formato {"tag": valor, ...}
                var keys = Object.keys(resultado.dados);
                dadosFirebase._varCount = keys.length;
                for (var k = 0; k < keys.length; k++) {
                    dadosFirebase[keys[k]] = resultado.dados[keys[k]];
                }
            } else if (resultado.tipo === 'texto') {
                // Formato parseado do texto
                var tags = resultado.dados;
                dadosFirebase._varCount = tags.length;
                dadosFirebase.d = tags;
                
                for (var j = 0; j < tags.length; j++) {
                    dadosFirebase[tags[j].id] = {
                        v: tags[j].v,
                        u: tags[j].u || ''
                    };
                }
            }

            return dadosFirebase;
        }

        // ============================================================
        // CÂMERA
        // ============================================================
        function initCamera() {
            log('📷 Solicitando câmera...');
            document.getElementById('status').textContent = '📷 Iniciando câmera...';
            
            var constraints = {
                video: {
                    facingMode: { ideal: 'environment' },
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    var track = stream.getVideoTracks()[0];
                    var settings = track.getSettings();
                    log('✅ Câmera: ' + (settings.width || '?') + 'x' + (settings.height || '?'));
                    
                    video.srcObject = stream;
                    video.onloadedmetadata = function() {
                        log('📹 Video: ' + video.videoWidth + 'x' + video.videoHeight);
                        video.play().then(function() {
                            log('▶️ Play OK! Iniciando scan...');
                            document.getElementById('status').textContent = '✅ Câmera ativa';
                            scanning = true;
                            setTimeout(scanLoop, 500);
                        }).catch(function(e) {
                            log('❌ Play erro: ' + e.message);
                        });
                    };
                })
                .catch(function(err) {
                    log('❌ Câmera erro: ' + err.name);
                    // Fallback sem facingMode específico
                    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                        .then(function(stream) {
                            log('✅ Fallback câmera OK');
                            video.srcObject = stream;
                            video.onloadedmetadata = function() {
                                video.play().then(function() {
                                    scanning = true;
                                    setTimeout(scanLoop, 500);
                                });
                            };
                        })
                        .catch(function(e) {
                            log('❌ Sem câmera: ' + e.message);
                            document.getElementById('status').textContent = '❌ Sem acesso à câmera';
                        });
                });
        }

        // ============================================================
        // LOOP DE SCAN - Similar ao capturar_qr() do Python
        // ============================================================
        function scanLoop() {
            if (!scanning) return;
            
            try {
                if (video.readyState < video.HAVE_CURRENT_DATA) {
                    setTimeout(scanLoop, 500);
                    return;
                }

                var w = video.videoWidth;
                var h = video.videoHeight;
                
                if (w === 0 || h === 0) {
                    setTimeout(scanLoop, 500);
                    return;
                }

                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(video, 0, 0, w, h);
                
                var imageData = ctx.getImageData(0, 0, w, h);
                scanCount++;
                document.getElementById('scan-count').textContent = scanCount;
                
                // Decodificar QR com jsQR
                var code = jsQR(imageData.data, w, h, {
                    inversionAttempts: "dontInvert"
                });
                
                if (code && code.data) {
                    log('🎯 QR DETECTADO! (' + code.data.length + ' bytes)');
                    processQR(code.data);
                }
                
                // Log periódico
                if (scanCount % 20 === 0) {
                    log('🔍 Scan #' + scanCount + ' | ' + w + 'x' + h + ' | Sem QR');
                }
                
            } catch (e) {
                log('❌ Scan erro: ' + e.message);
            }
            
            // Próximo scan em 400ms (~2.5 FPS)
            setTimeout(scanLoop, 400);
        }

        // ============================================================
        // PROCESSAR QR - Usa o parser igual ao Python
        // ============================================================
        function processQR(decodedText) {
            // Parsear dados (aceita JSON ou texto)
            var resultado = parsearDadosQR(decodedText);
            
            if (!resultado || (resultado.tipo === 'texto' && resultado.dados.length === 0)) {
                log('⚠️ QR sem dados úteis: ' + decodedText.substring(0, 40));
                return;
            }

            // Normalizar para Firebase
            var dadosFirebase = normalizarParaFirebase(resultado);
            
            // Evitar duplicatas
            var dataStr = JSON.stringify(dadosFirebase.d || dadosFirebase);
            if (dataStr === lastData) {
                log('⏭️ Dados iguais, ignorando');
                return;
            }
            lastData = dataStr;

            // Enviar para Firebase
            db.ref('current').set(dadosFirebase)
                .then(function() { log('☁️ Firebase OK!'); })
                .catch(function(e) { log('❌ Firebase: ' + e.message); });
            
            db.ref('history').push().set(dadosFirebase);

            // Limpar histórico antigo
            db.ref('history').limitToFirst(1).once('value', function(snap) {
                if (snap.numChildren() > 500) {
                    snap.forEach(function(child) { child.ref.remove(); });
                }
            });

            // Atualizar UI
            readCount++;
            var varCount = dadosFirebase._varCount || 0;
            document.getElementById('read-count').textContent = readCount;
            document.getElementById('vars-count').textContent = varCount;
            document.getElementById('last-read').textContent = 'Última: ' + dadosFirebase._readAt;
            document.getElementById('status').textContent = '✅ Leitura #' + readCount + ' | ' + varCount + ' vars';
            document.getElementById('status-bar').classList.add('pulse');
            setTimeout(function() { 
                document.getElementById('status-bar').classList.remove('pulse');
                document.getElementById('status').textContent = '✅ Câmera ativa - Lendo...';
            }, 1500);

            log('✅ LEITURA #' + readCount + ' | Tipo: ' + resultado.tipo + ' | ' + varCount + ' vars');
        }

        // Uptime
        setInterval(function() {
            var elapsed = Math.floor((Date.now() - startTime) / 1000);
            var hrs = Math.floor(elapsed / 3600);
            var min = Math.floor((elapsed % 3600) / 60).toString();
            var sec = (elapsed % 60).toString();
            if (min.length < 2) min = '0' + min;
            if (sec.length < 2) sec = '0' + sec;
            document.getElementById('uptime').textContent = 
                hrs > 0 ? hrs + ':' + min + ':' + sec : min + ':' + sec;
        }, 1000);

        // Wake Lock
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(function(){});
        }

        function logout() {
            scanning = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(function(t) { t.stop(); });
            }
            firebase.auth().signOut().then(function() {
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
