
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leitor QR - Utilidades</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #000;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }
        #reader-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        #reader-container video {
            width: 100% !important;
            height: 100vh !important;
            object-fit: cover;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 8px 12px;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status {
            font-size: 0.75em;
            padding: 3px 8px;
            border-radius: 10px;
            background: #1b5e20;
            color: #a5d6a7;
        }
        .status.error { background: #b71c1c; color: #ef9a9a; }
        .stats {
            font-size: 0.7em;
            color: #888;
            display: flex;
            gap: 10px;
        }
        .stats .val { color: #4fc3f7; font-weight: 600; }
        .debug-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 8px 12px;
            background: rgba(0, 20, 0, 0.85);
            font-family: monospace;
            font-size: 0.65em;
            color: #4caf50;
            max-height: 20vh;
            overflow-y: auto;
            z-index: 100;
        }
        .debug-bar .line { padding: 2px 0; border-bottom: 1px solid rgba(76,175,80,0.1); }
        .debug-bar .error { color: #ef5350; }
        .debug-bar .success { color: #4caf50; }
        .btn-sair {
            background: #333; color: #fff; border: none;
            padding: 4px 10px; border-radius: 4px;
            font-size: 0.7em; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <span class="status" id="status">Iniciando...</span>
        <div class="stats">
            <span>📖 <span class="val" id="leituras">0</span></span>
            <span>📤 <span class="val" id="envios">0</span></span>
            <span>⏱️ <span class="val" id="uptime">00:00</span></span>
        </div>
        <button class="btn-sair" onclick="sair()">Sair</button>
    </div>

    <div id="reader-container"></div>
    <div class="debug-bar" id="debug"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script>
    (function() {
        // ============ FIREBASE ============
        firebase.initializeApp({
            apiKey: "AIzaSyBLx0ECcSQdS8uKnaXzDIuygK7Hi3JTcuU",
            authDomain: "dshutili.firebaseapp.com",
            databaseURL: "https://dshutili-default-rtdb.firebaseio.com",
            projectId: "dshutili",
            storageBucket: "dshutili.firebasestorage.app",
            messagingSenderId: "1065134772507",
            appId: "1:1065134772507:web:aed91d6d1953f69cb403be",
            measurementId: "G-B3NS6YKTLV"
        });
        var db = firebase.database();

        // ============ VARIÁVEIS ============
        var contLeituras = 0;
        var contEnvios = 0;
        var startTime = Date.now();
        var lastData = '';
        var ultimoHistory = 0;
        var INTERVALO_HISTORY = 60000; // 60s entre saves no history
        var html5QrCode = null;

        // ============ DEBUG ============
        function log(msg, tipo) {
            var el = document.getElementById('debug');
            var line = document.createElement('div');
            line.className = 'line' + (tipo ? ' ' + tipo : '');
            line.textContent = new Date().toLocaleTimeString('pt-BR') + ' | ' + msg;
            el.appendChild(line);
            el.scrollTop = el.scrollHeight;
            if (el.children.length > 40) el.removeChild(el.firstChild);
        }

        // ============ UPTIME ============
        setInterval(function() {
            var diff = Math.floor((Date.now() - startTime) / 1000);
            var h = Math.floor(diff / 3600);
            var m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
            var s = (diff % 60).toString().padStart(2, '0');
            document.getElementById('uptime').textContent = h > 0 ? h + ':' + m + ':' + s : m + ':' + s;
        }, 1000);

        // ============ HEARTBEAT ============
        function enviarHeartbeat() {
            db.ref('leitor_status').update({
                ativo: true,
                lastHeartbeat: Date.now(),
                leituras: contLeituras,
                uptime: Math.floor((Date.now() - startTime) / 1000)
            }).catch(function(e) { log('Heartbeat erro: ' + e.message, 'error'); });
        }
        setInterval(enviarHeartbeat, 10000);
        enviarHeartbeat();

        // Marcar offline ao sair
        window.addEventListener('beforeunload', function() {
            db.ref('leitor_status').update({ ativo: false, desconectadoEm: Date.now() });
        });

        // ============ PARSE QR (texto puro) ============
        function parseQR(texto) {
            var dados = {};
            var linhas = texto.split('\n');
            for (var i = 0; i < linhas.length; i++) {
                var linha = linhas[i].trim();
                if (!linha || linha.indexOf(':') === -1) continue;

                var partes = linha.split(':');
                var tag = partes[0].trim();
                var valorStr = partes.slice(1).join(':').trim();

                var match = valorStr.match(/([-\d.]+)\s*(.*)/);
                if (!match) continue;

                var valor = parseFloat(match[1]);
                var unidade = match[2].trim() || '';
                if (isNaN(valor)) continue;

                var chave = tag
                    .replace(/\//g, '_')
                    .replace(/\s+/g, '_')
                    .replace(/[^a-zA-Z0-9_]/g, '')
                    .replace(/__+/g, '_');

                dados[chave] = { v: valor, u: unidade };
            }
            return dados;
        }

        // ============ PROCESSAR QR ============
        function processQR(texto) {
            // Ignorar se igual ao último (não conta, não loga)
            if (texto === lastData) return;
            lastData = texto;

            // Agora sim conta como leitura real
            contLeituras++;
            document.getElementById('leituras').textContent = contLeituras;
            log('QR lido (' + texto.length + ' bytes)', 'success');

            // Parse
            var dados = parseQR(texto);
            var numVars = Object.keys(dados).length;
            if (numVars === 0) {
                log('Nenhuma variável extraída', 'error');
                return;
            }

            // Metadata
            dados._readAt = new Date().toLocaleString('pt-BR');
            dados._timestamp = Date.now();

            // Enviar para current
            db.ref('current').update(dados).then(function() {
                contEnvios++;
                document.getElementById('envios').textContent = contEnvios;
                document.getElementById('status').textContent = '✅ Online';
                document.getElementById('status').className = 'status';
                log('✅ current OK — ' + numVars + ' vars', 'success');
                enviarHeartbeat();
            }).catch(function(e) {
                log('❌ Erro: ' + e.message, 'error');
                document.getElementById('status').textContent = '❌ Erro';
                document.getElementById('status').className = 'status error';
            });

            // History (máximo 1x por minuto)
            var agora = Date.now();
            if (agora - ultimoHistory >= INTERVALO_HISTORY) {
                ultimoHistory = agora;
                db.ref('history').push(dados).then(function() {
                    log('📊 history salvo');
                }).catch(function(e) {
                    log('history erro: ' + e.message, 'error');
                });
            }
        }

        // ============ LIMPEZA AUTOMÁTICA (>7 dias, a cada 2h) ============
        function limparHistorico() {
            var limite = Date.now() - (7 * 24 * 60 * 60 * 1000);
            db.ref('history').orderByChild('_timestamp').endAt(limite).once('value', function(snap) {
                var updates = {};
                snap.forEach(function(child) { updates[child.key] = null; });
                var total = Object.keys(updates).length;
                if (total > 0) {
                    db.ref('history').update(updates).then(function() {
                        log('🧹 Limpou ' + total + ' registros antigos');
                    });
                }
            }).catch(function() {});
        }
        setTimeout(limparHistorico, 60000); // 1min após iniciar
        setInterval(limparHistorico, 7200000); // a cada 2h

        // ============ RECONEXÃO ============
        window.addEventListener('online', function() {
            log('🌐 Internet voltou', 'success');
            setTimeout(function() { db.goOnline(); enviarHeartbeat(); }, 2000);
        });
        window.addEventListener('offline', function() {
            log('⚠️ Sem internet', 'error');
            document.getElementById('status').textContent = '⚠️ Offline';
            document.getElementById('status').className = 'status error';
        });

        // ============ CÂMERA ============
        function iniciarCamera() {
            html5QrCode = new Html5Qrcode("reader-container");

            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: function(vw, vh) {
                        var size = Math.min(vw, vh) * 0.85;
                        return { width: Math.floor(size), height: Math.floor(size) };
                    },
                    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
                },
                function(decodedText) { processQR(decodedText); },
                function() {} // silencioso
            ).then(function() {
                log('📷 Câmera ativa', 'success');
                document.getElementById('status').textContent = '📷 Lendo...';
            }).catch(function(err) {
                log('❌ Câmera: ' + err, 'error');
                document.getElementById('status').textContent = '❌ Câmera';
                document.getElementById('status').className = 'status error';
                setTimeout(iniciarCamera, 3000);
            });
        }

        // ============ AUTH ============
        firebase.auth().onAuthStateChanged(function(user) {
            if (!user) { window.location.href = 'index.html'; }
            else { log('✅ Logado: ' + user.email); iniciarCamera(); }
        });

        // ============ SAIR ============
        window.sair = function() {
            if (html5QrCode) html5QrCode.stop().catch(function() {});
            db.ref('leitor_status').update({ ativo: false, desconectadoEm: Date.now() });
            localStorage.removeItem('modo_acesso');
            firebase.auth().signOut().then(function() { window.location.href = 'index.html'; });
        };
    })();
    </script>
</body>
</html>
