
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Reader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }
        #reader {
            width: 100%;
            height: 70vh;
        }
        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }
        #reader__dashboard_section_swaplink,
        #reader__dashboard_section_fileselection,
        #reader__header_message,
        #reader img { display: none !important; }
        .status {
            padding: 10px;
            text-align: center;
            font-size: 1em;
            color: #4fc3f7;
            background: #111;
        }
        .debug {
            background: #000;
            color: #0f0;
            font-family: monospace;
            font-size: 0.7em;
            padding: 8px;
            max-height: 25vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="reader"></div>
    <div class="status" id="status">Iniciando...</div>
    <div class="debug" id="debug"></div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        var debugEl = document.getElementById('debug');
        var statusEl = document.getElementById('status');
        var readCount = 0;
        var lastData = null;

        function log(msg) {
            var t = new Date().toLocaleTimeString('pt-BR');
            debugEl.innerHTML = '[' + t + '] ' + msg + '<br>' + debugEl.innerHTML;
        }

        // ===== FIREBASE (sem auth — regras abertas por enquanto) =====
        firebase.initializeApp({
            apiKey: "AIzaSyBLx0ECcSQdS8uKnaXzDIuygK7Hi3JTcuU",
            authDomain: "dshutili.firebaseapp.com",
            databaseURL: "https://dshutili-default-rtdb.firebaseio.com",
            projectId: "dshutili",
            storageBucket: "dshutili.firebasestorage.app",
            messagingSenderId: "1065134772507",
            appId: "1:1065134772507:web:aed91d6d1953f69cb403be"
        });
        var db = firebase.database();
        log('🔥 Firebase conectado');

        // ===== PARSER =====
        function parsearTexto(texto) {
            var linhas = texto.split('\n');
            var tags = [];
            for (var i = 0; i < linhas.length; i++) {
                var linha = linhas[i].trim();
                if (!linha) continue;
                var idx = linha.lastIndexOf(':');
                if (idx < 0) continue;
                var nome = linha.substring(0, idx).trim();
                var resto = linha.substring(idx + 1).trim();
                if (!nome || !resto) continue;
                var match = resto.match(/^(-?\d+\.?\d*)\s*(.*)/);
                if (match) {
                    var id = nome.replace(/[\/\s]+/g, '_').replace(/[^a-zA-Z0-9_]/g, '').substring(0, 30);
                    tags.push({ id: id, nome: nome, v: parseFloat(match[1]), u: match[2] || '' });
                }
            }
            return tags;
        }

        // ===== PROCESSAR QR =====
        function processQR(text) {
            var tags = parsearTexto(text);
            if (tags.length === 0) {
                log('⚠️ 0 vars');
                return;
            }

            // Checar duplicata
            var check = '';
            for (var i = 0; i < tags.length; i++) check += tags[i].id + ':' + tags[i].v + ';';
            if (check === lastData) return;
            lastData = check;

            // Montar dados
            var dados = {
                _timestamp: Date.now(),
                _readAt: new Date().toLocaleString('pt-BR'),
                _varCount: tags.length
            };
            for (var j = 0; j < tags.length; j++) {
                dados[tags[j].id] = { nome: tags[j].nome, v: tags[j].v, u: tags[j].u };
            }

            // Enviar
            readCount++;
            log('📊 #' + readCount + ' | ' + tags.length + ' vars | Enviando...');
            statusEl.textContent = '✅ #' + readCount + ' | ' + tags.length + ' vars';

            db.ref('current').set(dados)
                .then(function() { log('✅ current OK'); })
                .catch(function(e) { log('❌ ' + e.message); });

            db.ref('history').push().set(dados)
                .then(function() { log('✅ history OK'); })
                .catch(function(e) { log('❌ ' + e.message); });
        }

        // ===== CÂMERA =====
        log('📷 Abrindo câmera...');
        var scanner = new Html5Qrcode("reader");

        scanner.start(
            { facingMode: "environment" },
            { fps: 10 },
            function(text) { processQR(text); },
            function() {}
        ).then(function() {
            log('✅ Câmera ativa!');
            statusEl.textContent = '📷 Aponte pro QR...';
        }).catch(function(err) {
            log('❌ ' + err);
            statusEl.textContent = '❌ Erro: ' + err;
        });
    </script>
</body>
</html>
