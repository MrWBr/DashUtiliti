
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Reader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }
        #reader {
            width: 100%;
            height: 60vh;
        }
        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }
        #reader__dashboard_section_swaplink,
        #reader__dashboard_section_fileselection,
        #reader__header_message,
        #reader img { display: none !important; }

        .status-bar {
            padding: 10px;
            background: #111;
            text-align: center;
        }
        .status-bar .status {
            font-size: 0.9em;
            color: #4fc3f7;
        }
        .status-bar .last-read {
            font-size: 0.7em;
            color: #888;
            margin-top: 3px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 8px;
            background: #1a1a2e;
            font-size: 0.75em;
        }
        .stats div { text-align: center; }
        .stats .value { font-size: 1.2em; font-weight: bold; color: #4fc3f7; }
        .btn-logout {
            position: fixed;
            top: 5px;
            right: 5px;
            background: #333;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.7em;
            z-index: 100;
        }
        .debug {
            background: rgba(0,0,0,0.92);
            color: #0f0;
            font-family: monospace;
            font-size: 0.65em;
            padding: 6px;
            max-height: 18vh;
            overflow-y: auto;
        }
        .pulse { animation: pulse 1s ease-in-out; }
        @keyframes pulse {
            0% { background: #111; }
            50% { background: #1b5e20; }
            100% { background: #111; }
        }
    </style>
</head>
<body>
    <button class="btn-logout" onclick="logout()">Sair</button>
    
    <div id="reader"></div>
    
    <div class="status-bar" id="status-bar">
        <div class="status" id="status">Iniciando câmera...</div>
        <div class="last-read" id="last-read">Aguardando leitura...</div>
    </div>
    <div class="stats">
        <div>
            <div class="value" id="read-count">0</div>
            <div>Leituras</div>
        </div>
        <div>
            <div class="value" id="vars-count">0</div>
            <div>Variáveis</div>
        </div>
        <div>
            <div class="value" id="uptime">00:00</div>
            <div>Uptime</div>
        </div>
    </div>
    
    <!-- Debug - REMOVA depois que funcionar -->
    <div class="debug" id="debug"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBLx0ECcSQdS8uKnaXzDIuygK7Hi3JTcuU",
            authDomain: "dshutili.firebaseapp.com",
            databaseURL: "https://dshutili-default-rtdb.firebaseio.com",
            projectId: "dshutili",
            storageBucket: "dshutili.firebasestorage.app",
            messagingSenderId: "1065134772507",
            appId: "1:1065134772507:web:aed91d6d1953f69cb403be",
            measurementId: "G-B3NS6YKTLV"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        // ===== DEBUG =====
        var debugEl = document.getElementById('debug');
        function log(msg) {
            var time = new Date().toLocaleTimeString('pt-BR');
            debugEl.innerHTML = '[' + time + '] ' + msg + '<br>' + debugEl.innerHTML;
            var lines = debugEl.innerHTML.split('<br>');
            if (lines.length > 12) {
                debugEl.innerHTML = lines.slice(0, 12).join('<br>');
            }
        }

        // Verificar autenticação
        firebase.auth().onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                log('✅ Logado: ' + user.email);
                initReader();
            }
        });

        var readCount = 0;
        var startTime = Date.now();
        var lastData = null;
        var scanner = null;

        // ============================================================
        // PARSER PARA FORMATO DO FACTORYTALK
        // Formato: "NOME: valor unidade\n" (uma variável por linha)
        // ============================================================
        function parsearTextoFactoryTalk(texto) {
            var linhas = texto.split('\n');
            var tags = [];

            for (var i = 0; i < linhas.length; i++) {
                var linha = linhas[i].trim();
                if (!linha) continue;

                var idxDoisPontos = linha.lastIndexOf(':');
                if (idxDoisPontos < 0) continue;

                var nome = linha.substring(0, idxDoisPontos).trim();
                var resto = linha.substring(idxDoisPontos + 1).trim();

                if (!nome || !resto) continue;

                var match = resto.match(/^(-?\d+\.?\d*)\s*(.*)/);
                
                if (match) {
                    var valor = parseFloat(match[1]);
                    var unidade = match[2] || '';
                    
                    var id = nome
                        .replace(/[\/\s]+/g, '_')
                        .replace(/[^a-zA-Z0-9_]/g, '')
                        .substring(0, 30);

                    tags.push({
                        id: id,
                        nome: nome,
                        v: valor,
                        u: unidade
                    });
                }
            }

            return tags;
        }

        // ============================================================
        // PROCESSAR QR
        // ============================================================
        function processQR(decodedText) {
            var tags = [];

            // Tentar JSON primeiro
            try {
                var dados = JSON.parse(decodedText);
                log('📋 JSON válido');
                
                if (dados.d && Array.isArray(dados.d)) {
                    tags = dados.d;
                } else {
                    var keys = Object.keys(dados);
                    for (var k = 0; k < keys.length; k++) {
                        var key = keys[k];
                        var val = dados[key];
                        if (typeof val === 'number') {
                            tags.push({ id: key, nome: key, v: val, u: '' });
                        } else if (typeof val === 'object' && val && 'v' in val) {
                            tags.push({ id: key, nome: key, v: val.v, u: val.u || '' });
                        }
                    }
                }
            } catch(e) {
                // Não é JSON — parsear como texto FactoryTalk
                log('📋 Texto FactoryTalk (' + decodedText.length + 'b)');
                tags = parsearTextoFactoryTalk(decodedText);
            }

            if (tags.length === 0) {
                log('⚠️ Nenhuma variável extraída!');
                return;
            }

            log('📊 ' + tags.length + ' variáveis parseadas');

            // Montar objeto para Firebase
            var dadosFirebase = {
                _timestamp: Date.now(),
                _readAt: new Date().toLocaleString('pt-BR'),
                _varCount: tags.length
            };

            for (var i = 0; i < tags.length; i++) {
                var tag = tags[i];
                dadosFirebase[tag.id] = {
                    nome: tag.nome,
                    v: tag.v,
                    u: tag.u
                };
            }

            // Evitar duplicatas
            var checkStr = '';
            for (var j = 0; j < tags.length; j++) {
                checkStr += tags[j].id + ':' + tags[j].v + ';';
            }
            if (checkStr === lastData) {
                log('⏭️ Dados iguais');
                return;
            }
            lastData = checkStr;

            // Enviar para Firebase
            log('☁️ Enviando ao Firebase...');
            db.ref('current').set(dadosFirebase)
                .then(function() {
                    log('✅ Firebase current OK!');
                })
                .catch(function(e) {
                    log('❌ Firebase ERRO: ' + e.message);
                });
            
            db.ref('history').push().set(dadosFirebase)
                .then(function() {
                    log('✅ Firebase history OK!');
                })
                .catch(function(e) {
                    log('❌ History ERRO: ' + e.message);
                });

            // Atualizar UI
            readCount++;
            document.getElementById('read-count').textContent = readCount;
            document.getElementById('vars-count').textContent = tags.length;
            document.getElementById('last-read').textContent = 'Última: ' + dadosFirebase._readAt;
            document.getElementById('status').textContent = '✅ #' + readCount + ' | ' + tags.length + ' vars';
            document.getElementById('status-bar').classList.add('pulse');
            setTimeout(function() { 
                document.getElementById('status-bar').classList.remove('pulse');
                document.getElementById('status').textContent = '✅ Câmera ativa - Lendo...';
            }, 2000);

            log('✅ LEITURA #' + readCount + ' OK!');
        }

        // ============================================================
        // INICIAR LEITOR - COM QRBOX GRANDE (90% da tela)
        // ============================================================
        function initReader() {
            log('📷 Iniciando câmera...');
            document.getElementById('status').textContent = '📷 Iniciando câmera...';

            scanner = new Html5Qrcode("reader");

            var config = {
                fps: 10,
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    // 90% da área visível — grande mas definido
                    var w = Math.floor(viewfinderWidth * 0.9);
                    var h = Math.floor(viewfinderHeight * 0.9);
                    return { width: w, height: h };
                },
                formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true
                }
            };

            scanner.start(
                { facingMode: "environment" },
                config,
                function(decodedText) {
                    processQR(decodedText);
                },
                function() {}
            ).then(function() {
                log('✅ Câmera ativa! FPS=10, qrbox=90%');
                document.getElementById('status').textContent = '✅ Câmera ativa - Lendo...';
            }).catch(function(err) {
                log('❌ Câmera erro: ' + err);
                // Tentar sem qrbox como fallback
                log('🔄 Tentando fallback sem qrbox...');
                scanner.start(
                    { facingMode: "environment" },
                    { fps: 10, formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE] },
                    function(decodedText) {
                        processQR(decodedText);
                    },
                    function() {}
                ).then(function() {
                    log('✅ Fallback OK!');
                    document.getElementById('status').textContent = '✅ Câmera ativa - Lendo...';
                }).catch(function(err2) {
                    log('❌ Fallback falhou: ' + err2);
                    document.getElementById('status').textContent = '❌ Erro câmera';
                });
            });
        }

        // Uptime
        setInterval(function() {
            var elapsed = Math.floor((Date.now() - startTime) / 1000);
            var hrs = Math.floor(elapsed / 3600);
            var min = Math.floor((elapsed % 3600) / 60).toString();
            var sec = (elapsed % 60).toString();
            if (min.length < 2) min = '0' + min;
            if (sec.length < 2) sec = '0' + sec;
            document.getElementById('uptime').textContent = 
                hrs > 0 ? hrs + ':' + min + ':' + sec : min + ':' + sec;
        }, 1000);

        // Wake Lock
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(function(){});
        }

        function logout() {
            localStorage.removeItem('modo_acesso');
            localStorage.removeItem('login_timestamp');
            if (scanner) {
                scanner.stop().then(function() {
                    firebase.auth().signOut().then(function() {
                        window.location.href = 'index.html';
                    });
                }).catch(function() {
                    firebase.auth().signOut().then(function() {
                        window.location.href = 'index.html';
                    });
                });
            } else {
                firebase.auth().signOut().then(function() {
                    window.location.href = 'index.html';
                });
            }
        }
    </script>
</body>
</html>
