
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Teste Mínimo</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; }
        #reader { width: 100%; height: 70vh; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        #reader__dashboard_section_swaplink,
        #reader__dashboard_section_fileselection,
        #reader__header_message,
        #reader img { display: none !important; }
        #log { padding: 10px; font-size: 12px; max-height: 30vh; overflow-y: auto; }
        .ok { color: #4caf50; font-weight: bold; padding: 10px; text-align: center; font-size: 1.2em; }
    </style>
</head>
<body>
    <div id="reader"></div>
    <div class="ok" id="status">Aguardando...</div>
    <div id="log"></div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        var logEl = document.getElementById('log');
        var statusEl = document.getElementById('status');
        var count = 0;

        function log(msg) {
            logEl.innerHTML = msg + '<br>' + logEl.innerHTML;
        }

        log('Iniciando...');

        var scanner = new Html5Qrcode("reader");

        scanner.start(
            { facingMode: "environment" },
            { fps: 5 },
            function(text) {
                count++;
                statusEl.textContent = '✅ LEITURA #' + count + ' (' + text.length + ' bytes)';
                statusEl.style.background = '#1b5e20';
                log('#' + count + ': ' + text.substring(0, 60) + '...');
            },
            function() {}
        ).then(function() {
            log('✅ Câmera ativa!');
            statusEl.textContent = '📷 Câmera ativa - aponte pro QR';
        }).catch(function(err) {
            log('❌ ERRO: ' + err);
            statusEl.textContent = '❌ ' + err;
        });
    </script>
</body>
</html>
