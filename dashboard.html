
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilidades - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: #1a1a2e;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header h1 { font-size: 1.1em; color: #4fc3f7; }
        .header .connection {
            font-size: 0.8em;
            padding: 4px 10px;
            border-radius: 12px;
            background: #1b5e20;
            color: #a5d6a7;
        }
        .header .connection.offline { background: #b71c1c; color: #ef9a9a; }
        .header button {
            background: #333;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .tabs {
            display: flex;
            background: #16213e;
            border-bottom: 1px solid #333;
        }
        .tabs button {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.9em;
            border-bottom: 2px solid transparent;
        }
        .tabs button.active {
            color: #4fc3f7;
            border-bottom-color: #4fc3f7;
        }
        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; }

        /* Cards de valores */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 12px;
            border-left: 3px solid #4fc3f7;
        }
        .card .label {
            font-size: 0.7em;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .card .value {
            font-size: 1.4em;
            font-weight: bold;
            color: #fff;
        }
        .card .unit {
            font-size: 0.75em;
            color: #666;
            margin-left: 4px;
        }
        .card.alarm { border-left-color: #ef5350; }
        .card.alarm .value { color: #ef5350; }
        .card.alarm .label { color: #ef5350; }
        .card.warning { border-left-color: #ffa726; }
        .card.warning .value { color: #ffa726; }

        /* Gráficos */
        .chart-container {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .chart-container h3 {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 10px;
        }
        .chart-canvas {
            width: 100%;
            height: 200px;
        }

        /* Tabela de log */
        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8em;
        }
        .log-table th {
            background: #16213e;
            padding: 8px;
            text-align: left;
            color: #4fc3f7;
            position: sticky;
            top: 0;
        }
        .log-table td {
            padding: 6px 8px;
            border-bottom: 1px solid #222;
        }
        .log-table tr:hover { background: #1a1a2e; }

        .last-update {
            text-align: center;
            font-size: 0.75em;
            color: #666;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏭 Utilidades - Mondelēz</h1>
        <span class="connection" id="conn-status">● Conectado</span>
        <button onclick="logout()">Sair</button>
    </div>

    <div class="tabs">
        <button class="active" onclick="showTab('realtime')">⚡ Tempo Real</button>
        <button onclick="showTab('trends')">📈 Tendências</button>
        <button onclick="showTab('log')">📋 Log</button>
    </div>

    <!-- ABA: Tempo Real -->
    <div class="tab-content active" id="tab-realtime">
        <div class="cards-grid" id="cards-container"></div>
        <div class="last-update" id="last-update">Aguardando dados...</div>
    </div>

    <!-- ABA: Tendências -->
    <div class="tab-content" id="tab-trends">
        <div id="charts-container"></div>
    </div>

    <!-- ABA: Log -->
    <div class="tab-content" id="tab-log">
        <table class="log-table">
            <thead>
                <tr>
                    <th>Horário</th>
                    <th>Variáveis</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="log-body"></tbody>
        </table>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script>
        // ⚠️ SUBSTITUA com suas credenciais do Firebase
        var firebaseConfig = {
           apiKey: "AIzaSyBLx0ECcSQdS8uKnaXzDIuygK7Hi3JTcuU",
         authDomain: "dshutili.firebaseapp.com",
            databaseURL: "https://dshutili-default-rtdb.firebaseio.com",
             projectId: "dshutili",
        storageBucket: "dshutili.firebasestorage.app",
        messagingSenderId: "1065134772507",
        appId: "1:1065134772507:web:aed91d6d1953f69cb403be",
         measurementId: "G-B3NS6YKTLV"
        };

        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        // Verificar autenticação
        firebase.auth().onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                initDashboard();
            }
        });

        // ============ NOMES AMIGÁVEIS DAS TAGS ============
        var nomesTags = {
            "TO8001_4": "Torres Resfriamento",
            "TO8006": "Retorno Torres",
            "CH8007": "Chiller 8007",
            "CH8008": "Chiller 8008",
            "CH8011_14": "Chillers 8011/14",
            "CV8004": "Condensador Retorno",
            "AR_DM": "Ar Comp Dry Mix",
            "AR_BOGE": "Ar Comp Boge",
            "AR_CHOCO": "Ar Comp Chocolate",
            "VAC_DM": "Vácuo Dry Mix",
            "AGUA_6C": "Água Gelada 6°C",
            "PRES_BG": "Pressão B&G",
            "PRES_CHOCO": "Pressão Vapor Choco",
            "NIV_CD8006": "Nível TQ CD8006/7",
            "NIV_CD8006_7": "Nível TQ CD8006/7",
            "AR_CHOCO_Q": "Ar Choco Qualidade",
            "AR_CHOCO_QUAL": "Ar Choco Qualidade",
            "AR_BG_Q": "Ar B&G Qualidade",
            "AR_BG_QUAL": "Ar B&G Qualidade"
        };

        // Histórico para gráficos de tendência
        var trendData = {};
        var MAX_TREND_POINTS = 200;
        var charts = {};

        function initDashboard() {
            // Escutar dados em tempo real
            db.ref('current').on('value', function(snapshot) {
                var data = snapshot.val();
                if (!data) return;
                
                updateCards(data);
                updateTrends(data);
                updateConnectionStatus(true);
                
                document.getElementById('last-update').textContent = 
                    'Última atualização: ' + (data._readAt || new Date().toLocaleString('pt-BR'));
            });

            // Detectar desconexão
            db.ref('.info/connected').on('value', function(snap) {
                updateConnectionStatus(snap.val());
            });

            // Carregar histórico inicial para log
            db.ref('history').limitToLast(50).once('value', function(snapshot) {
                snapshot.forEach(function(child) {
                    addToLog(child.val());
                });
            });

            // Escutar novas entradas no log
            db.ref('history').limitToLast(1).on('child_added', function(snapshot) {
                addToLog(snapshot.val());
            });
        }

        // ============ EXTRAIR VARIÁVEIS DO DADO (qualquer formato) ============
        function extrairVariaveis(data) {
            var vars = [];

            // Formato 1: tem array "d" com [{id, v, u, a}, ...]
            if (data.d && Array.isArray(data.d)) {
                for (var i = 0; i < data.d.length; i++) {
                    var item = data.d[i];
                    vars.push({
                        id: item.id || ('var_' + i),
                        valor: item.v,
                        unidade: item.u || '',
                        alerta: item.a || 0
                    });
                }
                return vars;
            }

            // Formato 2: chaves diretas com {v, u, a}
            var keys = Object.keys(data);
            for (var k = 0; k < keys.length; k++) {
                var key = keys[k];
                if (key.startsWith('_') || key === 'd') continue;
                
                var val = data[key];
                
                if (val !== null && typeof val === 'object' && 'v' in val) {
                    vars.push({
                        id: key,
                        valor: val.v,
                        unidade: val.u || '',
                        alerta: val.a || 0
                    });
                } else if (typeof val === 'number') {
                    vars.push({
                        id: key,
                        valor: val,
                        unidade: '',
                        alerta: 0
                    });
                }
            }

            return vars;
        }

        // ============ ATUALIZAR CARDS ============
        function updateCards(data) {
            var container = document.getElementById('cards-container');
            container.innerHTML = '';

            var vars = extrairVariaveis(data);

            for (var i = 0; i < vars.length; i++) {
                var v = vars[i];
                var cardClass = 'card';
                if (v.alerta === 1) cardClass += ' alarm';

                var nome = nomesTags[v.id] || v.id.replace(/_/g, ' ');
                var valorStr = (typeof v.valor === 'number') ? v.valor.toFixed(1) : v.valor;

                var card = document.createElement('div');
                card.className = cardClass;
                card.innerHTML = 
                    '<div class="label">' + nome + '</div>' +
                    '<div class="value">' + valorStr + '<span class="unit">' + v.unidade + '</span></div>';
                container.appendChild(card);
            }
        }

        // ============ ATUALIZAR TENDÊNCIAS ============
        function updateTrends(data) {
            var now = Date.now();
            var vars = extrairVariaveis(data);

            for (var i = 0; i < vars.length; i++) {
                var v = vars[i];
                if (typeof v.valor !== 'number') continue;

                if (!trendData[v.id]) trendData[v.id] = [];
                trendData[v.id].push({ time: now, value: v.valor });
                
                if (trendData[v.id].length > MAX_TREND_POINTS) {
                    trendData[v.id].shift();
                }
            }

            renderCharts();
        }

        function renderCharts() {
            var container = document.getElementById('charts-container');
            var keys = Object.keys(trendData);
            
            for (var k = 0; k < keys.length; k++) {
                var key = keys[k];
                var chartDivId = 'chart-' + key.replace(/[^a-zA-Z0-9]/g, '_');
                var canvasId = 'canvas-' + key.replace(/[^a-zA-Z0-9]/g, '_');
                var chartDiv = document.getElementById(chartDivId);
                
                if (!chartDiv) {
                    chartDiv = document.createElement('div');
                    chartDiv.className = 'chart-container';
                    chartDiv.id = chartDivId;
                    var nome = nomesTags[key] || key.replace(/_/g, ' ');
                    chartDiv.innerHTML = 
                        '<h3>' + nome + '</h3>' +
                        '<canvas id="' + canvasId + '" class="chart-canvas"></canvas>';
                    container.appendChild(chartDiv);
                }

                var canvas = document.getElementById(canvasId);
                if (!canvas) continue;
                
                var ctxChart = canvas.getContext('2d');
                var points = trendData[key];

                if (charts[key]) {
                    charts[key].data.labels = points.map(function(p) {
                        return new Date(p.time).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
                    });
                    charts[key].data.datasets[0].data = points.map(function(p) { return p.value; });
                    charts[key].update('none');
                } else {
                    charts[key] = new Chart(ctxChart, {
                        type: 'line',
                        data: {
                            labels: points.map(function(p) {
                                return new Date(p.time).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
                            }),
                            datasets: [{
                                label: nomesTags[key] || key,
                                data: points.map(function(p) { return p.value; }),
                                borderColor: '#4fc3f7',
                                backgroundColor: 'rgba(79, 195, 247, 0.1)',
                                borderWidth: 1.5,
                                pointRadius: 0,
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: {
                                    display: true,
                                    ticks: { color: '#666', maxTicksLimit: 6, font: { size: 10 } },
                                    grid: { color: '#222' }
                                },
                                y: {
                                    display: true,
                                    ticks: { color: '#666', font: { size: 10 } },
                                    grid: { color: '#222' }
                                }
                            }
                        }
                    });
                }
            }
        }

        // ============ LOG ============
        function addToLog(data) {
            if (!data) return;
            var tbody = document.getElementById('log-body');
            var row = document.createElement('tr');
            var varCount = data._varCount || '?';
            var hasAlerts = false;
            
            if (data.d && Array.isArray(data.d)) {
                for (var i = 0; i < data.d.length; i++) {
                    if (data.d[i].a === 1) { hasAlerts = true; break; }
                }
            }
            
            var statusHtml = hasAlerts 
                ? '<span style="color: #ef5350;">⚠ ALERTA</span>'
                : '<span style="color: #a5d6a7;">✓ OK</span>';
            
            row.innerHTML = 
                '<td>' + (data._readAt || '-') + '</td>' +
                '<td>' + varCount + ' vars</td>' +
                '<td>' + statusHtml + '</td>';
            tbody.insertBefore(row, tbody.firstChild);
            
            while (tbody.children.length > 100) {
                tbody.removeChild(tbody.lastChild);
            }
        }

        // ============ STATUS CONEXÃO ============
        function updateConnectionStatus(connected) {
            var el = document.getElementById('conn-status');
            if (connected) {
                el.textContent = '● Conectado';
                el.className = 'connection';
            } else {
                el.textContent = '● Offline';
                el.className = 'connection offline';
            }
        }

        // ============ TABS ============
        function showTab(tabName) {
            var tabs = document.querySelectorAll('.tab-content');
            for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
            var btns = document.querySelectorAll('.tabs button');
            for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'trends') {
                setTimeout(function() {
                    var chartKeys = Object.keys(charts);
                    for (var c = 0; c < chartKeys.length; c++) {
                        charts[chartKeys[c]].resize();
                    }
                }, 100);
            }
        }

        function logout() {
            firebase.auth().signOut().then(function() {
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
