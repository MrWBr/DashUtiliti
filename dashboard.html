
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilidades - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e1a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1f3a, #0d1117);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2f45;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header h1 { font-size: 1em; color: #4fc3f7; font-weight: 600; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .connection {
            font-size: 0.7em; padding: 3px 8px; border-radius: 10px;
            background: #1b5e20; color: #a5d6a7;
        }
        .connection.offline { background: #b71c1c; color: #ef9a9a; }
        .btn-logout {
            background: #333; color: #fff; border: none;
            padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.7em;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            padding: 8px 14px;
            background: #0d1117;
            border-bottom: 1px solid #1a1f3a;
        }
        .toolbar button {
            background: #1a2035;
            color: #4fc3f7;
            border: 1px solid #2a3050;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.72em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toolbar button:hover { background: #2a3050; }
        .toolbar button.active {
            background: #4fc3f7;
            color: #000;
            border-color: #4fc3f7;
        }

        .leitor-status {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px; background: #0d1117;
            border-bottom: 1px solid #1a1f3a; font-size: 0.7em;
        }
        .leitor-status .leitor-info { display: flex; align-items: center; gap: 8px; }
        .leitor-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #4caf50; animation: blink 2s infinite;
        }
        .leitor-dot.offline { background: #ef5350; animation: none; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .leitor-status .leitor-stats { display: flex; gap: 12px; color: #666; }
        .leitor-stats span { color: #888; }
        .leitor-stats .val { color: #4fc3f7; font-weight: 600; }

        .last-update {
            text-align: center; font-size: 0.7em; color: #555;
            padding: 6px; background: #0d1117;
        }

        .cards-container { padding: 10px; display: flex; flex-direction: column; gap: 6px; }

        .card-row {
            display: flex; align-items: center; background: #141929;
            border-radius: 8px; padding: 10px 12px; border-left: 3px solid #4fc3f7;
            gap: 10px; transition: background 0.2s;
        }
        .card-row:hover { background: #1a2035; }
        .card-row.alarm { border-left-color: #ef5350; background: #1a1015; }
        .card-row.alarm:hover { background: #251520; }

        .card-info { flex-shrink: 0; min-width: fit-content; padding-right: 8px; }

        .card-nome { font-size: 0.7em; color: #888; text-transform: uppercase;
                    letter-spacing: 0.3px;
                    white-space: nowrap;
                   }
        /* REMOVE overflow: hidden e text-overflow: ellipsis */
        .card-valor { font-size: 1.3em; font-weight: 700; color: #fff; margin-top: 2px; }
        .card-valor .unidade { font-size: 0.55em; color: #666; font-weight: 400; margin-left: 3px; }
        .card-row.alarm .card-valor { color: #ef5350; }
        .card-row.alarm .card-nome { color: #ef9a9a; }

        .card-spark { flex: 1; min-width: 60px; height: 50px; position: relative; }
        .card-spark canvas { width: 100%; height: 100%; display: block; }
        .spark-labels {
            position: absolute; top: 0; right: 2px; bottom: 0;
            display: flex; flex-direction: column; justify-content: space-between;
            pointer-events: none;
        }
        .spark-labels span { font-size: 0.5em; color: #555; font-family: monospace; }

        .card-trend { font-size: 1em; width: 20px; text-align: center; flex-shrink: 0; }
        .trend-up { color: #ef5350; }
        .trend-down { color: #4caf50; }
        .trend-stable { color: #555; }

        .section-title {
            font-size: 0.75em; color: #4fc3f7; text-transform: uppercase;
            letter-spacing: 1px; padding: 12px 12px 4px; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Utilidades - Online</h1>
        <div class="header-right">
            <span class="connection" id="conn-status">● Conectado</span>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
    </div>

    <div class="toolbar">
        <button onclick="abrirMiniWidget()" id="btn-widget">📌 Mini Widget</button>
        <button onclick="toggleNotificacoes()" id="btn-notif">🔔 Ativar Alertas</button>
    </div>

    <div class="leitor-status" id="leitor-bar">
        <div class="leitor-info">
            <div class="leitor-dot" id="leitor-dot"></div>
            <span id="leitor-label">Leitor: verificando...</span>
        </div>
        <div class="leitor-stats">
            <span>📖 <span class="val" id="leitor-leituras">0</span></span>
            <span>⏱️ <span class="val" id="leitor-uptime">00:00</span></span>
        </div>
    </div>

    <div class="last-update" id="last-update">Aguardando dados...</div>
    <div class="cards-container" id="cards-container"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBLx0ECcSQdS8uKnaXzDIuygK7Hi3JTcuU",
            authDomain: "dshutili.firebaseapp.com",
            databaseURL: "https://dshutili-default-rtdb.firebaseio.com",
            projectId: "dshutili",
            storageBucket: "dshutili.firebasestorage.app",
            messagingSenderId: "1065134772507",
            appId: "1:1065134772507:web:aed91d6d1953f69cb403be",
            measurementId: "G-B3NS6YKTLV"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        firebase.auth().onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                initDashboard();
            }
        });

        // ============ CONFIGURAÇÃO DAS TAGS (24 variáveis) ============
        var tagConfig = {
            // TEMPERATURAS
            "TO8001_2_3_4": { nome: "Torres C.A.G.", grupo: "temp", limiteAlto: 32, limiteBaixo: null, escalaMin: 20, escalaMax: 35 },
            "TO8006_Retorno": { nome: "Torre Wafer", grupo: "temp", limiteAlto: 35, limiteBaixo: null, escalaMin: 25, escalaMax: 40 },
            "CH8007": { nome: "Chiller 8007", grupo: "temp", limiteAlto: 2, limiteBaixo: -5, escalaMin: -8, escalaMax: 5 },
            "CH8008": { nome: "Chiller 8008", grupo: "temp", limiteAlto: 2, limiteBaixo: -5, escalaMin: -8, escalaMax: 5 },
            "CH8011_14": { nome: "Chillers 8011/14", grupo: "temp", limiteAlto: 2, limiteBaixo: -5, escalaMin: -8, escalaMax: 5 },
            "CV8004_Retorno": { nome: "Sala de gordura", grupo: "temp", limiteAlto: 50, limiteBaixo: null, escalaMin: 35, escalaMax: 55 },
            "Agua_6C": { nome: "Água Gelada 6°C", grupo: "agua", limiteAlto: 8, limiteBaixo: null, escalaMin: 3, escalaMax: 10 },
            "Temperatura_Ar_Comp_Chocolate": { nome: "Temp Ar Choco", grupo: "qualidade", limiteAlto: 50, limiteBaixo: null, escalaMin: 25, escalaMax: 60 },
            "Temperatura_Ar_Comp_BG": { nome: "Temp Ar B&G", grupo: "qualidade", limiteAlto: 50, limiteBaixo: null, escalaMin: 25, escalaMax: 60 },

            // SALAS DE CURA (NOVAS)
            "Temperatura_Sala_Cura_Bubba": { nome: "Sala Cura Bubba", grupo: "cura", limiteAlto: 17, limiteBaixo: 13, escalaMin: 8, escalaMax: 22 },
            "Temperatura_Sala_Cura_Chiclets": { nome: "Sala Cura Chiclets", grupo: "cura", limiteAlto: 14, limiteBaixo: 10, escalaMin: 8, escalaMax: 22 },
            "Temperatura_Sala_Cura_Trident": { nome: "Sala Cura Trident", grupo: "cura", limiteAlto: 15, limiteBaixo: 10, escalaMin: 8, escalaMax: 22 },
            "Umidade_Sala_Cura_Bubba": { nome: "Umid. Cura Bubba", grupo: "cura", limiteAlto: 35, limiteBaixo: 30, escalaMin: 15, escalaMax: 45 },
            "Umidade_Sala_Cura_Chiclets": { nome: "Umid. Cura Chiclets", grupo: "cura", limiteAlto: 35, limiteBaixo: 30, escalaMin: 15, escalaMax: 45 },
            "Umidade_Sala_Cura_Trident": { nome: "Umid. Cura Trident", grupo: "cura", limiteAlto: 35, limiteBaixo: 30, escalaMin: 15, escalaMax: 45 },

            // AR COMPRIMIDO / VÁCUO
            "Ar_Comp_DM": { nome: "Ar Comp Dry Mix", grupo: "ar", limiteAlto: null, limiteBaixo: 5.5, escalaMin: 4, escalaMax: 8 },
            "Ar_Comp_DM_Boge": { nome: "Ar Comp Boge", grupo: "ar", limiteAlto: null, limiteBaixo: 5.0, escalaMin: 4, escalaMax: 8 },
            "Ar_Comp_Choco": { nome: "Ar Comp Chocolate", grupo: "ar", limiteAlto: null, limiteBaixo: 5.5, escalaMin: 4, escalaMax: 8 },
            "Vacuo_Dry_Mix": { nome: "Vácuo Dry Mix", grupo: "ar", limiteAlto: null, limiteBaixo: 15, escalaMin: 10, escalaMax: 30 },

            // VAPOR / PRESSÃO
            "Pressao_Cavalete_BG": { nome: "Pressão Cavalete B&G", grupo: "vapor", limiteAlto: null, limiteBaixo: 10, escalaMin: 8, escalaMax: 15 },
            "Pressao_Vapor_Choco": { nome: "Pressão Vapor Choco", grupo: "vapor", limiteAlto: null, limiteBaixo: 5, escalaMin: 3, escalaMax: 10 },
            "Nivel_TQ_CD8006_7": { nome: "Nível TQ CD8006/7", grupo: "vapor", limiteAlto: null, limiteBaixo: 40, escalaMin: 20, escalaMax: 100 },

            // QUALIDADE DO AR
            "Umidade_Ar_Comp_Chocolate": { nome: "Umidade Ar Choco", grupo: "qualidade", limiteAlto: 25, limiteBaixo: null, escalaMin: 0, escalaMax: 35 },
            "Umidade_Ar_Comp_BG": { nome: "Umidade Ar B&G", grupo: "qualidade", limiteAlto: 25, limiteBaixo: null, escalaMin: 0, escalaMax: 35 }
        };

        var grupos = {
            "temp": "Temperaturas",
            "cura": "Salas de Cura",
            "ar": "Ar Comprimido / Vácuo",
            "agua": "Água",
            "vapor": "Vapor / Pressão",
            "qualidade": "Qualidade do Ar"
        };

        var historico = {};
        var MAX_HIST = 30;
        var notificacoesAtivas = false;
        var alarmesAtivos = {};
        var miniWidgetWindow = null;
        var ultimosDados = null;

        function initDashboard() {
            db.ref('current').on('value', function(snapshot) {
                var data = snapshot.val();
                if (!data) return;
                
                ultimosDados = data;
                atualizarHistorico(data);
                renderCards(data);
                updateConnectionStatus(true);
                verificarAlarmes(data);
                atualizarMiniWidget(data);
                
                document.getElementById('last-update').textContent = 
                    '🔄 Última atualização: ' + (data._readAt || new Date().toLocaleString('pt-BR'));
            });

            db.ref('leitor_status').on('value', function(snapshot) {
                atualizarStatusLeitor(snapshot.val());
            });

            db.ref('.info/connected').on('value', function(snap) {
                updateConnectionStatus(snap.val());
            });
        }

        // ============ NOTIFICAÇÕES ============
        function toggleNotificacoes() {
            var btn = document.getElementById('btn-notif');
            if (notificacoesAtivas) {
                notificacoesAtivas = false;
                btn.textContent = '🔔 Ativar Alertas';
                btn.classList.remove('active');
                return;
            }
            if (!('Notification' in window)) { alert('Navegador não suporta notificações.'); return; }
            if (Notification.permission === 'granted') {
                notificacoesAtivas = true;
                btn.textContent = '🔕 Desativar Alertas';
                btn.classList.add('active');
            } else if (Notification.permission !== 'denied') {
                Notification.requestPermission().then(function(p) {
                    if (p === 'granted') {
                        notificacoesAtivas = true;
                        btn.textContent = '🔕 Desativar Alertas';
                        btn.classList.add('active');
                    }
                });
            } else { alert('Notificações bloqueadas. Libere nas configurações.'); }
        }

        function verificarAlarmes(data) {
            if (!notificacoesAtivas) return;
            var keys = Object.keys(data);
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                if (key.startsWith('_')) continue;
                var val = data[key];
                var valor = null;
                if (val && typeof val === 'object' && 'v' in val) { valor = val.v; }
                else if (typeof val === 'number') { valor = val; }
                if (valor === null) continue;
                var cfg = tagConfig[key];
                if (!cfg) continue;
                var nome = cfg.nome || key;
                var emAlarme = false;
                var msg = '';
                if (cfg.limiteAlto !== null && cfg.limiteAlto !== undefined && valor > cfg.limiteAlto) {
                    emAlarme = true;
                    msg = nome + ': ' + valor.toFixed(1) + ' (limite alto: ' + cfg.limiteAlto + ')';
                }
                if (cfg.limiteBaixo !== null && cfg.limiteBaixo !== undefined && valor < cfg.limiteBaixo) {
                    emAlarme = true;
                    msg = nome + ': ' + valor.toFixed(1) + ' (limite baixo: ' + cfg.limiteBaixo + ')';
                }
                if (emAlarme && !alarmesAtivos[key]) {
                    alarmesAtivos[key] = true;
                    enviarNotificacao('🚨 ALARME - Utilidades', msg);
                } else if (!emAlarme && alarmesAtivos[key]) {
                    delete alarmesAtivos[key];
                    enviarNotificacao('✅ Normalizado', nome + ': ' + valor.toFixed(1));
                }
            }
        }

        function enviarNotificacao(titulo, corpo) {
            if (Notification.permission === 'granted') {
                new Notification(titulo, { body: corpo, tag: 'utilidades-alarme', requireInteraction: true });
            }
        }

        // ============ MINI WIDGET ============
        function abrirMiniWidget() {
            if (miniWidgetWindow && !miniWidgetWindow.closed) { miniWidgetWindow.focus(); return; }
            var largura = 300; var altura = 550;
            var esquerda = screen.width - largura - 20; var topo = 50;
            miniWidgetWindow = window.open('', 'mini_widget',
                'width=' + largura + ',height=' + altura + ',left=' + esquerda + ',top=' + topo +
                ',resizable=yes,scrollbars=yes,toolbar=no,menubar=no,location=no,status=no');
            if (!miniWidgetWindow) { alert('Popup bloqueado! Permita popups.'); return; }
            var doc = miniWidgetWindow.document;
            doc.open();
            doc.write('<!DOCTYPE html><html><head><title>Mini Widget</title>');
            doc.write('<style>');
            doc.write('* { margin: 0; padding: 0; box-sizing: border-box; }');
            doc.write('body { font-family: -apple-system, sans-serif; background: #0a0e1a; color: #e0e0e0; padding: 8px; font-size: 12px; }');
            doc.write('.header { text-align: center; color: #4fc3f7; font-size: 11px; padding: 6px 0; border-bottom: 1px solid #2a2f45; margin-bottom: 6px; font-weight: 600; }');
            doc.write('.item { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-radius: 4px; margin-bottom: 2px; background: #141929; }');
            doc.write('.item.alarm { background: #1a1015; border-left: 2px solid #ef5350; }');
            doc.write('.item .nome { color: #888; font-size: 10px; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }');
            doc.write('.item .valor { font-weight: 700; color: #fff; font-size: 12px; }');
            doc.write('.item.alarm .valor { color: #ef5350; }');
            doc.write('.item .unidade { color: #555; font-size: 9px; margin-left: 2px; }');
            doc.write('.grupo { color: #4fc3f7; font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; padding: 5px 4px 2px; font-weight: 600; }');
            doc.write('.update { text-align: center; color: #444; font-size: 9px; padding: 4px; margin-top: 4px; }');
            doc.write('</style></head><body>');
            doc.write('<div class="header">Utilidades - Online</div>');
            doc.write('<div id="widget-content">Aguardando dados...</div>');
            doc.write('<div class="update" id="widget-update"></div>');
            doc.write('</body></html>');
            doc.close();
            if (ultimosDados) { setTimeout(function() { atualizarMiniWidget(ultimosDados); }, 200); }
            document.getElementById('btn-widget').classList.add('active');
            var checkClosed = setInterval(function() {
                if (miniWidgetWindow && miniWidgetWindow.closed) {
                    clearInterval(checkClosed); miniWidgetWindow = null;
                    document.getElementById('btn-widget').classList.remove('active');
                }
            }, 1000);
        }

        function atualizarMiniWidget(data) {
            if (!miniWidgetWindow || miniWidgetWindow.closed) return;
            var doc = miniWidgetWindow.document;
            var container = doc.getElementById('widget-content');
            if (!container) return;

            var vars = [];
            var keys = Object.keys(data);
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                if (key.startsWith('_')) continue;
                var val = data[key];
                if (val && typeof val === 'object' && 'v' in val) {
                    vars.push({ id: key, nome: val.nome || key, v: val.v, u: val.u || '' });
                } else if (typeof val === 'number') {
                    vars.push({ id: key, nome: key, v: val, u: '' });
                }
            }

            var gruposOrdem = ['temp', 'cura', 'ar', 'agua', 'vapor', 'qualidade', 'outro'];
            var agrupados = {};
            for (var j = 0; j < vars.length; j++) {
                var v = vars[j];
                var cfg = tagConfig[v.id];
                var grupo = cfg ? cfg.grupo : 'outro';
                if (!agrupados[grupo]) agrupados[grupo] = [];
                agrupados[grupo].push(v);
            }

            var html = '';
            for (var g = 0; g < gruposOrdem.length; g++) {
                var grupoKey = gruposOrdem[g];
                var items = agrupados[grupoKey];
                if (!items || items.length === 0) continue;
                html += '<div class="grupo">' + (grupos[grupoKey] || '📌 Outros') + '</div>';
                for (var k = 0; k < items.length; k++) {
                    var item = items[k];
                    var cfg2 = tagConfig[item.id] || {};
                    var nome = cfg2.nome || item.nome;
                    var valor = item.v;
                    var alarme = false;
                    if (cfg2.limiteAlto !== null && cfg2.limiteAlto !== undefined && valor > cfg2.limiteAlto) alarme = true;
                    if (cfg2.limiteBaixo !== null && cfg2.limiteBaixo !== undefined && valor < cfg2.limiteBaixo) alarme = true;
                    html += '<div class="item' + (alarme ? ' alarm' : '') + '">';
                    html += '<span class="nome">' + nome + '</span>';
                    html += '<span class="valor">' + (typeof valor === 'number' ? valor.toFixed(1) : valor);
                    html += '<span class="unidade">' + item.u + '</span></span></div>';
                }
            }
            container.innerHTML = html;
            var updateEl = doc.getElementById('widget-update');
            if (updateEl) { updateEl.textContent = '🔄 ' + (data._readAt || new Date().toLocaleTimeString('pt-BR')); }
        }

        // ============ STATUS DO LEITOR ============
        function atualizarStatusLeitor(data) {
            var dot = document.getElementById('leitor-dot');
            var label = document.getElementById('leitor-label');
            var leituras = document.getElementById('leitor-leituras');
            var uptimeEl = document.getElementById('leitor-uptime');
            if (!data) {
                dot.className = 'leitor-dot offline';
                label.textContent = 'Leitor: nenhum conectado';
                leituras.textContent = '0'; uptimeEl.textContent = '00:00'; return;
            }
            var agora = Date.now();
            var ultimoHeartbeat = data.lastHeartbeat || 0;
            var diffSegundos = (agora - ultimoHeartbeat) / 1000;
            if (data.ativo && diffSegundos < 60) {
                dot.className = 'leitor-dot';
                label.textContent = 'Leitor: online';
                leituras.textContent = data.leituras || '0';
                var up = data.uptime || 0;
                var h = Math.floor(up / 3600);
                var m = Math.floor((up % 3600) / 60).toString();
                var s = (up % 60).toString();
                if (m.length < 2) m = '0' + m;
                if (s.length < 2) s = '0' + s;
                uptimeEl.textContent = h > 0 ? h + ':' + m + ':' + s : m + ':' + s;
            } else {
                dot.className = 'leitor-dot offline';
                if (data.desconectadoEm) {
                    label.textContent = 'Leitor: offline desde ' + new Date(data.desconectadoEm).toLocaleTimeString('pt-BR');
                } else { label.textContent = 'Leitor: offline'; }
                leituras.textContent = data.leituras || '0'; uptimeEl.textContent = '--:--';
            }
        }

        function atualizarHistorico(data) {
            var keys = Object.keys(data);
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                if (key.startsWith('_')) continue;
                var val = data[key]; var valor = null;
                if (val && typeof val === 'object' && 'v' in val) { valor = val.v; }
                else if (typeof val === 'number') { valor = val; }
                if (valor !== null && typeof valor === 'number') {
                    if (!historico[key]) historico[key] = [];
                    historico[key].push(valor);
                    if (historico[key].length > MAX_HIST) { historico[key].shift(); }
                }
            }
        }

        function renderCards(data) {
            var container = document.getElementById('cards-container');
            container.innerHTML = '';
            var vars = [];
            var keys = Object.keys(data);
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                if (key.startsWith('_')) continue;
                var val = data[key];
                if (val && typeof val === 'object' && 'v' in val) {
                    vars.push({ id: key, nome: val.nome || key, v: val.v, u: val.u || '' });
                } else if (typeof val === 'number') {
                    vars.push({ id: key, nome: key, v: val, u: '' });
                }
            }

            var gruposOrdem = ['temp', 'cura', 'ar', 'agua', 'vapor', 'qualidade', 'outro'];
            var agrupados = {};
            for (var j = 0; j < vars.length; j++) {
                var v = vars[j];
                var cfg = tagConfig[v.id];
                var grupo = cfg ? cfg.grupo : 'outro';
                if (!agrupados[grupo]) agrupados[grupo] = [];
                agrupados[grupo].push(v);
            }

            for (var g = 0; g < gruposOrdem.length; g++) {
                var grupoKey = gruposOrdem[g];
                var items = agrupados[grupoKey];
                if (!items || items.length === 0) continue;
                var titulo = document.createElement('div');
                titulo.className = 'section-title';
                titulo.textContent = grupos[grupoKey] || '📌 Outros';
                container.appendChild(titulo);
                for (var k = 0; k < items.length; k++) {
                    container.appendChild(criarCardRow(items[k]));
                }
            }
            setTimeout(redesenharSparklines, 50);
        }

        function redesenharSparklines() {
            var canvases = document.querySelectorAll('.card-spark canvas');
            for (var i = 0; i < canvases.length; i++) {
                var canvas = canvases[i];
                var tagId = canvas.getAttribute('data-tag');
                var alarme = canvas.getAttribute('data-alarm') === 'true';
                var hist = historico[tagId] || [];
                var cfg = tagConfig[tagId] || {};
                var rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = Math.floor(rect.width * 2);
                canvas.height = Math.floor(rect.height * 2);
                if (hist.length >= 2) { desenharSparkline(canvas, hist, alarme, cfg); }
            }
        }
        window.addEventListener('resize', function() { setTimeout(redesenharSparklines, 100); });

        function criarCardRow(item) {
            var cfg = tagConfig[item.id] || {};
            var nome = cfg.nome || item.nome || item.id.replace(/_/g, ' ');
            var valor = item.v; var unidade = item.u;
            var alarme = false;
            if (cfg.limiteAlto !== null && cfg.limiteAlto !== undefined && valor > cfg.limiteAlto) alarme = true;
            if (cfg.limiteBaixo !== null && cfg.limiteBaixo !== undefined && valor < cfg.limiteBaixo) alarme = true;

            var hist = historico[item.id] || [];
            var tendencia = ''; var tendenciaClass = 'trend-stable';
            if (hist.length >= 2) {
                var diff = hist[hist.length - 1] - hist[hist.length - 2];
                if (diff > 0.2) { tendencia = '▲'; tendenciaClass = 'trend-up'; }
                else if (diff < -0.2) { tendencia = '▼'; tendenciaClass = 'trend-down'; }
                else { tendencia = '─'; tendenciaClass = 'trend-stable'; }
            }

            var row = document.createElement('div');
            row.className = 'card-row' + (alarme ? ' alarm' : '');

            var info = document.createElement('div');
            info.className = 'card-info';
            info.innerHTML = '<div class="card-nome">' + nome + '</div>' +
                '<div class="card-valor">' + (typeof valor === 'number' ? valor.toFixed(1) : valor) +
                '<span class="unidade">' + unidade + '</span></div>';

            var sparkDiv = document.createElement('div');
            sparkDiv.className = 'card-spark';
            var canvas = document.createElement('canvas');
            canvas.setAttribute('data-tag', item.id);
            canvas.setAttribute('data-alarm', alarme ? 'true' : 'false');
            sparkDiv.appendChild(canvas);

            var labels = document.createElement('div');
            labels.className = 'spark-labels';
            var escMax = cfg.escalaMax !== undefined ? cfg.escalaMax : '';
            var escMin = cfg.escalaMin !== undefined ? cfg.escalaMin : '';
            labels.innerHTML = '<span>' + escMax + '</span><span>' + escMin + '</span>';
            sparkDiv.appendChild(labels);

            var trendDiv = document.createElement('div');
            trendDiv.className = 'card-trend ' + tendenciaClass;
            trendDiv.textContent = tendencia;

            row.appendChild(info);
            row.appendChild(sparkDiv);
            row.appendChild(trendDiv);
            return row;
        }

        function desenharSparkline(canvas, valores, alarme, cfg) {
            var ctx = canvas.getContext('2d');
            var w = canvas.width; var h = canvas.height; var padding = 6;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = 'rgba(20, 25, 40, 0.5)';
            ctx.fillRect(0, 0, w, h);
            if (valores.length < 2) return;

            var min, max;
            if (cfg.escalaMin !== undefined && cfg.escalaMax !== undefined) { min = cfg.escalaMin; max = cfg.escalaMax; }
            else {
                min = Math.min.apply(null, valores); max = Math.max.apply(null, valores);
                var margem = (max - min) * 0.2 || 1; min -= margem; max += margem;
            }
            var range = max - min || 1;
            function valToY(val) {
                var clamped = Math.max(min, Math.min(max, val));
                return h - padding - ((clamped - min) / range) * (h - padding * 2);
            }

            if (cfg.limiteAlto !== null && cfg.limiteAlto !== undefined) {
                ctx.strokeStyle = 'rgba(239, 83, 80, 0.4)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(0, valToY(cfg.limiteAlto)); ctx.lineTo(w, valToY(cfg.limiteAlto)); ctx.stroke(); ctx.setLineDash([]);
            }
            if (cfg.limiteBaixo !== null && cfg.limiteBaixo !== undefined) {
                ctx.strokeStyle = 'rgba(255, 167, 38, 0.4)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(0, valToY(cfg.limiteBaixo)); ctx.lineTo(w, valToY(cfg.limiteBaixo)); ctx.stroke(); ctx.setLineDash([]);
            }

            ctx.beginPath();
            for (var i = 0; i < valores.length; i++) {
                var x = (i / (valores.length - 1)) * w; var y = valToY(valores[i]);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
            ctx.fillStyle = alarme ? 'rgba(239, 83, 80, 0.12)' : 'rgba(79, 195, 247, 0.12)'; ctx.fill();

            ctx.beginPath();
            for (var j = 0; j < valores.length; j++) {
                var px = (j / (valores.length - 1)) * w; var py = valToY(valores[j]);
                if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.strokeStyle = alarme ? '#ef5350' : '#4fc3f7'; ctx.lineWidth = 2; ctx.stroke();

            var lastX = w - 4; var lastY = valToY(valores[valores.length - 1]);
            ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
            ctx.fillStyle = alarme ? '#ef5350' : '#4fc3f7'; ctx.fill();
        }

        function updateConnectionStatus(connected) {
            var el = document.getElementById('conn-status');
            if (connected) { el.textContent = '● Conectado'; el.className = 'connection'; }
            else { el.textContent = '● Offline'; el.className = 'connection offline'; }
        }

        function logout() {
            localStorage.removeItem('modo_acesso'); localStorage.removeItem('login_timestamp');
            firebase.auth().signOut().then(function() { window.location.href = 'index.html'; });
        }
    </script>
</body>
</html>
