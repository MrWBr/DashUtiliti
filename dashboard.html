        function desenharSparkline(canvas,valores,alarmCor,cfg){
            var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height,p=6;
            ctx.clearRect(0,0,w,h);if(valores.length<2)return;
            var min,max;if(cfg.escalaMin!==undefined&&cfg.escalaMax!==undefined){min=cfg.escalaMin;max=cfg.escalaMax}
            else{min=Math.min.apply(null,valores);max=Math.max.apply(null,valores);var mg=(max-min)*0.2||1;min-=mg;max+=mg}
            var range=max-min||1;
            function vY(val){var c=Math.max(min,Math.min(max,val));return h-p-((c-min)/range)*(h-p*2)}
            if(cfg.limiteAlto!=null){ctx.strokeStyle='rgba(239,83,80,0.4)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,vY(cfg.limiteAlto));ctx.lineTo(w,vY(cfg.limiteAlto));ctx.stroke();ctx.setLineDash([])}
            if(cfg.limiteBaixo!=null){ctx.strokeStyle='rgba(66,165,245,0.4)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,vY(cfg.limiteBaixo));ctx.lineTo(w,vY(cfg.limiteBaixo));ctx.stroke();ctx.setLineDash([])}
            var cL='#4fc3f7',cF='rgba(79,195,247,0.12)';if(alarmCor&&alarmCor!=='none'&&corMap[alarmCor]){cL=corMap[alarmCor].linha;cF=corMap[alarmCor].fill}
            ctx.beginPath();for(var i=0;i<valores.length;i++){var x=(i/(valores.length-1))*w,y=vY(valores[i]);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
            ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fillStyle=cF;ctx.fill();
            ctx.beginPath();for(var j=0;j<valores.length;j++){var px=(j/(valores.length-1))*w,py=vY(valores[j]);if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}
            ctx.strokeStyle=cL;ctx.lineWidth=2;ctx.stroke();
            ctx.beginPath();ctx.arc(w-4,vY(valores[valores.length-1]),4,0,Math.PI*2);ctx.fillStyle=cL;ctx.fill();
        }

            var desde=Date.now()-(tempoMs[periodo]||3600000);
            db.ref('history').orderByChild('_timestamp').startAt(desde).once('value').then(function(snapshot){
                var dados=snapshot.val();var pontos=[];
                if(dados){var keys=Object.keys(dados);for(var i=0;i<keys.length;i++){var entry=dados[keys[i]];
                    if(entry&&entry[tagId]!==undefined){var val=entry[tagId];
                        var valor=(typeof val==='object'&&'v' in val)?val.v:(typeof val==='number'?val:null);
                        if(valor!==null)pontos.push({t:entry._timestamp||0,v:valor})}}}
                pontos.sort(function(a,b){return a.t-b.t});desenharGraficoModal(pontos,tagId);
            }).catch(function(){var hist=historico[tagId]||[];var pontos=[];
                for(var i=0;i<hist.length;i++)pontos.push({t:Date.now()-(hist.length-i)*30000,v:hist[i]});desenharGraficoModal(pontos,tagId)});

        function desenharGraficoModal(pontos,tagId){
            var canvas=document.getElementById('modal-canvas');var rect=canvas.getBoundingClientRect();

            var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height,pad=40;

                ctx.fillText('Sem dados suficientes para este período',w/2,h/2);

                document.getElementById('stat-max').textContent='—';document.getElementById('stat-pts').textContent='0';return}
            var cfg=tagConfig[tagId]||{};var valores=pontos.map(function(p){return p.v});var min,max;
            if(cfg.escalaMin!==undefined&&cfg.escalaMax!==undefined){min=cfg.escalaMin;max=cfg.escalaMax}
            else{min=Math.min.apply(null,valores);max=Math.max.apply(null,valores);var mg=(max-min)*0.15||1;min-=mg;max+=mg}
            var range=max-min||1;var vMin=Math.min.apply(null,valores),vMax=Math.max.apply(null,valores);
            var vMed=valores.reduce(function(a,b){return a+b},0)/valores.length;
            document.getElementById('stat-min').textContent=vMin.toFixed(1);document.getElementById('stat-med').textContent=vMed.toFixed(1);
            document.getElementById('stat-max').textContent=vMax.toFixed(1);document.getElementById('stat-pts').textContent=pontos.length.toString();
            function vY(val){var c=Math.max(min,Math.min(max,val));return h-pad-((c-min)/range)*(h-pad*2)}
            function tX(t){var tMin=pontos[0].t,tMax=pontos[pontos.length-1].t,tR=tMax-tMin||1;return pad+((t-tMin)/tR)*(w-pad*2)}
            ctx.strokeStyle=isDark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.08)';ctx.lineWidth=1;
            for(var g=0;g<=4;g++){var yg=pad+(g/4)*(h-pad*2);ctx.beginPath();ctx.moveTo(pad,yg);ctx.lineTo(w-pad,yg);ctx.stroke();
                ctx.fillStyle=isDark?'#666':'#999';ctx.font='18px monospace';ctx.textAlign='right';ctx.fillText((max-(g/4)*range).toFixed(1),pad-5,yg+5)}
            if(cfg.limiteAlto!=null){ctx.strokeStyle='rgba(239,83,80,0.6)';ctx.lineWidth=2;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(pad,vY(cfg.limiteAlto));ctx.lineTo(w-pad,vY(cfg.limiteAlto));ctx.stroke();ctx.setLineDash([]);
                ctx.fillStyle='#ef5350';ctx.font='16px sans-serif';ctx.textAlign='left';ctx.fillText('Alto: '+cfg.limiteAlto,w-pad+5,vY(cfg.limiteAlto)+5)}
            if(cfg.limiteBaixo!=null){ctx.strokeStyle='rgba(66,165,245,0.6)';ctx.lineWidth=2;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(pad,vY(cfg.limiteBaixo));ctx.lineTo(w-pad,vY(cfg.limiteBaixo));ctx.stroke();ctx.setLineDash([]);
                ctx.fillStyle='#42a5f5';ctx.font='16px sans-serif';ctx.textAlign='left';ctx.fillText('Baixo: '+cfg.limiteBaixo,w-pad+5,vY(cfg.limiteBaixo)+5)}
            var alarm=getAlarmInfo(tagId,pontos[pontos.length-1].v);var cL='#4fc3f7',cF='rgba(79,195,247,0.15)';
            if(alarm.cor&&corMap[alarm.cor]){cL=corMap[alarm.cor].linha;cF=corMap[alarm.cor].fill}
            ctx.beginPath

            // (continuação do desenharGraficoModal - cole substituindo a última linha "ctx.beginPath" da parte 1)
            ctx.beginPath();for(var i=0;i<pontos.length;i++){var x=tX(pontos[i].t),y=vY(pontos[i].v);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
            ctx.lineTo(tX(pontos[pontos.length-1].t),h-pad);ctx.lineTo(tX(pontos[0].t),h-pad);ctx.closePath();ctx.fillStyle=cF;ctx.fill();
            ctx.beginPath();for(var j=0;j<pontos.length;j++){var px=tX(pontos[j].t),py=vY(pontos[j].v);if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}
            ctx.strokeStyle=cL;ctx.lineWidth=3;ctx.stroke();
            var lx=tX(pontos[pontos.length-1].t),ly=vY(pontos[pontos.length-1].v);
            ctx.beginPath();ctx.arc(lx,ly,6,0,Math.PI*2);ctx.fillStyle=cL;ctx.fill();ctx.strokeStyle=isDark?'#fff':'#000';ctx.lineWidth=2;ctx.stroke();
            ctx.fillStyle=isDark?'#666':'#999';ctx.font='16px monospace';ctx.textAlign='center';
            var nL=Math.min(6,pontos.length);
            for(var l=0;l<nL;l++){var idx=Math.floor(l*(pontos.length-1)/(nL-1));var lxx=tX(pontos[idx].t);
                var dt=new Date(pontos[idx].t);ctx.fillText(dt.getHours().toString().padStart(2,'0')+':'+dt.getMinutes().toString().padStart(2,'0'),lxx,h-5)}
        }

        // ===== CONNECTION =====
        function updateConnectionStatus(connected){
            var el=document.getElementById('conn-status');
            if(connected){el.textContent='● Conectado';el.className='connection'}
            else{el.textContent='● Offline';el.className='connection offline'}
        }

        window.logout=function(){
            localStorage.removeItem('modo_acesso');localStorage.removeItem('login_timestamp');
            firebase.auth().signOut().then(function(){window.location.href='index.html'});
        };

        // Registrar Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }

    })();
    </script>
