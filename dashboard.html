
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilidades - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e1a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1a1f3a, #0d1117);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2f45;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header h1 {
            font-size: 1em;
            color: #4fc3f7;
            font-weight: 600;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .connection {
            font-size: 0.7em;
            padding: 3px 8px;
            border-radius: 10px;
            background: #1b5e20;
            color: #a5d6a7;
        }
        .connection.offline { background: #b71c1c; color: #ef9a9a; }
        .btn-logout {
            background: #333;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7em;
        }

        /* LEITOR STATUS BAR */
        .leitor-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #0d1117;
            border-bottom: 1px solid #1a1f3a;
            font-size: 0.7em;
        }
        .leitor-status .leitor-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .leitor-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: blink 2s infinite;
        }
        .leitor-dot.offline {
            background: #ef5350;
            animation: none;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .leitor-status .leitor-stats {
            display: flex;
            gap: 12px;
            color: #666;
        }
        .leitor-stats span { color: #888; }
        .leitor-stats .val { color: #4fc3f7; font-weight: 600; }

        /* LAST UPDATE */
        .last-update {
            text-align: center;
            font-size: 0.7em;
            color: #555;
            padding: 6px;
            background: #0d1117;
        }

        /* CARDS CONTAINER */
        .cards-container {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* CARD ROW */
        .card-row {
            display: flex;
            align-items: center;
            background: #141929;
            border-radius: 8px;
            padding: 10px 12px;
            border-left: 3px solid #4fc3f7;
            gap: 10px;
            transition: background 0.2s;
        }
        .card-row:hover { background: #1a2035; }
        .card-row.alarm {
            border-left-color: #ef5350;
            background: #1a1015;
        }
        .card-row.alarm:hover { background: #251520; }
        .card-row.warning {
            border-left-color: #ffa726;
        }

        /* Card: Info lado esquerdo */
        .card-info {
            flex: 1;
            min-width: 0;
        }
        .card-nome {
            font-size: 0.7em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-valor {
            font-size: 1.3em;
            font-weight: 700;
            color: #fff;
            margin-top: 2px;
        }
        .card-valor .unidade {
            font-size: 0.55em;
            color: #666;
            font-weight: 400;
            margin-left: 3px;
        }
        .card-row.alarm .card-valor { color: #ef5350; }
        .card-row.alarm .card-nome { color: #ef9a9a; }

        /* Card: Sparkline lado direito */
        .card-spark {
            width: 100px;
            height: 35px;
            flex-shrink: 0;
        }
        .card-spark canvas {
            width: 100%;
            height: 100%;
        }

        /* Tendência seta */
        .card-trend {
            font-size: 1em;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .trend-up { color: #ef5350; }
        .trend-down { color: #4caf50; }
        .trend-stable { color: #555; }

        /* Seção grupo */
        .section-title {
            font-size: 0.75em;
            color: #4fc3f7;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 12px 4px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏭 Utilidades - Mondelēz</h1>
        <div class="header-right">
            <span class="connection" id="conn-status">● Conectado</span>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
    </div>

    <!-- STATUS DO LEITOR -->
    <div class="leitor-status" id="leitor-bar">
        <div class="leitor-info">
            <div class="leitor-dot" id="leitor-dot"></div>
            <span id="leitor-label">Leitor: verificando...</span>
        </div>
        <div class="leitor-stats">
            <span>📖 <span class="val" id="leitor-leituras">0</span></span>
            <span>⏱️ <span class="val" id="leitor-uptime">00:00</span></span>
        </div>
    </div>

    <div class="last-update" id="last-update">Aguardando dados...</div>
    
    <div class="cards-container" id="cards-container"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBLx0ECcSQdS8uKnaXzDIuygK7Hi3JTcuU",
            authDomain: "dshutili.firebaseapp.com",
            databaseURL: "https://dshutili-default-rtdb.firebaseio.com",
            projectId: "dshutili",
            storageBucket: "dshutili.firebasestorage.app",
            messagingSenderId: "1065134772507",
            appId: "1:1065134772507:web:aed91d6d1953f69cb403be",
            measurementId: "G-B3NS6YKTLV"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        firebase.auth().onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                initDashboard();
            }
        });

        // ============ CONFIGURAÇÃO DAS TAGS ============
        var tagConfig = {
            "TO8001_2_3_4": { nome: "Torres C.A.G.", grupo: "temp", limiteAlto: 32, limiteBaixo: null },
            "TO8006_Retorno": { nome: "Torre Wafer", grupo: "temp", limiteAlto: 35, limiteBaixo: null },
            "CH8007": { nome: "Chiller 8007", grupo: "temp", limiteAlto: 2, limiteBaixo: -5 },
            "CH8008": { nome: "Chiller 8008", grupo: "temp", limiteAlto: 2, limiteBaixo: -5 },
            "CH8011_14": { nome: "Chillers 8011/14", grupo: "temp", limiteAlto: 2, limiteBaixo: -5 },
            "CV8004_Retorno": { nome: "Sala de gordura", grupo: "temp", limiteAlto: 50, limiteBaixo: null },
            "Ar_Comp_DM": { nome: "Ar Comp Dry Mix", grupo: "ar", limiteAlto: null, limiteBaixo: 5.5 },
            "Ar_Comp_DM_Boge": { nome: "Ar Comp Boge", grupo: "ar", limiteAlto: null, limiteBaixo: 5.0 },
            "Ar_Comp_Choco": { nome: "Ar Comp Chocolate", grupo: "ar", limiteAlto: null, limiteBaixo: 5.5 },
            "Vacuo_Dry_Mix": { nome: "Vácuo Dry Mix", grupo: "ar", limiteAlto: null, limiteBaixo: 15 },
            "Agua_6C": { nome: "Água Gelada 6°C", grupo: "agua", limiteAlto: 8, limiteBaixo: null },
            "Pressao_Cavalete_BG": { nome: "Pressão Cavalete B&G", grupo: "vapor", limiteAlto: null, limiteBaixo: 10 },
            "Pressao_Vapor_Choco": { nome: "Pressão Vapor Choco", grupo: "vapor", limiteAlto: null, limiteBaixo: 5 },
            "Nivel_TQ_CD8006_7": { nome: "Nível TQ CD8006/7", grupo: "vapor", limiteAlto: null, limiteBaixo: 40 },
            "Umidade_Ar_Comp_Chocolate": { nome: "Umidade Ar Choco", grupo: "qualidade", limiteAlto: 25, limiteBaixo: null },
            "Temperatura_Ar_Comp_Chocolate": { nome: "Temp Ar Choco", grupo: "qualidade", limiteAlto: 50, limiteBaixo: null },
            "Umidade_Ar_Comp_BG": { nome: "Umidade Ar B&G", grupo: "qualidade", limiteAlto: 25, limiteBaixo: null },
            "Temperatura_Ar_Comp_BG": { nome: "Temp Ar B&G", grupo: "qualidade", limiteAlto: 50, limiteBaixo: null }
        };

        var grupos = {
            "temp": "🌡️ Temperaturas",
            "ar": "💨 Ar Comprimido / Vácuo",
            "agua": "💧 Água",
            "vapor": "♨️ Vapor / Pressão",
            "qualidade": "📊 Qualidade do Ar"
        };

        // Histórico para sparklines (últimos 30 pontos)
        var historico = {};
        var MAX_HIST = 30;

        function initDashboard() {
            // Escutar dados atuais
            db.ref('current').on('value', function(snapshot) {
                var data = snapshot.val();
                if (!data) return;
                
                atualizarHistorico(data);
                renderCards(data);
                updateConnectionStatus(true);
                
                document.getElementById('last-update').textContent = 
                    '🔄 Última atualização: ' + (data._readAt || new Date().toLocaleString('pt-BR'));
            });

            // Escutar status do leitor
            db.ref('leitor_status').on('value', function(snapshot) {
                var data = snapshot.val();
                atualizarStatusLeitor(data);
            });

            // Status de conexão
            db.ref('.info/connected').on('value', function(snap) {
                updateConnectionStatus(snap.val());
            });
        }

        // ============ STATUS DO LEITOR ============
        function atualizarStatusLeitor(data) {
            var dot = document.getElementById('leitor-dot');
            var label = document.getElementById('leitor-label');
            var leituras = document.getElementById('leitor-leituras');
            var uptimeEl = document.getElementById('leitor-uptime');

            if (!data) {
                dot.className = 'leitor-dot offline';
                label.textContent = 'Leitor: nenhum conectado';
                leituras.textContent = '0';
                uptimeEl.textContent = '00:00';
                return;
            }

            var agora = Date.now();
            var ultimoHeartbeat = data.lastHeartbeat || 0;
            var diffSegundos = (agora - ultimoHeartbeat) / 1000;

            if (data.ativo && diffSegundos < 30) {
                // Online
                dot.className = 'leitor-dot';
                label.textContent = 'Leitor: online';
                leituras.textContent = data.leituras || '0';

                // Formatar uptime
                var up = data.uptime || 0;
                var h = Math.floor(up / 3600);
                var m = Math.floor((up % 3600) / 60).toString();
                var s = (up % 60).toString();
                if (m.length < 2) m = '0' + m;
                if (s.length < 2) s = '0' + s;
                uptimeEl.textContent = h > 0 ? h + ':' + m + ':' + s : m + ':' + s;
            } else {
                // Offline
                dot.className = 'leitor-dot offline';
                if (data.desconectadoEm) {
                    var desc = new Date(data.desconectadoEm).toLocaleTimeString('pt-BR');
                    label.textContent = 'Leitor: offline desde ' + desc;
                } else {
                    label.textContent = 'Leitor: offline (heartbeat expirado)';
                }
                leituras.textContent = data.leituras || '0';
                uptimeEl.textContent = '--:--';
            }
        }

        // ============ ATUALIZAR HISTÓRICO ============
        function atualizarHistorico(data) {
            var keys = Object.keys(data);
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                if (key.startsWith('_')) continue;
                
                var val = data[key];
                var valor = null;
                
                if (val && typeof val === 'object' && 'v' in val) {
                    valor = val.v;
                } else if (typeof val === 'number') {
                    valor = val;
                }
                
                if (valor !== null && typeof valor === 'number') {
                    if (!historico[key]) historico[key] = [];
                    historico[key].push(valor);
                    if (historico[key].length > MAX_HIST) {
                        historico[key].shift();
                    }
                }
            }
        }

        // ============ RENDER CARDS ============
        function renderCards(data) {
            var container = document.getElementById('cards-container');
            container.innerHTML = '';

            // Extrair variáveis
            var vars = [];
            var keys = Object.keys(data);
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                if (key.startsWith('_')) continue;
                
                var val = data[key];
                if (val && typeof val === 'object' && 'v' in val) {
                    vars.push({ id: key, nome: val.nome || key, v: val.v, u: val.u || '' });
                } else if (typeof val === 'number') {
                    vars.push({ id: key, nome: key, v: val, u: '' });
                }
            }

            // Agrupar por grupo
            var gruposOrdem = ['temp', 'ar', 'agua', 'vapor', 'qualidade', 'outro'];
            var agrupados = {};
            
            for (var j = 0; j < vars.length; j++) {
                var v = vars[j];
                var cfg = tagConfig[v.id];
                var grupo = cfg ? cfg.grupo : 'outro';
                if (!agrupados[grupo]) agrupados[grupo] = [];
                agrupados[grupo].push(v);
            }

            // Renderizar por grupo
            for (var g = 0; g < gruposOrdem.length; g++) {
                var grupoKey = gruposOrdem[g];
                var items = agrupados[grupoKey];
                if (!items || items.length === 0) continue;

                // Título do grupo
                var titulo = document.createElement('div');
                titulo.className = 'section-title';
                titulo.textContent = grupos[grupoKey] || '📌 Outros';
                container.appendChild(titulo);

                // Cards do grupo
                for (var k = 0; k < items.length; k++) {
                    var item = items[k];
                    container.appendChild(criarCardRow(item));
                }
            }
        }

        // ============ CRIAR CARD ROW ============
        function criarCardRow(item) {
            var cfg = tagConfig[item.id] || {};
            var nome = cfg.nome || item.nome || item.id.replace(/_/g, ' ');
            var valor = item.v;
            var unidade = item.u;

            // Verificar alarme
            var alarme = false;
            if (cfg.limiteAlto !== null && cfg.limiteAlto !== undefined && valor > cfg.limiteAlto) alarme = true;
            if (cfg.limiteBaixo !== null && cfg.limiteBaixo !== undefined && valor < cfg.limiteBaixo) alarme = true;

            // Tendência
            var hist = historico[item.id] || [];
            var tendencia = '';
            var tendenciaClass = 'trend-stable';
            if (hist.length >= 2) {
                var diff = hist[hist.length - 1] - hist[hist.length - 2];
                if (diff > 0.2) { tendencia = '▲'; tendenciaClass = 'trend-up'; }
                else if (diff < -0.2) { tendencia = '▼'; tendenciaClass = 'trend-down'; }
                else { tendencia = '─'; tendenciaClass = 'trend-stable'; }
            }

            // Criar elemento
            var row = document.createElement('div');
            row.className = 'card-row' + (alarme ? ' alarm' : '');

            // Info
            var info = document.createElement('div');
            info.className = 'card-info';
            info.innerHTML = '<div class="card-nome">' + nome + '</div>' +
                '<div class="card-valor">' + (typeof valor === 'number' ? valor.toFixed(1) : valor) +
                '<span class="unidade">' + unidade + '</span></div>';

            // Sparkline canvas
            var sparkDiv = document.createElement('div');
            sparkDiv.className = 'card-spark';
            var canvas = document.createElement('canvas');
            canvas.width = 100;
            canvas.height = 35;
            sparkDiv.appendChild(canvas);

            // Tendência
            var trendDiv = document.createElement('div');
            trendDiv.className = 'card-trend ' + tendenciaClass;
            trendDiv.textContent = tendencia;

            row.appendChild(info);
            row.appendChild(sparkDiv);
            row.appendChild(trendDiv);

            // Desenhar sparkline
            if (hist.length >= 2) {
                desenharSparkline(canvas, hist, alarme);
            }

            return row;
        }

        // ============ DESENHAR SPARKLINE ============
        function desenharSparkline(canvas, valores, alarme) {
            var ctx = canvas.getContext('2d');
            var w = canvas.width;
            var h = canvas.height;
            var padding = 3;

            ctx.clearRect(0, 0, w, h);

            ctx.fillStyle = 'rgba(20, 25, 40, 0.5)';
            ctx.fillRect(0, 0, w, h);

            if (valores.length < 2) return;

            var min = Math.min.apply(null, valores);
            var max = Math.max.apply(null, valores);
            var range = max - min || 1;

            // Linha de média
            var media = valores.reduce(function(a, b) { return a + b; }, 0) / valores.length;
            var mediaY = h - padding - ((media - min) / range) * (h - padding * 2);
            ctx.strokeStyle = 'rgba(100, 100, 120, 0.3)';
            ctx.lineWidth = 0.5;
            ctx.setLineDash([2, 2]);
            ctx.beginPath();
            ctx.moveTo(0, mediaY);
            ctx.lineTo(w, mediaY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Área preenchida
            ctx.beginPath();
            for (var i = 0; i < valores.length; i++) {
                var x = (i / (valores.length - 1)) * w;
                var y = h - padding - ((valores[i] - min) / range) * (h - padding * 2);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            ctx.fillStyle = alarme ? 'rgba(239, 83, 80, 0.1)' : 'rgba(79, 195, 247, 0.1)';
            ctx.fill();

            // Linha principal
            ctx.beginPath();
            for (var j = 0; j < valores.length; j++) {
                var px = (j / (valores.length - 1)) * w;
                var py = h - padding - ((valores[j] - min) / range) * (h - padding * 2);
                if (j === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.strokeStyle = alarme ? '#ef5350' : '#4fc3f7';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Ponto atual (último)
            var lastX = w;
            var lastY = h - padding - ((valores[valores.length - 1] - min) / range) * (h - padding * 2);
            ctx.beginPath();
            ctx.arc(lastX - 2, lastY, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = alarme ? '#ef5350' : '#4fc3f7';
            ctx.fill();
        }

        // ============ STATUS CONEXÃO ============
        function updateConnectionStatus(connected) {
            var el = document.getElementById('conn-status');
            if (connected) {
                el.textContent = '● Conectado';
                el.className = 'connection';
            } else {
                el.textContent = '● Offline';
                el.className = 'connection offline';
            }
        }

        function logout() {
            localStorage.removeItem('modo_acesso');
            localStorage.removeItem('login_timestamp');
            firebase.auth().signOut().then(function() {
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
