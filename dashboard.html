<head>

    <title>Utilidades - Dashboard</title>
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #0d1117;
            --bg-card: #141929;
            --bg-card-hover: #1a2035;
            --bg-header: linear-gradient(135deg, #1a1f3a, #0d1117);
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --text-muted: #555;
            --border: #2a2f45;
            --accent: #4fc3f7;
            --spark-bg: rgba(20, 25, 40, 0.5);
        }
        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f4f8;
            --bg-header: linear-gradient(135deg, #e3f2fd, #ffffff);
            --text-primary: #212121;
            --text-secondary: #616161;
            --text-muted: #9e9e9e;
            --border: #e0e0e0;
            --accent: #0288d1;
            --spark-bg: rgba(240, 244, 248, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .header {
            background: var(--bg-header);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header h1 { font-size: 1em; color: var(--accent); font-weight: 600; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .connection {
            font-size: 0.7em; padding: 3px 8px; border-radius: 10px;
            background: #1b5e20; color: #a5d6a7;
        }
        .connection.offline { background: #b71c1c; color: #ef9a9a; }
        .btn-logout, .btn-theme {
            background: #333; color: #fff; border: none;
            padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.7em;
        }
        [data-theme="light"] .btn-logout, [data-theme="light"] .btn-theme {
            background: #e0e0e0; color: #333;
        }

        .toolbar {
            display: flex;
            gap: 6px;
            padding: 8px 14px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .toolbar button {
            background: var(--bg-card);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.68em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toolbar button:hover { opacity: 0.8; }
        .toolbar button.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .leitor-status {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px; background: var(--bg-secondary);
            border-bottom: 1px solid var(--border); font-size: 0.7em;
        }
        .leitor-status .leitor-info { display: flex; align-items: center; gap: 8px; }
        .leitor-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #4caf50; animation: blink 2s infinite;
        }
        .leitor-dot.offline { background: #ef5350; animation: none; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .leitor-status .leitor-stats { display: flex; gap: 12px; }
        .leitor-stats span { color: var(--text-secondary); }
        .leitor-stats .val { color: var(--accent); font-weight: 600; }

        .last-update {
            text-align: center; font-size: 0.7em; color: var(--text-muted);
            padding: 6px; background: var(--bg-secondary);
            transition: color 0.5s;
        }
        .last-update.stale-yellow { color: #ffa726; }
        .last-update.stale-red { color: #ef5350; font-weight: 600; }

        .filter-bar {
            display: flex; gap: 5px; padding: 6px 14px;
            background: var(--bg-secondary); border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .filter-bar button {
            background: var(--bg-card); color: var(--text-secondary);
            border: 1px solid var(--border); padding: 4px 8px;
            border-radius: 12px; font-size: 0.65em; cursor: pointer;
        }
        .filter-bar button.active {
            background: var(--accent); color: #000; border-color: var(--accent);
        }

        .cards-container { padding: 10px; display: flex; flex-direction: column; gap: 6px; }

        .card-row {
            display: flex; align-items: center; background: var(--bg-card);
            border-radius: 8px; padding: 10px 12px; border-left: 3px solid var(--accent);
            gap: 10px; transition: background 0.2s; cursor: pointer;
        }
        .card-row:hover { background: var(--bg-card-hover); }

        .card-row.alarm-red { border-left-color: #ef5350; background: #1a1015; }
        .card-row.alarm-red:hover { background: #251520; }
        .card-row.alarm-red .card-valor { color: #ef5350; }
        .card-row.alarm-red .card-nome { color: #ef9a9a; }
        [data-theme="light"] .card-row.alarm-red { background: #ffebee; }
        [data-theme="light"] .card-row.alarm-red:hover { background: #ffcdd2; }

        .card-row.alarm-blue { border-left-color: #42a5f5; background: #0d1520; }
        .card-row.alarm-blue:hover { background: #122030; }
        .card-row.alarm-blue .card-valor { color: #42a5f5; }
        .card-row.alarm-blue .card-nome { color: #90caf9; }
        [data-theme="light"] .card-row.alarm-blue { background: #e3f2fd; }
        [data-theme="light"] .card-row.alarm-blue:hover { background: #bbdefb; }

        .card-row.alarm-orange { border-left-color: #ffa726; background: #1a1508; }
        .card-row.alarm-orange:hover { background: #252010; }
        .card-row.alarm-orange .card-valor { color: #ffa726; }
        .card-row.alarm-orange .card-nome { color: #ffcc80; }
        [data-theme="light"] .card-row.alarm-orange { background: #fff3e0; }
        [data-theme="light"] .card-row.alarm-orange:hover { background: #ffe0b2; }

        .card-row.alarm-yellow { border-left-color: #ffee58; background: #1a1a08; }
        .card-row.alarm-yellow:hover { background: #252510; }
        .card-row.alarm-yellow .card-valor { color: #ffee58; }
        .card-row.alarm-yellow .card-nome { color: #fff9c4; }
        [data-theme="light"] .card-row.alarm-yellow { background: #fffde7; }
        [data-theme="light"] .card-row.alarm-yellow:hover { background: #fff9c4; }

        .card-info { flex-shrink: 0; min-width: fit-content; padding-right: 8px; }
        .card-nome { font-size: 0.7em; color: var(--text-secondary); text-transform: uppercase;
                    letter-spacing: 0.3px; white-space: nowrap; }
        .card-valor { font-size: 1.3em; font-weight: 700; color: var(--text-primary); margin-top: 2px; }
        .card-valor .unidade { font-size: 0.55em; color: var(--text-muted); font-weight: 400; margin-left: 3px; }

        .card-spark { flex: 1; min-width: 60px; height: 50px; position: relative; }
        .card-spark canvas { width: 100%; height: 100%; display: block; }
        .spark-labels {
            position: absolute; top: 0; right: 2px; bottom: 0;
            display: flex; flex-direction: column; justify-content: space-between;
            pointer-events: none;
        }
        .spark-labels span { font-size: 0.5em; color: var(--text-muted); font-family: monospace; }

        .card-trend { font-size: 1em; width: 20px; text-align: center; flex-shrink: 0; }
        .trend-up { color: #ef5350; }
        .trend-down { color: #4caf50; }
        .trend-stable { color: var(--text-muted); }

        .section-title {
            font-size: 0.75em; color: var(--accent); text-transform: uppercase;
            letter-spacing: 1px; padding: 12px 12px 4px; font-weight: 600;
        }

        /* ===== MODAL HISTÓRICO ===== */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 200;
            align-items: center; justify-content: center; padding: 15px;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--bg-secondary); border-radius: 12px;
            width: 100%; max-width: 700px; max-height: 90vh;
            overflow-y: auto; padding: 20px; position: relative;
            border: 1px solid var(--border);
        }
        .modal-close {
            position: absolute; top: 10px; right: 15px;
            background: none; border: none; color: var(--text-secondary);
            font-size: 1.5em; cursor: pointer;
        }
        .modal h2 { color: var(--accent); font-size: 1em; margin-bottom: 5px; }
        .modal .modal-valor-atual { font-size: 1.8em; font-weight: 700; margin-bottom: 10px; }
        .modal .modal-periodo {
            display: flex; gap: 8px; margin-bottom: 15px;
        }
        .modal .modal-periodo button {
            background: var(--bg-card); color: var(--accent);
            border: 1px solid var(--border); padding: 5px 12px;
            border-radius: 6px; font-size: 0.75em; cursor: pointer;
        }
        .modal .modal-periodo button.active {
            background: var(--accent); color: #000;
        }
        .modal canvas { width: 100%; height: 250px; display: block; border-radius: 8px; background: var(--spark-bg); }
        .modal .modal-stats {
            display: flex; justify-content: space-around; margin-top: 12px;
            font-size: 0.8em; color: var(--text-secondary);
        }
        .modal .modal-stats .stat-val { font-weight: 700; color: var(--text-primary); font-size: 1.1em; }
    </style>
</head>

        // ============ TEMA ============
        function toggleTheme() {
            var body = document.body;
            var btn = document.getElementById('btn-theme');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '🌙';
                localStorage.setItem('tema', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️';
                localStorage.setItem('tema', 'dark');
            }

        }

        // ============ FILTRO POR GRUPO ============
        function filtrar(grupo) {
            filtroAtual = grupo;
            var btns = document.querySelectorAll('.filter-bar button');
            for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); }
            event.target.classList.add('active');
            if (ultimosDados) renderCards(ultimosDados);
        }

        // ============ INDICADOR DE TEMPO ============
        function atualizarIndicadorTempo() {
            if (!ultimoTimestamp) return;
            var el = document.getElementById('last-update');
            var agora = Date.now();
            var diff = Math.floor((agora - ultimoTimestamp) / 1000);
            var texto = '';
            if (diff < 10) texto = '🔄 Atualizado agora';
            else if (diff < 60) texto = '🔄 Última leitura há ' + diff + 's';
            else if (diff < 3600) texto = '🔄 Última leitura há ' + Math.floor(diff / 60) + 'min';
            else texto = '🔄 Última leitura há ' + Math.floor(diff / 3600) + 'h ' + Math.floor((diff % 3600) / 60) + 'min';

            el.textContent = texto;
            el.className = 'last-update';
            if (diff > 120) el.classList.add('stale-red');
            else if (diff > 30) el.classList.add('stale-yellow');
        }
        setInterval(atualizarIndicadorTempo, 5000);

            var keys = Object.keys(ultimosDados);

        function desenharSparkline(canvas, valores, alarmCor, cfg) {
            var ctx = canvas.getContext('2d');
            var w = canvas.width; var h = canvas.height; var padding = 6;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = 'rgba(20, 25, 40, 0.5)'; ctx.fillRect(0, 0, w, h);
            if (valores.length < 2) return;
            var min, max;
            if (cfg.escalaMin !== undefined && cfg.escalaMax !== undefined) { min = cfg.escalaMin; max = cfg.escalaMax; }
            else { min = Math.min.apply(null, valores); max = Math.max.apply(null, valores); var mg = (max - min) * 0.2 || 1; min -= mg; max += mg; }
            var range = max - min || 1;
            function valToY(val) { var c = Math.max(min, Math.min(max, val)); return h - padding - ((c - min) / range) * (h - padding * 2); }

            if (cfg.limiteAlto !== null && cfg.limiteAlto !== undefined) {
                ctx.strokeStyle = 'rgba(239, 83, 80, 0.4)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(0, valToY(cfg.limiteAlto)); ctx.lineTo(w, valToY(cfg.limiteAlto)); ctx.stroke(); ctx.setLineDash([]);
            }
            if (cfg.limiteBaixo !== null && cfg.limiteBaixo !== undefined) {
                ctx.strokeStyle = 'rgba(66, 165, 245, 0.4)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(0, valToY(cfg.limiteBaixo)); ctx.lineTo(w, valToY(cfg.limiteBaixo)); ctx.stroke(); ctx.setLineDash([]);
            }

            var corLinha = '#4fc3f7', corFill = 'rgba(79, 195, 247, 0.12)';
            if (alarmCor && alarmCor !== 'none' && corMap[alarmCor]) { corLinha = corMap[alarmCor].linha; corFill = corMap[alarmCor].fill; }

            ctx.beginPath();
            for (var i = 0; i < valores.length; i++) { var x = (i / (valores.length - 1)) * w; var y = valToY(valores[i]); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
            ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fillStyle = corFill; ctx.fill();

            ctx.beginPath();
            for (var j = 0; j < valores.length; j++) { var px = (j / (valores.length - 1)) * w; var py = valToY(valores[j]); if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
            ctx.strokeStyle = corLinha; ctx.lineWidth = 2; ctx.stroke();

            ctx.beginPath(); ctx.arc(w - 4, valToY(valores[valores.length - 1]), 4, 0, Math.PI * 2);
            ctx.fillStyle = corLinha; ctx.fill();
        }

        function carregarHistoricoFirebase(tagId, periodo) {
            var agora = Date.now();
            var tempoMs = { '1h': 3600000, '6h': 21600000, '24h': 86400000, '7d': 604800000 };
            var desde = agora - (tempoMs[periodo] || 3600000);

            db.ref('history').orderByChild('_timestamp').startAt(desde).once('value').then(function(snapshot) {
                var dados = snapshot.val();
                var pontos = [];
                if (dados) {
                    var keys = Object.keys(dados);
                    for (var i = 0; i < keys.length; i++) {
                        var entry = dados[keys[i]];
                        if (entry && entry[tagId] !== undefined) {
                            var val = entry[tagId];
                            var valor = (typeof val === 'object' && 'v' in val) ? val.v : (typeof val === 'number' ? val : null);
                            if (valor !== null) {
                                pontos.push({ t: entry._timestamp || 0, v: valor });
                            }
                        }
                    }
                }
                pontos.sort(function(a, b) { return a.t - b.t; });
                desenharGraficoModal(pontos, tagId);
            }).catch(function(e) {
                // Fallback: usar histórico local
                var hist = historico[tagId] || [];
                var pontos = [];
                for (var i = 0; i < hist.length; i++) {
                    pontos.push({ t: Date.now() - (hist.length - i) * 30000, v: hist[i] });
                }
                desenharGraficoModal(pontos, tagId);
            });
        }

        function desenharGraficoModal(pontos, tagId) {
            var canvas = document.getElementById('modal-canvas');
            var rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = Math.floor(rect.width * 2);
            canvas.height = 500;
            var ctx = canvas.getContext('2d');
            var w = canvas.width; var h = canvas.height;
            var padding = 40;

            ctx.clearRect(0, 0, w, h);
            var isDark = document.body.getAttribute('data-theme') !== 'light';
            ctx.fillStyle = isDark ? '#0d1117' : '#f8f9fa';
            ctx.fillRect(0, 0, w, h);

            if (pontos.length < 2) {
                ctx.fillStyle = isDark ? '#555' : '#999';
                ctx.font = '24px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('Sem dados suficientes para este período', w / 2, h / 2);
                document.getElementById('stat-min').textContent = '—';
                document.getElementById('stat-med').textContent = '—';
                document.getElementById('stat-max').textContent = '—';
                document.getElementById('stat-pts').textContent = '0';
                return;
            }

            var cfg = tagConfig[tagId] || {};
            var valores = pontos.map(function(p) { return p.v; });
            var min, max;
            if (cfg.escalaMin !== undefined && cfg.escalaMax !== undefined) { min = cfg.escalaMin; max = cfg.escalaMax; }
            else { min = Math.min.apply(null, valores); max = Math.max.apply(null, valores); var mg = (max - min) * 0.15 || 1; min -= mg; max += mg; }
            var range = max - min || 1;

            var vMin = Math.min.apply(null, valores);
            var vMax = Math.max.apply(null, valores);
            var vMed = valores.reduce(function(a, b) { return a + b; }, 0) / valores.length;

            document.getElementById('stat-min

<!-- CONTINUAÇÃO — cole após o último trecho da PARTE 1 (onde cortou em stat-min) -->

            document.getElementById('stat-min').textContent = vMin.toFixed(1);
            document.getElementById('stat-med').textContent = vMed.toFixed(1);
            document.getElementById('stat-max').textContent = vMax.toFixed(1);
            document.getElementById('stat-pts').textContent = pontos.length.toString();

            function valToY(val) {
                var c = Math.max(min, Math.min(max, val));
                return h - padding - ((c - min) / range) * (h - padding * 2);
            }
            function tToX(t) {
                var tMin = pontos[0].t; var tMax = pontos[pontos.length - 1].t;
                var tRange = tMax - tMin || 1;
                return padding + ((t - tMin) / tRange) * (w - padding * 2);
            }

            // Grid horizontal
            ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.08)';
            ctx.lineWidth = 1;
            for (var g = 0; g <= 4; g++) {
                var yg = padding + (g / 4) * (h - padding * 2);
                ctx.beginPath(); ctx.moveTo(padding, yg); ctx.lineTo(w - padding, yg); ctx.stroke();
                var labelVal = max - (g / 4) * range;
                ctx.fillStyle = isDark ? '#666' : '#999';
                ctx.font = '18px monospace'; ctx.textAlign = 'right';
                ctx.fillText(labelVal.toFixed(1), padding - 5, yg + 5);
            }

            // Limites tracejados
            if (cfg.limiteAlto !== null && cfg.limiteAlto !== undefined) {
                ctx.strokeStyle = 'rgba(239, 83, 80, 0.6)'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
                ctx.beginPath(); ctx.moveTo(padding, valToY(cfg.limiteAlto)); ctx.lineTo(w - padding, valToY(cfg.limiteAlto)); ctx.stroke(); ctx.setLineDash([]);
                ctx.fillStyle = '#ef5350'; ctx.font = '16px sans-serif'; ctx.textAlign = 'left';
                ctx.fillText('Alto: ' + cfg.limiteAlto, w - padding + 5, valToY(cfg.limiteAlto) + 5);
            }
            if (cfg.limiteBaixo !== null && cfg.limiteBaixo !== undefined) {
                ctx.strokeStyle = 'rgba(66, 165, 245, 0.6)'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
                ctx.beginPath(); ctx.moveTo(padding, valToY(cfg.limiteBaixo)); ctx.lineTo(w - padding, valToY(cfg.limiteBaixo)); ctx.stroke(); ctx.setLineDash([]);
                ctx.fillStyle = '#42a5f5'; ctx.font = '16px sans-serif'; ctx.textAlign = 'left';
                ctx.fillText('Baixo: ' + cfg.limiteBaixo, w - padding + 5, valToY(cfg.limiteBaixo) + 5);
            }

            // Área preenchida
            var alarm = getAlarmInfo(tagId, pontos[pontos.length - 1].v);
            var corLinha = '#4fc3f7', corFill = 'rgba(79, 195, 247, 0.15)';
            if (alarm.cor && corMap[alarm.cor]) { corLinha = corMap[alarm.cor].linha; corFill = corMap[alarm.cor].fill; }

            ctx.beginPath();
            for (var i = 0; i < pontos.length; i++) {
                var x = tToX(pontos[i].t); var y = valToY(pontos[i].v);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.lineTo(tToX(pontos[pontos.length - 1].t), h - padding);
            ctx.lineTo(tToX(pontos[0].t), h - padding);
            ctx.closePath(); ctx.fillStyle = corFill; ctx.fill();

            // Linha principal
            ctx.beginPath();
            for (var j = 0; j < pontos.length; j++) {
                var px = tToX(pontos[j].t); var py = valToY(pontos[j].v);
                if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.strokeStyle = corLinha; ctx.lineWidth = 3; ctx.stroke();

            // Ponto final
            var lastPx = tToX(pontos[pontos.length - 1].t);
            var lastPy = valToY(pontos[pontos.length - 1].v);
            ctx.beginPath(); ctx.arc(lastPx, lastPy, 6, 0, Math.PI * 2);
            ctx.fillStyle = corLinha; ctx.fill();
            ctx.strokeStyle = isDark ? '#fff' : '#000'; ctx.lineWidth = 2; ctx.stroke();

            // Labels de tempo no eixo X
            ctx.fillStyle = isDark ? '#666' : '#999';
            ctx.font = '16px monospace'; ctx.textAlign = 'center';
            var numLabels = Math.min(6, pontos.length);
            for (var l = 0; l < numLabels; l++) {
                var idx = Math.floor(l * (pontos.length - 1) / (numLabels - 1));
                var lx = tToX(pontos[idx].t);
                var dt = new Date(pontos[idx].t);
                var label = dt.getHours().toString().padStart(2, '0') + ':' + dt.getMinutes().toString().padStart(2, '0');
                ctx.fillText(label, lx, h - 5);
            }
        }

        // ============ CONNECTION ============
        function updateConnectionStatus(connected) {
            var el = document.getElementById('conn-status');
            if (connected) { el.textContent = '● Conectado'; el.className = 'connection'; }
            else { el.textContent = '● Offline'; el.className = 'connection offline'; }
        }

        function logout() {
            localStorage.removeItem('modo_acesso'); localStorage.removeItem('login_timestamp');
            firebase.auth().signOut().then(function() { window.location.href = 'index.html'; });
        }
    </script>
</body>
</html>
