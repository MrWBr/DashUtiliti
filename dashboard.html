<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilidades - Mondelēz</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#7c3aed">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --bg1: #0d1117;
            --bg2: #161b22;
            --bg3: rgba(255,255,255,0.03);
            --bg-card: rgba(255,255,255,0.05);
            --bg-card-hover: rgba(255,255,255,0.08);
            --glass: rgba(255,255,255,0.02);
            --glass-border: rgba(255,255,255,0.08);
            --t1: #ffffff;
            --t2: #8b949e;
            --t3: #484f58;
            --accent: #7c3aed;
            --accent2: #06b6d4;
            --gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --gradient-soft: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(6,182,212,0.15));
            --gradient-fill: linear-gradient(180deg, rgba(124,58,237,0.3), rgba(6,182,212,0.05));
            --red: #ef4444;
            --orange: #f97316;
            --green: #22c55e;
            --blue: #3b82f6;
            --yellow: #eab308;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --radius: 16px;
            --radius-sm: 10px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; background: var(--bg1); color: var(--t1); min-height:100vh; overflow-x:hidden; }

        /* === HEADER === */
        .header { background: var(--bg2); padding: 16px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--glass-border); position:sticky; top:0; z-index:100; backdrop-filter: blur(20px); }
        .header-left { display:flex; align-items:center; gap:12px; }
        .header-logo { width:32px; height:32px; border-radius:8px; background: var(--gradient); display:flex; align-items:center; justify-content:center; font-size:16px; }
        .header h1 { font-size: 1em; font-weight: 600; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header-right { display:flex; align-items:center; gap:10px; }
        .status-badge { font-size:.7em; padding:4px 10px; border-radius:20px; background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
        .status-badge.offline { background: rgba(239,68,68,0.15); color: var(--red); border-color: rgba(239,68,68,0.3); }
        .btn-icon { background: var(--bg-card); border: 1px solid var(--glass-border); color: var(--t2); width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; transition: all .2s; }
        .btn-icon:hover { background: var(--bg-card-hover); color: var(--t1); }

        /* === TABS === */
        .tabs { display:flex; gap:4px; padding:12px 16px; background: var(--bg2); border-bottom: 1px solid var(--glass-border); overflow-x:auto; -webkit-overflow-scrolling:touch; }
        .tabs::-webkit-scrollbar { display:none; }
        .tab { padding:8px 16px; border-radius:10px; font-size:.75em; font-weight:500; color: var(--t2); background: transparent; border: none; cursor:pointer; white-space:nowrap; transition: all .2s; }
        .tab:hover { color: var(--t1); background: var(--bg-card); }
        .tab.active { background: var(--gradient); color: #fff; font-weight:600; }

        /* === LEITOR STATUS === */
        .leitor-bar { display:flex; align-items:center; justify-content:space-between; padding:10px 20px; background: var(--glass); border-bottom: 1px solid var(--glass-border); }
        .leitor-left { display:flex; align-items:center; gap:10px; font-size:.75em; }
        .leitor-dot { width:8px; height:8px; border-radius:50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
        .leitor-dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); animation:none; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(.85)} }
        .leitor-right { display:flex; gap:16px; font-size:.7em; color: var(--t2); }
        .leitor-right .val { color: var(--accent2); font-weight:600; }
        .last-update { text-align:center; font-size:.68em; color: var(--t3); padding:6px 20px; background: var(--bg2); }

        /* === OVERVIEW CARDS (Visão Geral) === */
        .overview-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:12px; padding:16px; }
        .overview-card { background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius); padding:16px; position:relative; overflow:hidden; transition: all .3s; }
        .overview-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
        .overview-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background: var(--gradient); border-radius: var(--radius) var(--radius) 0 0; }
        .overview-label { font-size:.65em; color: var(--t2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
        .overview-value { font-size:1.8em; font-weight:700; background: var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .overview-sub { font-size:.7em; color: var(--t3); margin-top:4px; }
        .overview-card .donut-container { position:absolute; top:12px; right:12px; width:44px; height:44px; }
        /* Cards com gauge no canto reservam espaço à direita pro texto não passar por baixo do desenho */
        .overview-card.has-gauge { padding-right:74px; }
        .overview-gauge-canvas { position:absolute; top:10px; right:10px; width:54px; height:54px; }

        /* === DATA CARDS === */
        .section-container { padding:12px 16px; }
        .section-title { font-size:.7em; color: var(--accent); text-transform:uppercase; letter-spacing:1px; font-weight:600; margin-bottom:10px; padding-left:4px; }
        .cards-grid { display:flex; flex-direction:column; gap:8px; }
        .data-card { display:flex; align-items:center; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding:14px 16px; gap:14px; transition: all .3s; cursor:pointer; position:relative; overflow:hidden; }
        .data-card:hover { background: var(--bg-card-hover); transform: translateX(4px); }
        .data-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background: var(--gradient); }
        .data-card.alarm-red::before { background: var(--red); }
        .data-card.alarm-red { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
        .data-card.alarm-red .card-value { color: var(--red); }
        .data-card.alarm-blue::before { background: var(--blue); }
        .data-card.alarm-blue { border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.05); }
        .data-card.alarm-blue .card-value { color: var(--blue); }
        .data-card.alarm-orange::before { background: var(--orange); }
        .data-card.alarm-orange { border-color: rgba(249,115,22,0.3); background: rgba(249,115,22,0.05); }
        .data-card.alarm-orange .card-value { color: var(--orange); }
        .card-info { flex-shrink:0; min-width:fit-content; }
        .card-name { font-size:.7em; color: var(--t2); text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; }
        .card-value { font-size:1.5em; font-weight:700; color: var(--t1); margin-top:2px; }
        .card-value .unit { font-size:.5em; color: var(--t3); font-weight:400; margin-left:3px; }
        .card-spark { flex:1; min-width:60px; height:50px; position:relative; }
        .card-spark canvas { width:100%; height:100%; display:block; }
        .card-trend { font-size:1.1em; width:24px; text-align:center; flex-shrink:0; }
        .trend-up { color: var(--red); }
        .trend-down { color: var(--green); }
        .trend-stable { color: var(--t3); }

        /* === ENERGIA TAB === */
        .energia-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:12px; padding:16px; }
        .trafo-card { background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius); padding:18px; position:relative; overflow:hidden; }
        .trafo-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background: var(--gradient); }
        .trafo-card.offline::before { background: var(--red); }
        .trafo-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
        .trafo-nome { font-size:.85em; font-weight:600; color: var(--t1); }
        .trafo-status { font-size:.65em; padding:3px 8px; border-radius:12px; }
        .trafo-status.online { background: rgba(34,197,94,0.15); color: var(--green); }
        .trafo-status.offline { background: rgba(239,68,68,0.15); color: var(--red); }
        .trafo-status.alerta { background: rgba(249,115,22,0.15); color: var(--orange); }
        .trafo-body { display:flex; gap:16px; align-items:center; }
        .trafo-donut { width:80px; height:80px; position:relative; flex-shrink:0; }
        .trafo-donut canvas { width:100%; height:100%; }
        .trafo-donut-label { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
        .trafo-donut-value { font-size:1.1em; font-weight:700; color: var(--t1); }
        .trafo-donut-sub { font-size:.55em; color: var(--t3); }
        .trafo-metrics { flex:1; display:flex; flex-direction:column; gap:6px; }
        .trafo-metric { display:flex; justify-content:space-between; align-items:center; font-size:.72em; }
        .trafo-metric-label { color: var(--t2); }
        .trafo-metric-value { color: var(--t1); font-weight:600; font-family:monospace; }
        .trafo-metric-value.alarm { color: var(--red); }

        /* === MODAL === */
        .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.9); z-index:200; align-items:center; justify-content:center; padding:15px; backdrop-filter:blur(8px); }
        .modal-overlay.show { display:flex; }
        .modal { background: var(--bg2); border-radius: var(--radius); width:100%; max-width:700px; max-height:90vh; overflow-y:auto; padding:24px; position:relative; border: 1px solid var(--glass-border); box-shadow: var(--shadow); }
        .modal-close { position:absolute; top:12px; right:16px; background:none; border:none; color: var(--t2); font-size:1.5em; cursor:pointer; }
        .modal h2 { background: var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; font-size:1.1em; margin-bottom:5px; }
        .modal-valor { font-size:2.2em; font-weight:700; margin-bottom:12px; }
        .modal-periodo { display:flex; gap:8px; margin-bottom:16px; }
        .modal-periodo button { background: var(--bg-card); color: var(--accent2); border: 1px solid var(--glass-border); padding:6px 14px; border-radius:8px; font-size:.75em; cursor:pointer; transition: all .2s; }
        .modal-periodo button.active { background: var(--gradient); color:#fff; border-color:transparent; }
        .modal canvas { width:100%; height:250px; display:block; border-radius: var(--radius-sm); background: var(--bg-card); }
        .modal-stats { display:flex; justify-content:space-around; margin-top:14px; font-size:.8em; color: var(--t2); }
        .modal-stats .stat-val { font-weight:700; color: var(--t1); font-size:1.2em; }

        /* === TOOLBAR === */
        .toolbar { display:flex; gap:6px; padding:8px 16px; background: var(--bg2); border-bottom: 1px solid var(--glass-border); }
        .toolbar button { background: var(--bg-card); color: var(--t2); border: 1px solid var(--glass-border); padding:6px 12px; border-radius:8px; font-size:.7em; cursor:pointer; transition: all .2s; }
        .toolbar button:hover { color: var(--t1); background: var(--bg-card-hover); }
        .toolbar button.active { background: var(--gradient); color:#fff; border-color:transparent; }

        /* === ALARMES === */
        .alarmes-section { display:none; padding:16px; }
        .alarme-item { display:flex; align-items:center; gap:10px; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding:10px 14px; font-size:.75em; margin-bottom:6px; border-left:3px solid var(--t3); }
        .alarme-item.tipo-limite { border-left-color: var(--red); }
        .alarme-item.tipo-taxa { border-left-color: var(--orange); }
        .alarme-item.tipo-tempo_faixa { border-left-color: var(--blue); }
        .alarme-item.tipo-saida { border-left-color: var(--green); }

        /* === RESPONSIVE === */
        @media (max-width: 480px) {
            .overview-grid { grid-template-columns: repeat(2, 1fr); gap:8px; }
            .energia-grid { grid-template-columns: 1fr; }
            .card-value { font-size:1.3em; }
            .overview-value { font-size:1.5em; }
            .overview-card.has-gauge { padding-right:58px; }
            .overview-gauge-canvas { width:42px; height:42px; top:8px; right:8px; }
        }

        /* === SCROLLBAR === */
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background: var(--bg1); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius:4px; }

        /* === WIDGET / PIP — faixa tipo "ticker" de bolsa, rolando na horizontal === */
        .btn-icon.widget-on { background: var(--gradient); color:#fff; border-color:transparent; }
        .widget-ticker-bar { position:relative; display:flex; align-items:center; height:40px; background: var(--bg2); overflow:hidden; }
        .widget-ticker-viewport { flex:1; overflow:hidden; height:100%; display:flex; align-items:center; }
        .widget-ticker-track { display:inline-flex; align-items:center; white-space:nowrap; animation: ticker-scroll 26s linear infinite; will-change: transform; }
        .widget-ticker-track:hover { animation-play-state: paused; }
        @keyframes ticker-scroll { from{ transform: translateX(0); } to{ transform: translateX(-50%); } }
        .ticker-item { display:inline-flex; align-items:baseline; gap:5px; padding:0 16px; font-size:.72em; font-weight:700; color: var(--t1); white-space:nowrap; }
        .ticker-item .tlabel { color: var(--t2); font-weight:500; }
        .ticker-item.alarm { color: var(--red); }
        .ticker-sep { color: var(--t3); opacity:.5; font-size:.7em; }
        .widget-close, .widget-modo { flex-shrink:0; background: var(--bg-card); border:1px solid var(--glass-border); color: var(--t2); border-radius:50%; width:20px; height:20px; font-size:.6em; line-height:1; cursor:pointer; margin:0 4px; }

        /* Modo tabela — lista simples com todas as tags de todas as abas, rolável */
        .widget-tabela-bar { display:flex; flex-direction:column; background: var(--bg2); }
        .widget-tabela-header { display:flex; align-items:center; justify-content:space-between; padding:6px 8px 6px 12px; border-bottom:1px solid var(--glass-border); flex-shrink:0; }
        .widget-tabela-header span { font-size:.68em; font-weight:700; color: var(--t1); text-transform:uppercase; letter-spacing:.5px; }
        .widget-tabela-actions { display:flex; align-items:center; }
        .widget-tabela-scroll { max-height:320px; overflow-y:auto; padding:2px 0 6px; }
        .wt-secao { font-size:.6em; color: var(--accent); text-transform:uppercase; letter-spacing:.6px; font-weight:700; padding:8px 12px 3px; }
        .wt-linha { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:3px 12px; font-size:.7em; color: var(--t1); }
        .wt-nome { color: var(--t2); }
        .wt-valor { font-weight:700; font-family:monospace; white-space:nowrap; }
        .wt-linha.alarm .wt-valor { color: var(--red); }
        .wt-linha.alarm .wt-nome { color: var(--red); opacity:.85; }

        /* Fallback flutuante (quando o navegador não suporta Document Picture-in-Picture) */
        #widget-fallback { display:none; position:fixed; bottom:16px; right:16px; width:320px; max-height:80vh; background: var(--bg2); border:1px solid var(--glass-border); border-radius: var(--radius); box-shadow: var(--shadow); z-index:500; overflow:hidden; }
        #widget-fallback.show { display:block; }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="header-logo">🏭</div>
            <h1>Utilidades</h1>
        </div>
        <div class="header-right">
            <span class="status-badge" id="conn-status">● Online</span>
            <button class="btn-icon" onclick="toggleTheme()" id="btn-theme" title="Alternar tema" aria-label="Alternar tema">☀️</button>
            <button class="btn-icon" onclick="toggleWidget()" id="btn-widget" title="Modo Widget (PIP)" aria-label="Modo Widget (PIP)">🧩</button>
            <button class="btn-icon" onclick="exportarCSV()" title="Exportar CSV" aria-label="Exportar CSV">📥</button>
            <button class="btn-icon" onclick="toggleNotificacoes()" id="btn-notif" title="Ativar notificações" aria-label="Ativar notificações">🔔</button>
            <button class="btn-icon" onclick="logout()" title="Sair" aria-label="Sair">⏻</button>
        </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab active" onclick="mudarTab('overview',this)">📊 Visão Geral</button>
        <button class="tab" onclick="mudarTab('temp',this)">🌡️ Temperaturas</button>
        <button class="tab" onclick="mudarTab('ar',this)">💨 Ar Comprimido</button>
        <button class="tab" onclick="mudarTab('cura',this)">🧊 Salas de Cura</button>
        <button class="tab" onclick="mudarTab('vapor',this)">♨️ Vapor/Água</button>
        <button class="tab" onclick="mudarTab('energia',this)">⚡ Energia</button>
        <button class="tab" onclick="mudarTab('alarmes',this)">📋 Alarmes</button>
    </div>

    <!-- LEITOR STATUS -->
    <div class="leitor-bar">
        <div class="leitor-left">
            <div class="leitor-dot" id="leitor-dot"></div>
            <span id="leitor-label" style="color:var(--t2)">Leitor: verificando...</span>
        </div>
        <div class="leitor-right">
            <span>📖 <span class="val" id="leitor-leituras">0</span></span>
            <span>⏱️ <span class="val" id="leitor-uptime">00:00</span></span>
        </div>
    </div>
    <div class="last-update" id="last-update">Aguardando dados...</div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="content-area">
        <!-- Overview (padrão) -->
        <div id="tab-overview" class="tab-content">
            <div class="overview-grid" id="overview-grid"></div>
            <div class="section-container">
                <div class="section-title">Variáveis em Alarme</div>
                <div class="cards-grid" id="alarme-cards"></div>
            </div>
        </div>

        <!-- Temperaturas -->
        <div id="tab-temp" class="tab-content" style="display:none">
            <div class="section-container">
                <div class="cards-grid" id="cards-temp"></div>
            </div>
        </div>

        <!-- Ar Comprimido -->
        <div id="tab-ar" class="tab-content" style="display:none">
            <div class="section-container">
                <div class="cards-grid" id="cards-ar"></div>
            </div>
        </div>

        <!-- Salas de Cura -->
        <div id="tab-cura" class="tab-content" style="display:none">
            <div class="section-container">
                <div class="cards-grid" id="cards-cura"></div>
            </div>
        </div>

        <!-- Vapor/Água -->
        <div id="tab-vapor" class="tab-content" style="display:none">
            <div class="section-container">
                <div class="cards-grid" id="cards-vapor"></div>
            </div>
        </div>

        <!-- Energia Elétrica -->
        <div id="tab-energia" class="tab-content" style="display:none">
            <div class="section-container">
                <div class="section-title">⚡ Subestações & Transformadores</div>
                <div class="overview-grid" id="energia-resumo"></div>
            </div>
            <div class="energia-grid" id="energia-trafos"></div>
            <div class="section-container">
                <div class="section-title">📊 Medições Gerais</div>
                <div class="cards-grid" id="cards-energia"></div>
            </div>
        </div>

        <!-- Alarmes -->
        <div id="tab-alarmes" class="tab-content" style="display:none">
            <div class="alarmes-section" style="display:block">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                    <h2 style="color:var(--accent);font-size:.9em">📋 Log de Alarmes</h2>
                    <div style="display:flex;gap:6px" id="alarme-filtros"></div>
                </div>
                <div class="overview-grid" id="alarme-resumo" style="margin-bottom:12px"></div>
                <div id="alarmes-lista"></div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)this.classList.remove('show')">
        <div class="modal">
            <button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('show')">✕</button>
            <h2 id="modal-titulo">—</h2>
            <div class="modal-valor" id="modal-valor">—</div>
            <div class="modal-periodo">
                <button class="active" onclick="mudarPeriodo('1h',this)">1h</button>
                <button onclick="mudarPeriodo('6h',this)">6h</button>
                <button onclick="mudarPeriodo('24h',this)">24h</button>
                <button onclick="mudarPeriodo('7d',this)">7d</button>
            </div>
            <canvas id="modal-canvas"></canvas>
            <div class="modal-stats">
                <div><div class="stat-val" id="stat-min">—</div>Mínimo</div>
                <div><div class="stat-val" id="stat-med">—</div>Média</div>
                <div><div class="stat-val" id="stat-max">—</div>Máximo</div>
                <div><div class="stat-val" id="stat-pts">—</div>Pontos</div>
            </div>
        </div>
    </div>

    <!-- WIDGET FLUTUANTE (fallback quando o navegador não suporta Document Picture-in-Picture) -->
    <div id="widget-fallback"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    
    <script>
    (function(){

        // ===== VARIÁVEIS GLOBAIS =====
        var historico={},MAX_HIST=30,ultimosDados=null,ultimoTimestamp=null;

        // ===== TABS =====
        window.mudarTab=function(tab,btn){

            document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});

        // ===== INIT =====
        // Renderizar a cada valor recebido do Firebase pode gerar trabalho de DOM/canvas à toa se o
        // leitor publicar com muita frequência. O histórico (sparklines) é atualizado a cada tick —
        // é barato e mantém a densidade dos dados — mas o render pesado (grid, gauges, cards, widget)
        // é limitado a no máximo ~1x a cada RENDER_MIN_INTERVAL ms (primeira atualização é imediata).
        var RENDER_MIN_INTERVAL=800,renderTimer=null,ultimaRenderizacao=0;
        function agendarRender(){
            if(renderTimer)return;
            var espera=Math.max(0,RENDER_MIN_INTERVAL-(Date.now()-ultimaRenderizacao));
            renderTimer=setTimeout(function(){
                renderTimer=null;ultimaRenderizacao=Date.now();
                renderAll(ultimosDados);atualizarIndicadorTempo();
                verificarAlarmesNotif(ultimosDados);atualizarWidget(ultimosDados);
            },espera);
        }

        function initDashboard(){
            db.ref('current').on('value',function(snap){
                var data=snap.val();if(!data)return;
                ultimosDados=data;ultimoTimestamp=data._timestamp||Date.now();
                atualizarHistorico(data);agendarRender();
            });
            db.ref('leitor_status').on('value',function(snap){atualizarStatusLeitor(snap.val())});
            db.ref('.info/connected').on('value',function(snap){
                var el=document.getElementById('conn-status');
                if(snap.val()){el.textContent='● Online';el.className='status-badge'}
                else{el.textContent='● Offline';el.className='status-badge offline'}
            });
        }

        // ===== RENDER ALL =====
        function renderAll(data){
            if(tabAtual==='overview')renderOverview(data);
            else if(tabAtual==='energia')renderEnergia(data);
            else if(tabAtual==='alarmes')renderAlarmes();
            else renderGrupo(tabAtual,data);
        }

        // ===== OVERVIEW COM GAUGES =====
        // Tags físicas mostradas na Visão Geral, cada uma com sua própria faixa (min/max do gauge)
        // e direção de perigo (perigoAlto=true quando valor alto é ruim, ex: água quente).
        var fisicoConfig={
            agua:{tag:'Agua_6C',min:3,max:10,perigoAlto:true},
            arDM:{tag:'Ar_Comp_DM',min:4,max:8,perigoAlto:false},
            arChoco:{tag:'Ar_Comp_Choco',min:4,max:8,perigoAlto:false},
            vaporBG:{tag:'Pressao_Cavalete_BG',min:8,max:15,perigoAlto:false},
            vaporChoco:{tag:'Pressao_Vapor_Choco',min:3,max:10,perigoAlto:false},
            vacuo:{tag:'Vacuo_Dry_Mix',min:10,max:30,perigoAlto:false}
        };

        function clamp01(n){return Math.max(0,Math.min(1,n))}

        function calcOverviewStats(data){
            var totalVars=0,emAlarme=0,normal=0;
            var keys=Object.keys(data);
            for(var i=0;i<keys.length;i++){
                if(keys[i].startsWith('_'))continue;
                var valor=getVal(data,keys[i]);
                if(valor===null)continue;totalVars++;
                var alarm=getAlarmInfo(keys[i],valor);
                if(alarm.tipo!=='none')emAlarme++;else normal++;
            }
            var pctOk=totalVars>0?Math.round((normal/totalVars)*100):0;

            var fisico={};
            Object.keys(fisicoConfig).forEach(function(chave){
                var f=fisicoConfig[chave],val=getVal(data,f.tag);
                fisico[chave]={
                    val:val,
                    alarm:val!==null&&getAlarmInfo(f.tag,val).tipo!=='none',
                    pct:val!==null?clamp01((val-f.min)/(f.max-f.min)):0,
                    perigoAlto:f.perigoAlto
                };
            });

            return{totalVars:totalVars,emAlarme:emAlarme,normal:normal,pctOk:pctOk,fisico:fisico};
        }

        function overviewCardHTML(id,label,valorTxt,subTxt,alarm){
            var corTxt=alarm?'background:linear-gradient(135deg,var(--red),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent':'';
            return '<div class="overview-card has-gauge"><div class="overview-label">'+label+'</div><div class="overview-value" style="'+corTxt+'">'+valorTxt+'</div><div class="overview-sub">'+subTxt+'</div><canvas id="'+id+'" width="120" height="120" class="overview-gauge-canvas"></canvas></div>';
        }

        // Rótulos e unidades dos cards físicos, na ordem em que aparecem na Visão Geral
        var fisicoCards=[
            {chave:'agua',label:'🌡️ Água 6°C',sub:'°C · gelada'},
            {chave:'arDM',label:'💨 Ar Comp. DM',sub:'bar'},
            {chave:'arChoco',label:'💨 Ar Comp. Choco',sub:'bar'},
            {chave:'vaporBG',label:'♨️ Vapor B&G',sub:'bar'},
            {chave:'vaporChoco',label:'♨️ Vapor Choco',sub:'bar'},
            {chave:'vacuo',label:'🌀 Vácuo',sub:'Pol Hg'}
        ];

        // Renderiza os gauges do painel (usado na Visão Geral)
        function renderOverviewInto(gridEl,data,doc,prefix){
            if(!gridEl)return;
            var s=calcOverviewStats(data);
            var pS=prefix||'';
            var idSaude=pS+'gauge-saude',idAlarme=pS+'gauge-alarme';

            var html=overviewCardHTML(idSaude,'Saúde Utilidades',s.pctOk+'%',s.normal+'/'+s.totalVars+' OK',false)
                +overviewCardHTML(idAlarme,'Em Alarme',s.emAlarme,'fora do limite',s.emAlarme>0);
            fisicoCards.forEach(function(c){
                var f=s.fisico[c.chave];
                html+=overviewCardHTML(pS+'gauge-'+c.chave,c.label,f.val!==null?f.val.toFixed(1):'—',c.sub,f.alarm);
            });
            gridEl.innerHTML=html;

            setTimeout(function(){
                desenharGauge(idSaude,s.pctOk,100,'normal',doc);
                desenharGauge(idAlarme,s.emAlarme,s.totalVars||1,'alarme',doc);
                fisicoCards.forEach(function(c){
                    var f=s.fisico[c.chave];
                    desenharGaugeFisico(pS+'gauge-'+c.chave,f.pct,f.perigoAlto,doc);
                });
            },50);
        }

        function renderOverview(data){
            renderOverviewInto(document.getElementById('overview-grid'),data,document,'');

            var keys=Object.keys(data);
            var alarmCards=document.getElementById('alarme-cards');alarmCards.innerHTML='';
            for(var j=0;j<keys.length;j++){
                if(keys[j].startsWith('_'))continue;
                var val2=getVal(data,keys[j]);
                if(val2===null)continue;
                var a2=getAlarmInfo(keys[j],val2);
                if(a2.tipo!=='none')alarmCards.appendChild(criarDataCard(keys[j],val2,getCfg(keys[j])));
            }
            if(!alarmCards.innerHTML)alarmCards.innerHTML='<div style="text-align:center;color:var(--t3);padding:20px;font-size:.8em">✅ Tudo normal</div>';
        }

        // ===== GAUGE (CORTA-GIRO) — contagens (saúde geral / alarmes) =====
        function desenharGauge(canvasId,valor,maximo,tipo,doc){
            doc=doc||document;
            var canvas=doc.getElementById(canvasId);if(!canvas)return;
            var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;
            var cx=w/2,cy=h*0.55,r=w*0.38,lw=w*0.12;
            ctx.clearRect(0,0,w,h);
            var startAngle=0.75*Math.PI,endAngle=2.25*Math.PI,totalAngle=1.5*Math.PI;
            ctx.beginPath();ctx.arc(cx,cy,r,startAngle,endAngle);ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
            var pct=maximo>0?(valor/maximo):0;pct=Math.max(0,Math.min(1,pct));
            var valueAngle=startAngle+(pct*totalAngle);
            var grad=ctx.createLinearGradient(0,0,w,h);
            if(tipo==='alarme'){
                var pctA=maximo>0?((maximo-valor)/maximo):0;valueAngle=startAngle+(pctA*totalAngle);
                grad.addColorStop(0,'#22c55e');grad.addColorStop(0.5,'#eab308');grad.addColorStop(1,'#ef4444');
            }else{grad.addColorStop(0,'#ef4444');grad.addColorStop(0.5,'#eab308');grad.addColorStop(1,'#22c55e')}
            if(pct>0||tipo==='alarme'){ctx.beginPath();ctx.arc(cx,cy,r,startAngle,valueAngle);ctx.strokeStyle=grad;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke()}
            var nx=cx+Math.cos(valueAngle)*r,ny=cy+Math.sin(valueAngle)*r;
            ctx.beginPath();ctx.arc(nx,ny,lw*0.4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
            ctx.beginPath();ctx.arc(cx,cy,lw*0.3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fill();
        }

        // ===== GAUGE FÍSICO (água / ar comprimido / vapor / vácuo) =====
        // pct já vem normalizado 0..1 dentro da faixa da grandeza. perigoAlto=true quando valor alto é ruim
        // (ex: água quente), perigoAlto=false quando valor baixo é ruim (ex: pressão/vácuo caindo).
        function desenharGaugeFisico(canvasId,pct,perigoAlto,doc){
            doc=doc||document;
            var canvas=doc.getElementById(canvasId);if(!canvas)return;
            var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;
            var cx=w/2,cy=h*0.55,r=w*0.38,lw=w*0.12;
            ctx.clearRect(0,0,w,h);
            var startAngle=0.75*Math.PI,endAngle=2.25*Math.PI,totalAngle=1.5*Math.PI;
            ctx.beginPath();ctx.arc(cx,cy,r,startAngle,endAngle);ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
            pct=Math.max(0,Math.min(1,pct||0));
            var valueAngle=startAngle+(pct*totalAngle);
            var grad=ctx.createLinearGradient(0,0,w,h);
            if(perigoAlto){grad.addColorStop(0,'#22c55e');grad.addColorStop(0.5,'#eab308');grad.addColorStop(1,'#ef4444')}
            else{grad.addColorStop(0,'#ef4444');grad.addColorStop(0.5,'#eab308');grad.addColorStop(1,'#22c55e')}
            if(pct>0){ctx.beginPath();ctx.arc(cx,cy,r,startAngle,valueAngle);ctx.strokeStyle=grad;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke()}
            var nx=cx+Math.cos(valueAngle)*r,ny=cy+Math.sin(valueAngle)*r;
            ctx.beginPath();ctx.arc(nx,ny,lw*0.4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
            ctx.beginPath();ctx.arc(cx,cy,lw*0.3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fill();
        }


        // ===== RENDER GRUPO =====
        function renderGrupo(grupo,data){
            var container=document.getElementById('cards-'+grupo);if(!container)return;container.innerHTML='';
            var keys=Object.keys(tagConfig);
            for(var i=0;i<keys.length;i++){
                var cfg=tagConfig[keys[i]];if(cfg.grupo!==grupo)continue;
                var valor=getVal(data,keys[i]);
                if(valor===null)valor=0;
                container.appendChild(criarDataCard(keys[i],valor,cfg));
            }
            setTimeout(redesenharSparklines,50);
        }

        // ===== RENDER ENERGIA =====
        function renderEnergia(data){
            var resumo=document.getElementById('energia-resumo');
            var demanda=getVal(data,'Demanda_Total'),fp=getVal(data,'FP_Geral');
            var consumo=getVal(data,'Consumo_Dia'),tensao=getVal(data,'Tensao_Entrada');
            resumo.innerHTML='<div class="overview-card"><div class="overview-label">Demanda Atual</div><div class="overview-value">'+(demanda!==null?demanda.toFixed(0):'—')+'</div><div class="overview-sub">kW</div></div>'
                +'<div class="overview-card"><div class="overview-label">Fator Potência</div><div class="overview-value">'+(fp!==null?fp.toFixed(3):'—')+'</div><div class="overview-sub">'+(fp!==null&&fp<0.92?'⚠️ Abaixo':'✅ OK')+'</div></div>'
                +'<div class="overview-card"><div class="overview-label">Consumo Hoje</div><div class="overview-value">'+(consumo!==null?(consumo/1000).toFixed(1):'—')+'</div><div class="overview-sub">MWh</div></div>'
                +'<div class="overview-card"><div class="overview-label">Tensão</div><div class="overview-value">'+(tensao!==null?tensao.toFixed(1):'—')+'</div><div class="overview-sub">kV</div></div>';

            var trafosDiv=document.getElementById('energia-trafos');trafosDiv.innerHTML='';
            for(var i=0;i<energiaConfig.trafos.length;i++){
                var trafo=energiaConfig.trafos[i];
                var carga=getVal(data,trafo.id+'_Carga'),temp=getVal(data,trafo.id+'_Temp');
                var corrente=getVal(data,trafo.id+'_Corrente'),status=getVal(data,trafo.id+'_Status');
                var pctCarga=carga!==null?(carga/trafo.potencia*100):null;
                var statusClass='online',statusText='Online';
                if(status===0){statusClass='offline';statusText='Offline'}
                else if(pctCarga!==null&&pctCarga>85){statusClass='alerta';statusText='Carga Alta'}
                var card=document.createElement('div');card.className='trafo-card'+(statusClass==='offline'?' offline':'');
                card.innerHTML='<div class="trafo-header"><span class="trafo-nome">'+trafo.nome+'</span><span class="trafo-status '+statusClass+'">● '+statusText+'</span></div>'
                    +'<div class="trafo-body"><div class="trafo-donut"><canvas id="donut-'+trafo.id+'" width="160" height="160"></canvas><div class="trafo-donut-label"><div class="trafo-donut-value">'+(pctCarga!==null?pctCarga.toFixed(0)+'%':'—')+'</div><div class="trafo-donut-sub">carga</div></div></div>'
                    +'<div class="trafo-metrics">'
                    +'<div class="trafo-metric"><span class="trafo-metric-label">Potência</span><span class="trafo-metric-value">'+(carga!==null?carga.toFixed(0)+' kVA':'—')+'</span></div>'
                    +'<div class="trafo-metric"><span class="trafo-metric-label">Corrente</span><span class="trafo-metric-value">'+(corrente!==null?corrente.toFixed(1)+' A':'—')+'</span></div>'
                    +'<div class="trafo-metric"><span class="trafo-metric-label">Temperatura</span><span class="trafo-metric-value'+(temp!==null&&temp>75?' alarm':'')+'">'+(temp!==null?temp.toFixed(0)+'°C':'—')+'</span></div>'
                    +'<div class="trafo-metric"><span class="trafo-metric-label">Capacidade</span><span class="trafo-metric-value">'+trafo.potencia+' '+trafo.u+'</span></div>'
                    +'</div></div>';
                trafosDiv.appendChild(card);
                if(pctCarga!==null)setTimeout((function(id,pct){return function(){desenharDonut(id,pct)}})(trafo.id,pctCarga),50);
            }

            var medContainer=document.getElementById('cards-energia');medContainer.innerHTML='';
            for(var j=0;j<energiaConfig.medicoes.length;j++){
                var med=energiaConfig.medicoes[j];var val=getVal(data,med.id);
                if(val===null)continue;
                var fakeTag={nome:med.nome,grupo:'energia',u:med.u,limiteAlto:med.limiteAlto||null,limiteBaixo:med.limiteBaixo||null,escalaMin:med.escalaMin||null,escalaMax:med.escalaMax||null,corAlto:'red',corBaixo:'orange'};
                medContainer.appendChild(criarDataCard(med.id,val,fakeTag));
            }
        }

        // ===== DONUT =====
        function desenharDonut(trafoId,pct){
            var canvas=document.getElementById('donut-'+trafoId);if(!canvas)return;
            var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;
            var cx=w/2,cy=h/2,r=60,lw=12;
            ctx.clearRect(0,0,w,h);
            ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=lw;ctx.stroke();
            var angle=(pct/100)*Math.PI*2,startA=-Math.PI/2;
            var grad=ctx.createLinearGradient(0,0,w,h);
            if(pct>85){grad.addColorStop(0,'#ef4444');grad.addColorStop(1,'#f97316')}
            else if(pct>70){grad.addColorStop(0,'#f97316');grad.addColorStop(1,'#eab308')}
            else{grad.addColorStop(0,'#7c3aed');grad.addColorStop(1,'#06b6d4')}
            ctx.beginPath();ctx.arc(cx,cy,r,startA,startA+angle);ctx.strokeStyle=grad;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
        }

        // ===== DATA CARD =====
        function criarDataCard(tagId,valor,cfg){

                if(d>0.2){tendencia='▲';tClass='trend-up'}else if(d<-0.2){tendencia='▼';tClass='trend-down'}else{tendencia='─';tClass='trend-stable'}}
            var alarmClass='';
            if(alarm.cor==='red')alarmClass=' alarm-red';

                +'<div class="card-spark"><canvas data-tag="'+tagId+'" data-alarm="'+(alarm.cor||'none')+'"></canvas></div>'

        // ===== SPARKLINES =====
        function redesenharSparklines(){
            document.querySelectorAll('.card-spark canvas').forEach(function(canvas){
                var tagId=canvas.getAttribute('data-tag'),alarmCor=canvas.getAttribute('data-alarm');
                var hist=historico[tagId]||[],cfg=getCfg(tagId)||{};
                var rect=canvas.parentElement.getBoundingClientRect();
                canvas.width=Math.floor(rect.width*2);canvas.height=Math.floor(rect.height*2);
                if(hist.length>=2)desenharSparkline(canvas,hist,alarmCor,cfg);
            });
        }
        window.addEventListener('resize',function(){setTimeout(redesenharSparklines,100)});

        function desenharSparkline(canvas,valores,alarmCor,cfg){
            var ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,p=6;
            ctx.clearRect(0,0,w,h);if(valores.length<2)return;
            var min,max;
            if(cfg.escalaMin!=null&&cfg.escalaMax!=null){min=cfg.escalaMin;max=cfg.escalaMax}
            else{min=Math.min.apply(null,valores);max=Math.max.apply(null,valores);var mg=(max-min)*0.2||1;min-=mg;max+=mg}
            var range=max-min||1;
            function vY(val){var c=Math.max(min,Math.min(max,val));return h-p-((c-min)/range)*(h-p*2)}
            if(cfg.limiteAlto!=null){ctx.strokeStyle='rgba(239,68,68,0.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,vY(cfg.limiteAlto));ctx.lineTo(w,vY(cfg.limiteAlto));ctx.stroke();ctx.setLineDash([])}
            if(cfg.limiteBaixo!=null){ctx.strokeStyle='rgba(59,130,246,0.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,vY(cfg.limiteBaixo));ctx.lineTo(w,vY(cfg.limiteBaixo));ctx.stroke();ctx.setLineDash([])}
            var cL='#7c3aed',cF='rgba(124,58,237,0.15)';
            if(alarmCor==='red'){cL='#ef4444';cF='rgba(239,68,68,0.15)'}
            else if(alarmCor==='blue'){cL='#3b82f6';cF='rgba(59,130,246,0.15)'}
            else if(alarmCor==='orange'){cL='#f97316';cF='rgba(249,115,22,0.15)'}
            ctx.beginPath();for(var i=0;i<valores.length;i++){var x=(i/(valores.length-1))*w,y=vY(valores[i]);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
            ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fillStyle=cF;ctx.fill();
            ctx.beginPath();for(var j=0;j<valores.length;j++){var px=(j/(valores.length-1))*w,py=vY(valores[j]);if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}
            ctx.strokeStyle=cL;ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
            ctx.beginPath();ctx.arc(w-2,vY(valores[valores.length-1]),4,0,Math.PI*2);ctx.fillStyle=cL;ctx.fill();
        }

            document.querySelectorAll('.modal-periodo button').forEach(function(b){b.classList.remove('active')});

        function carregarHistoricoModal(tagId,periodo){
            var ms={'1h':3600000,'6h':21600000,'24h':86400000,'7d':604800000};
            var desde=Date.now()-(ms[periodo]||3600000);
            // limitToLast evita baixar o nó 'history' inteiro em períodos longos (24h/7d) — pega os
            // registros mais recentes dentro da janela. Se a leitura for muito frequente, o ideal a
            // médio prazo é o leitor gravar um nó de histórico já agregado (ex: médias por hora).
            db.ref('history').orderByChild('_timestamp').startAt(desde).limitToLast(3000).once('value').then(function(snap){
                var dados=snap.val(),pontos=[];
                if(dados){Object.keys(dados).forEach(function(k){var e=dados[k];
                    if(e&&e[tagId]!==undefined){var val=(typeof e[tagId]==='object'&&'v' in e[tagId])?e[tagId].v:(typeof e[tagId]==='number'?e[tagId]:null);
                        if(val!==null)pontos.push({t:e._timestamp||0,v:val})}})}
                pontos.sort(function(a,b){return a.t-b.t});desenharGraficoModal(pontos,tagId);
            }).catch(function(){var hist=historico[tagId]||[],pontos=[];
                for(var i=0;i<hist.length;i++)pontos.push({t:Date.now()-(hist.length-i)*30000,v:hist[i]});desenharGraficoModal(pontos,tagId)});
        }
        function desenharGraficoModal(pontos,tagId){
            var canvas=document.getElementById('modal-canvas');var rect=canvas.getBoundingClientRect();
            canvas.width=Math.floor(rect.width*2);canvas.height=500;
            var ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,pad=40;
            ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(255,255,255,0.02)';ctx.fillRect(0,0,w,h);
            if(pontos.length<2){ctx.fillStyle='#484f58';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('Sem dados para este período',w/2,h/2);
                document.getElementById('stat-min').textContent='—';document.getElementById('stat-med').textContent='—';document.getElementById('stat-max').textContent='—';document.getElementById('stat-pts').textContent='0';return}
            var cfg=getCfg(tagId)||{},valores=pontos.map(function(p){return p.v});
            var min,max;if(cfg.escalaMin!=null&&cfg.escalaMax!=null){min=cfg.escalaMin;max=cfg.escalaMax}
            else{min=Math.min.apply(null,valores);max=Math.max.apply(null,valores);var mg=(max-min)*0.15||1;min-=mg;max+=mg}
            var range=max-min||1;
            var vMin=Math.min.apply(null,valores),vMax=Math.max.apply(null,valores);
            var vMed=valores.reduce(function(a,b){return a+b},0)/valores.length;
            document.getElementById('stat-min').textContent=vMin.toFixed(1);
            document.getElementById('stat-med').textContent=vMed.toFixed(1);
            document.getElementById('stat-max').textContent=vMax.toFixed(1);
            document.getElementById('stat-pts').textContent=pontos.length.toString();
            function vY(val){var c=Math.max(min,Math.min(max,val));return h-pad-((c-min)/range)*(h-pad*2)}
            function tX(t){return pad+((t-pontos[0].t)/(pontos[pontos.length-1].t-pontos[0].t))*(w-pad*2)}
            // Grid
            ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
            for(var g=0;g<5;g++){var gy=pad+g*((h-pad*2)/4);ctx.beginPath();ctx.moveTo(pad,gy);ctx.lineTo(w-pad,gy);ctx.stroke();
                ctx.fillStyle='#484f58';ctx.font='18px monospace';ctx.textAlign='right';ctx.fillText((max-(g/4)*range).toFixed(1),pad-8,gy+5)}
            // Limites
            if(cfg.limiteAlto!=null){ctx.strokeStyle='rgba(239,68,68,0.5)';ctx.lineWidth=1;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(pad,vY(cfg.limiteAlto));ctx.lineTo(w-pad,vY(cfg.limiteAlto));ctx.stroke();ctx.setLineDash([])}
            if(cfg.limiteBaixo!=null){ctx.strokeStyle='rgba(59,130,246,0.5)';ctx.lineWidth=1;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(pad,vY(cfg.limiteBaixo));ctx.lineTo(w-pad,vY(cfg.limiteBaixo));ctx.stroke();ctx.setLineDash([])}
            // Cores
            var alarm=getAlarmInfo(tagId,pontos[pontos.length-1].v);
            var cL='#7c3aed',cF='rgba(124,58,237,0.15)';
            if(alarm.cor==='red'){cL='#ef4444';cF='rgba(239,68,68,0.1)'}
            else if(alarm.cor==='blue'){cL='#3b82f6';cF='rgba(59,130,246,0.1)'}
            // Fill
            ctx.beginPath();for(var i=0;i<pontos.length;i++){var x=tX(pontos[i].t),y=vY(pontos[i].v);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
            ctx.lineTo(tX(pontos[pontos.length-1].t),h-pad);ctx.lineTo(tX(pontos[0].t),h-pad);ctx.closePath();ctx.fillStyle=cF;ctx.fill();
            // Line
            ctx.beginPath();for(var j=0;j<pontos.length;j++){var px=tX(pontos[j].t),py=vY(pontos[j].v);if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}
            ctx.strokeStyle=cL;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
            // Last dot
            var lx=tX(pontos[pontos.length-1].t),ly=vY(pontos[pontos.length-1].v);
            ctx.beginPath();ctx.arc(lx,ly,6,0,Math.PI*2);ctx.fillStyle=cL;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
            // Time labels
            ctx.fillStyle='#484f58';ctx.font='16px monospace';ctx.textAlign='center';
            var nL=Math.min(6,pontos.length);
            for(var l=0;l<nL;l++){var idx=Math.floor(l*(pontos.length-1)/(nL-1));var lxx=tX(pontos[idx].t);
                var dt=new Date(pontos[idx].t);ctx.fillText(dt.getHours().toString().padStart(2,'0')+':'+dt.getMinutes().toString().padStart(2,'0'),lxx,h-8)}
        }

        // ===== HELPERS =====
        function getVal(data,key){
            if(!data||!data[key])return null;
            if(typeof data[key]==='object'&&'v' in data[key])return data[key].v;
            if(typeof data[key]==='number')return data[key];return null;
        }
        // Une tagConfig (temperaturas/ar/cura/vapor) e energiaConfig.medicoes (energia) numa única
        // busca, para que alarmes, nomes e limites funcionem igual pros dois grupos de tags.
        function getCfg(tagId){
            if(tagConfig[tagId])return tagConfig[tagId];
            for(var i=0;i<energiaConfig.medicoes.length;i++){
                var m=energiaConfig.medicoes[i];
                if(m.id===tagId)return{nome:m.nome,grupo:'energia',u:m.u,limiteAlto:m.limiteAlto||null,limiteBaixo:m.limiteBaixo||null,escalaMin:m.escalaMin||null,escalaMax:m.escalaMax||null,corAlto:'red',corBaixo:'orange'};
            }
            return null;
        }
        function getAlarmInfo(tagId,valor){
            var cfg=getCfg(tagId);if(!cfg)return{tipo:'none',cor:null};
            if(cfg.limiteAlto!=null&&valor>cfg.limiteAlto)return{tipo:'alto',cor:cfg.corAlto||'red'};
            if(cfg.limiteBaixo!=null&&valor<cfg.limiteBaixo)return{tipo:'baixo',cor:cfg.corBaixo||'blue'};
            return{tipo:'none',cor:null};
        }
        function atualizarHistorico(data){
            var keys=Object.keys(data);
            for(var i=0;i<keys.length;i++){if(keys[i].startsWith('_'))continue;
                var valor=getVal(data,keys[i]);
                if(valor===null)continue;
                if(!historico[keys[i]])historico[keys[i]]=[];
                historico[keys[i]].push(valor);
                if(historico[keys[i]].length>MAX_HIST)historico[keys[i]].shift();
            }
        }
        function atualizarStatusLeitor(status){
            var dot=document.getElementById('leitor-dot'),label=document.getElementById('leitor-label');
            if(!status){dot.className='leitor-dot offline';label.textContent='Leitor: desconectado';return}
            var agora=Date.now(),diff=agora-(status.lastHeartbeat||0);
            if(diff<30000&&status.ativo){dot.className='leitor-dot';label.textContent='Leitor: ativo'}
            else{dot.className='leitor-dot offline';label.textContent='Leitor: offline ('+Math.floor(diff/1000)+'s)'}
            document.getElementById('leitor-leituras').textContent=status.leituras||0;
            if(status.uptime){var m=Math.floor(status.uptime/60),h=Math.floor(m/60);document.getElementById('leitor-uptime').textContent=h.toString().padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
            var ovUp=document.getElementById('ov-uptime');if(ovUp&&status.uptime){var m2=Math.floor(status.uptime/60),h2=Math.floor(m2/60);ovUp.textContent=h2+'h'+String(m2%60).padStart(2,'0')}
        }

        // ===== WIDGET / PICTURE-IN-PICTURE =====
        // Ao clicar, tenta abrir uma janela real "sempre no topo" via Document Picture-in-Picture
        // (Chrome/Edge desktop). Se o navegador não suportar, cai para uma faixa flutuante fixa no
        // canto da própria página. Tem dois modos de conteúdo, alternáveis pelo botão ▦/↺ dentro do
        // próprio widget — a preferência fica salva pro próximo uso:
        //   'ticker' — faixa fina rolando (texto + seta de tendência), ocupa o mínimo de espaço
        //   'tabela' — lista simples e rolável com todas as tags de todas as abas
        var pipWindow=null,widgetFallbackAtivo=false;
        var widgetModo='ticker';
        try{widgetModo=localStorage.getItem('widgetModo')==='tabela'?'tabela':'ticker'}catch(e){}

        window.toggleWidget=function(){
            if(pipWindow||widgetFallbackAtivo){fecharWidget();return}
            if('documentPictureInPicture' in window)abrirWidgetPip();
            else abrirWidgetFallback();
        };

        // Troca entre os dois modos. Como o tamanho ideal da janela PIP muda de modo pra modo (faixa
        // fina x lista mais alta), reabrimos o widget no tamanho certo em vez de tentar redimensionar
        // uma janela PIP já aberta (não é uma operação suportada de forma confiável).
        window.alternarModoWidget=function(){
            widgetModo=widgetModo==='ticker'?'tabela':'ticker';
            try{localStorage.setItem('widgetModo',widgetModo)}catch(e){}
            if(pipWindow){fecharWidget();abrirWidgetPip()}
            else if(widgetFallbackAtivo){fecharWidget();abrirWidgetFallback()}
        };

        function tamanhoJanelaWidget(){
            return widgetModo==='tabela'?{width:300,height:380}:{width:340,height:46};
        }

        function abrirWidgetPip(){
            // Alguns navegadores expõem a API mas nunca resolvem/rejeitam a promise (sem suporte real
            // ou sem gesto do usuário reconhecido) — depois de 1.5s sem resposta, cai pra faixa flutuante.
            var settled=false;
            var timeoutId=setTimeout(function(){if(!settled){settled=true;abrirWidgetFallback()}},1500);
            documentPictureInPicture.requestWindow(tamanhoJanelaWidget()).then(function(pip){
                if(settled){try{pip.close()}catch(e){}return}
                settled=true;clearTimeout(timeoutId);
                pipWindow=pip;
                pip.document.title='Utilidades - Widget';
                pip.document.documentElement.style.cssText=document.documentElement.style.cssText;
                Array.prototype.forEach.call(document.styleSheets,function(sheet){
                    try{
                        var css=Array.prototype.map.call(sheet.cssRules,function(r){return r.cssText}).join('');
                        var style=pip.document.createElement('style');style.textContent=css;pip.document.head.appendChild(style);
                    }catch(e){}
                });
                pip.addEventListener('pagehide',function(){pipWindow=null;atualizarBotaoWidget(false)},{once:true});
                atualizarBotaoWidget(true);
                if(ultimosDados)atualizarWidget(ultimosDados);
            }).catch(function(){
                if(settled)return;
                settled=true;clearTimeout(timeoutId);
                abrirWidgetFallback();
            });
        }

        function abrirWidgetFallback(){
            widgetFallbackAtivo=true;
            document.getElementById('widget-fallback').classList.add('show');
            atualizarBotaoWidget(true);
            if(ultimosDados)atualizarWidget(ultimosDados);
        }

        function fecharWidget(){
            if(pipWindow){try{pipWindow.close()}catch(e){}pipWindow=null}
            widgetFallbackAtivo=false;
            var fb=document.getElementById('widget-fallback');
            fb.classList.remove('show');fb.innerHTML=''; // limpa pra reconstruir do zero no próximo modo
            atualizarBotaoWidget(false);
        }

        function atualizarBotaoWidget(ativo){
            var btn=document.getElementById('btn-widget');if(!btn)return;
            if(ativo)btn.classList.add('widget-on');else btn.classList.remove('widget-on');
        }

        function fmtOuTraco(v,casas){return v!==null?v.toFixed(casas==null?1:casas):'—'}

        // Histórico auxiliar só pra calcular tendência de Saúde/Alarmes no ticker (os demais itens já
        // usam o array 'historico' que o resto do app mantém por tag).
        var tickerAuxHist={saude:[],alarme:[]};
        function pushAux(chave,valor){var h=tickerAuxHist[chave];h.push(valor);if(h.length>5)h.shift()}
        function tendenciaDe(valores){
            if(!valores||valores.length<2)return{seta:'',cls:'trend-stable'};
            var d=valores[valores.length-1]-valores[valores.length-2];
            if(d>0.2)return{seta:'▲',cls:'trend-up'};
            if(d<-0.2)return{seta:'▼',cls:'trend-down'};
            return{seta:'─',cls:'trend-stable'};
        }

        // Monta a lista de itens do ticker a partir das mesmas stats usadas na Visão Geral.
        // Só texto + seta de tendência, sem emojis.
        function itensTicker(data){
            var s=calcOverviewStats(data),f=s.fisico;
            pushAux('saude',s.pctOk);pushAux('alarme',s.emAlarme);
            function item(label,valTxt,alarmFlag,hist){
                var t=tendenciaDe(hist);
                return{label:label,val:valTxt,alarm:alarmFlag,seta:t.seta,setaCls:t.cls};
            }
            return[
                item('Saúde',s.pctOk+'%',false,tickerAuxHist.saude),
                item('Alarmes',String(s.emAlarme),s.emAlarme>0,tickerAuxHist.alarme),
                item('Água 6°C',fmtOuTraco(f.agua.val)+'°C',f.agua.alarm,historico['Agua_6C']),
                item('Ar DM',fmtOuTraco(f.arDM.val)+' bar',f.arDM.alarm,historico['Ar_Comp_DM']),
                item('Ar Choco',fmtOuTraco(f.arChoco.val)+' bar',f.arChoco.alarm,historico['Ar_Comp_Choco']),
                item('Vapor B&G',fmtOuTraco(f.vaporBG.val)+' bar',f.vaporBG.alarm,historico['Pressao_Cavalete_BG']),
                item('Vapor Choco',fmtOuTraco(f.vaporChoco.val)+' bar',f.vaporChoco.alarm,historico['Pressao_Vapor_Choco']),
                item('Vácuo',fmtOuTraco(f.vacuo.val)+' PolHg',f.vacuo.alarm,historico['Vacuo_Dry_Mix']),
                item('Atualizado',data._readAt||'—',false,null)
            ];
        }

        function tickerItemsHTML(itens){
            return itens.map(function(it){
                var seta=it.seta?' <span class="'+it.setaCls+'">'+it.seta+'</span>':'';
                return '<span class="ticker-item'+(it.alarm?' alarm':'')+'"><span class="tlabel">'+it.label+'</span>'+it.val+seta+'</span><span class="ticker-sep">•</span>';
            }).join('');
        }

        // Monta os botões de ação (▦/↺ trocar modo, ✕ fechar) como elementos DOM de verdade, com
        // addEventListener em vez de atributo onclick="...". Isso importa especificamente pra janela
        // PIP real: ela é um documento/contexto JS separado da página principal, então um onclick="..."
        // inline tentaria resolver a função dentro do escopo global da PRÓPRIA janela PIP (onde ela não
        // existe) e falharia silenciosamente. addEventListener aqui usa o closure do script principal
        // (onde essas funções realmente vivem), então funciona nos dois documentos.
        function montarAcoesWidget(doc,mostrarFechar){
            var wrap=doc.createElement('div');
            wrap.className='widget-tabela-actions';
            var modoBtn=doc.createElement('button');
            modoBtn.className='widget-modo';
            modoBtn.title=widgetModo==='tabela'?'Modo ticker':'Modo tabela';
            modoBtn.textContent=widgetModo==='tabela'?'↺':'▦';
            modoBtn.addEventListener('click',function(){alternarModoWidget()});
            wrap.appendChild(modoBtn);
            if(mostrarFechar){
                var fecharBtn=doc.createElement('button');
                fecharBtn.className='widget-close';
                fecharBtn.title='Fechar widget';
                fecharBtn.textContent='✕';
                fecharBtn.addEventListener('click',function(){toggleWidget()});
                wrap.appendChild(fecharBtn);
            }
            return wrap;
        }

        // Renderiza a faixa "ticker" dentro do container informado (documento principal ou da janela PIP).
        // Importante: o elemento animado (.widget-ticker-track) é criado UMA VEZ e reaproveitado nas
        // atualizações seguintes — só o innerHTML dele é trocado. Se recriássemos o elemento a cada
        // atualização (como innerHTML do container inteiro fazia antes), a animação CSS reiniciava do
        // zero a cada tick e a rolagem nunca chegava no fim.
        function renderTicker(container,data,mostrarFechar){
            if(!container)return;
            var track=container.querySelector('.widget-ticker-track');
            if(!track){
                var doc=container.ownerDocument;
                var bar=doc.createElement('div');bar.className='widget-ticker-bar';
                var viewport=doc.createElement('div');viewport.className='widget-ticker-viewport';
                track=doc.createElement('div');track.className='widget-ticker-track';
                viewport.appendChild(track);
                bar.appendChild(viewport);
                bar.appendChild(montarAcoesWidget(doc,mostrarFechar));
                container.innerHTML='';
                container.appendChild(bar);
            }
            var itemsHTML=tickerItemsHTML(itensTicker(data));
            track.innerHTML=itemsHTML+itemsHTML;
        }

        // Monta as linhas da tabela agrupadas por aba: Temperaturas, Ar Comprimido, Salas de Cura,
        // Vapor/Água (todas vindas de tagConfig) e Energia (vindas de energiaConfig.medicoes).
        var GRUPOS_TABELA_WIDGET=[['temp','Temperaturas'],['ar','Ar Comprimido'],['cura','Salas de Cura'],['vapor','Vapor/Água']];
        function linhaTabelaHTML(nome,val,unidade,alarme,casas){
            return '<div class="wt-linha'+(alarme?' alarm':'')+'"><span class="wt-nome">'+nome+'</span><span class="wt-valor">'+(val!==null?val.toFixed(casas||1):'—')+(unidade?' '+unidade:'')+'</span></div>';
        }
        function linhasTabelaWidget(data){
            var html='';
            GRUPOS_TABELA_WIDGET.forEach(function(g){
                var chave=g[0],titulo=g[1];
                var tags=Object.keys(tagConfig).filter(function(t){return tagConfig[t].grupo===chave});
                if(!tags.length)return;
                html+='<div class="wt-secao">'+titulo+'</div>';
                tags.forEach(function(t){
                    var cfg=tagConfig[t],val=getVal(data,t);
                    var alarm=val!==null&&getAlarmInfo(t,val).tipo!=='none';
                    html+=linhaTabelaHTML(cfg.nome,val,cfg.u,alarm);
                });
            });
            html+='<div class="wt-secao">Energia</div>';
            energiaConfig.medicoes.forEach(function(m){
                var val=getVal(data,m.id);
                var alarm=val!==null&&getAlarmInfo(m.id,val).tipo!=='none';
                html+=linhaTabelaHTML(m.nome,val,m.u,alarm,m.id==='FP_Geral'?3:1);
            });
            return html;
        }

        // Preserva a posição de rolagem entre atualizações — sem isso, a lista voltaria pro topo a
        // cada tick de dados (mesmo problema de fundo do "reinício" do ticker, versão lista).
        function renderTabelaMode(container,data,mostrarFechar){
            if(!container)return;
            var doc=container.ownerDocument;
            var scrollAnterior=container.querySelector('.widget-tabela-scroll');
            var scrollTop=scrollAnterior?scrollAnterior.scrollTop:0;

            var bar=doc.createElement('div');bar.className='widget-tabela-bar';
            var header=doc.createElement('div');header.className='widget-tabela-header';
            var titulo=doc.createElement('span');titulo.textContent='Utilidades';
            header.appendChild(titulo);
            header.appendChild(montarAcoesWidget(doc,mostrarFechar));
            var scroll=doc.createElement('div');scroll.className='widget-tabela-scroll';
            scroll.innerHTML=linhasTabelaWidget(data);
            bar.appendChild(header);bar.appendChild(scroll);

            container.innerHTML='';
            container.appendChild(bar);
            scroll.scrollTop=scrollTop;
        }

        function renderWidgetConteudo(container,data,mostrarFechar){
            if(widgetModo==='tabela')renderTabelaMode(container,data,mostrarFechar);
            else renderTicker(container,data,mostrarFechar);
        }

        function atualizarWidget(data){
            if(pipWindow)renderWidgetConteudo(pipWindow.document.body,data,false);
            if(widgetFallbackAtivo)renderWidgetConteudo(document.getElementById('widget-fallback'),data,true);
        }

        // ===== CSV =====
        window.exportarCSV=function(){
            if(!ultimosDados)return;var csv='Tag,Valor,Unidade,Timestamp\n';
            var keys=Object.keys(ultimosDados);
            for(var i=0;i<keys.length;i++){if(keys[i].startsWith('_'))continue;
                var v=ultimosDados[keys[i]];var val=(typeof v==='object'&&'v' in v)?v.v:v;var u=(typeof v==='object'&&'u' in v)?v.u:'';
                csv+=keys[i]+','+val+','+u+','+(ultimosDados._readAt||'')+'\n'}
            var blob=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='utilidades_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
        };

        // ===== LOGOUT =====
        window.logout=function(){localStorage.removeItem('modo_acesso');localStorage.removeItem('login_timestamp');firebase.auth().signOut().then(function(){window.location.href='index.html'})};

        // ===== SW + REFRESH =====
        if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
        setInterval(function(){if(tabAtual!=='overview'&&tabAtual!=='alarmes'&&tabAtual!=='energia')redesenharSparklines()},5000);
    })();
    </script>
</body>
