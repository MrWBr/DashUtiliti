
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: #1a1a2e;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header h1 { font-size: 1.1em; color: #4fc3f7; }
        .header .connection {
            font-size: 0.8em;
            padding: 4px 10px;
            border-radius: 12px;
            background: #1b5e20;
            color: #a5d6a7;
        }
        .header .connection.offline { background: #b71c1c; color: #ef9a9a; }
        .header button {
            background: #333;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .tabs {
            display: flex;
            background: #16213e;
            border-bottom: 1px solid #333;
        }
        .tabs button {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.9em;
            border-bottom: 2px solid transparent;
        }
        .tabs button.active {
            color: #4fc3f7;
            border-bottom-color: #4fc3f7;
        }
        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; }

        /* Cards de valores */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 12px;
            border-left: 3px solid #4fc3f7;
        }
        .card .label {
            font-size: 0.7em;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .card .value {
            font-size: 1.4em;
            font-weight: bold;
            color: #fff;
        }
        .card .unit {
            font-size: 0.7em;
            color: #666;
        }
        .card.alarm { border-left-color: #ef5350; }
        .card.alarm .value { color: #ef5350; }
        .card.warning { border-left-color: #ffa726; }
        .card.warning .value { color: #ffa726; }

        /* Gráficos */
        .chart-container {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .chart-container h3 {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 10px;
        }
        .chart-canvas {
            width: 100%;
            height: 200px;
        }

        /* Tabela de log */
        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8em;
        }
        .log-table th {
            background: #16213e;
            padding: 8px;
            text-align: left;
            color: #4fc3f7;
            position: sticky;
            top: 0;
        }
        .log-table td {
            padding: 6px 8px;
            border-bottom: 1px solid #222;
        }
        .log-table tr:hover { background: #1a1a2e; }

        .last-update {
            text-align: center;
            font-size: 0.75em;
            color: #666;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏭 Industrial Bridge</h1>
        <span class="connection" id="conn-status">● Conectado</span>
        <button onclick="logout()">Sair</button>
    </div>

    <div class="tabs">
        <button class="active" onclick="showTab('realtime')">⚡ Tempo Real</button>
        <button onclick="showTab('trends')">📈 Tendências</button>
        <button onclick="showTab('log')">📋 Log</button>
    </div>

    <!-- ABA: Tempo Real -->
    <div class="tab-content active" id="tab-realtime">
        <div class="cards-grid" id="cards-container"></div>
        <div class="last-update" id="last-update">Aguardando dados...</div>
    </div>

    <!-- ABA: Tendências -->
    <div class="tab-content" id="tab-trends">
        <div id="charts-container"></div>
    </div>

    <!-- ABA: Log -->
    <div class="tab-content" id="tab-log">
        <table class="log-table">
            <thead>
                <tr>
                    <th>Horário</th>
                    <th>Variáveis</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="log-body"></tbody>
        </table>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- Chart.js para gráficos leves -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script>
        // ⚠️ SUBSTITUA com suas credenciais do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBLx0ECcSQdS8uKnaXzDIuygK7Hi3JTcuU",
            authDomain: "dshutili.firebaseapp.com",
            databaseURL: "https://dshutili-default-rtdb.firebaseio.com",
            projectId: "dshutili",
          storageBucket: "dshutili.firebasestorage.app",
            messagingSenderId: "1065134772507",
            appId: "1:1065134772507:web:aed91d6d1953f69cb403be",
            measurementId: "G-B3NS6YKTLV"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Verificar autenticação
        firebase.auth().onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                initDashboard();
            }
        });

        // ============ CONFIGURAÇÃO DAS VARIÁVEIS ============
        // Defina aqui os limites de alarme/warning para cada variável
        const varConfig = {
            // Exemplo - ajuste conforme suas variáveis reais:
            // "temp_caldeira": { unit: "°C", min: 0, max: 200, warning: 160, alarm: 180 },
            // "pressao_vapor": { unit: "bar", min: 0, max: 15, warning: 10, alarm: 12 },
            // "vazao_agua": { unit: "m³/h", min: 0, max: 50, warning: 40, alarm: 45 },
        };

        // Histórico local para gráficos de tendência
        const trendData = {};
        const MAX_TREND_POINTS = 200;  // ~16 min com leitura a cada 5s
        let charts = {};

        function initDashboard() {
            // Escutar dados em tempo real
            db.ref('current').on('value', snapshot => {
                const data = snapshot.val();
                if (!data) return;
                
                updateCards(data);
                updateTrends(data);
                updateConnectionStatus(true);
                
                document.getElementById('last-update').textContent = 
                    'Última atualização: ' + (data._readAt || new Date().toLocaleString('pt-BR'));
            });

            // Detectar desconexão
            db.ref('.info/connected').on('value', snap => {
                updateConnectionStatus(snap.val());
            });

            // Carregar histórico inicial
            db.ref('history').limitToLast(50).once('value', snapshot => {
                snapshot.forEach(child => {
                    const data = child.val();
                    addToLog(data);
                });
            });

            // Escutar novas entradas no log
            db.ref('history').limitToLast(1).on('child_added', snapshot => {
                addToLog(snapshot.val());
            });
        }

        function updateCards(data) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            Object.keys(data).forEach(key => {
                if (key.startsWith('_')) return;

                const value = data[key];
                const config = varConfig[key] || {};
                let cardClass = 'card';
                
                if (config.alarm && value >= config.alarm) cardClass += ' alarm';
                else if (config.warning && value >= config.warning) cardClass += ' warning';

                const card = document.createElement('div');
                card.className = cardClass;
                card.innerHTML = `
                    <div class="label">${formatLabel(key)}</div>
                    <div class="value">${typeof value === 'number' ? value.toFixed(1) : value}</div>
                    <div class="unit">${config.unit || ''}</div>
                `;
                container.appendChild(card);
            });
        }

        function updateTrends(data) {
            const now = Date.now();
            
            Object.keys(data).forEach(key => {
                if (key.startsWith('_')) return;
                if (typeof data[key] !== 'number') return;

                if (!trendData[key]) trendData[key] = [];
                trendData[key].push({ time: now, value: data[key] });
                
                if (trendData[key].length > MAX_TREND_POINTS) {
                    trendData[key].shift();
                }
            });

            renderCharts();
        }

        function renderCharts() {
            const container = document.getElementById('charts-container');
            
            Object.keys(trendData).forEach(key => {
                let chartDiv = document.getElementById('chart-' + key);
                
                if (!chartDiv) {
                    chartDiv = document.createElement('div');
                    chartDiv.className = 'chart-container';
                    chartDiv.id = 'chart-' + key;
                    chartDiv.innerHTML = `
                        <h3>${formatLabel(key)} ${varConfig[key]?.unit ? '(' + varConfig[key].unit + ')' : ''}</h3>
                        <canvas id="canvas-${key}" class="chart-canvas"></canvas>
                    `;
                    container.appendChild(chartDiv);
                }

                const canvas = document.getElementById('canvas-' + key);
                const ctx = canvas.getContext('2d');
                const points = trendData[key];

                if (charts[key]) {
                    charts[key].data.labels = points.map(p => 
                        new Date(p.time).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'})
                    );
                    charts[key].data.datasets[0].data = points.map(p => p.value);
                    charts[key].update('none');
                } else {
                    charts[key] = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: points.map(p => 
                                new Date(p.time).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'})
                            ),
                            datasets: [{
                                label: formatLabel(key),
                                data: points.map(p => p.value),
                                borderColor: '#4fc3f7',
                                backgroundColor: 'rgba(79, 195, 247, 0.1)',
                                borderWidth: 1.5,
                                pointRadius: 0,
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: {
                                    display: true,
                                    ticks: { color: '#666', maxTicksLimit: 6, font: { size: 10 } },
                                    grid: { color: '#222' }
                                },
                                y: {
                                    display: true,
                                    ticks: { color: '#666', font: { size: 10 } },
                                    grid: { color: '#222' }
                                }
                            }
                        }
                    });
                }
            });
        }

        function addToLog(data) {
            if (!data) return;
            const tbody = document.getElementById('log-body');
            const row = document.createElement('tr');
            const varCount = Object.keys(data).filter(k => !k.startsWith('_')).length;
            
            row.innerHTML = `
                <td>${data._readAt || '-'}</td>
                <td>${varCount} vars</td>
                <td style="color: #a5d6a7;">✓ OK</td>
            `;
            tbody.insertBefore(row, tbody.firstChild);
            
            while (tbody.children.length > 100) {
                tbody.removeChild(tbody.lastChild);
            }
        }

        function updateConnectionStatus(connected) {
            const el = document.getElementById('conn-status');
            if (connected) {
                el.textContent = '● Conectado';
                el.className = 'connection';
            } else {
                el.textContent = '● Offline';
                el.className = 'connection offline';
            }
        }

        function formatLabel(key) {
            return key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'trends') {
                setTimeout(() => {
                    Object.values(charts).forEach(c => c.resize());
                }, 100);
            }
        }

        function logout() {
            firebase.auth().signOut().then(() => {
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
