
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilidades - Mondelēz</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#7c3aed">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --bg1: #0d1117;
            --bg2: #161b22;
            --bg3: rgba(255,255,255,0.03);
            --bg-card: rgba(255,255,255,0.05);
            --bg-card-hover: rgba(255,255,255,0.08);
            --glass: rgba(255,255,255,0.02);
            --glass-border: rgba(255,255,255,0.08);
            --t1: #ffffff;
            --t2: #8b949e;
            --t3: #484f58;
            --accent: #7c3aed;
            --accent2: #06b6d4;
            --gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --gradient-soft: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(6,182,212,0.15));
            --gradient-fill: linear-gradient(180deg, rgba(124,58,237,0.3), rgba(6,182,212,0.05));
            --red: #ef4444;
            --orange: #f97316;
            --green: #22c55e;
            --blue: #3b82f6;
            --yellow: #eab308;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --radius: 16px;
            --radius-sm: 10px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; background: var(--bg1); color: var(--t1); min-height:100vh; overflow-x:hidden; }

        /* === HEADER === */
        .header { background: var(--bg2); padding: 16px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--glass-border); position:sticky; top:0; z-index:100; backdrop-filter: blur(20px); }
        .header-left { display:flex; align-items:center; gap:12px; }
        .header-logo { width:32px; height:32px; border-radius:8px; background: var(--gradient); display:flex; align-items:center; justify-content:center; font-size:16px; }
        .header h1 { font-size: 1em; font-weight: 600; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header-right { display:flex; align-items:center; gap:10px; }
        .status-badge { font-size:.7em; padding:4px 10px; border-radius:20px; background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
        .status-badge.offline { background: rgba(239,68,68,0.15); color: var(--red); border-color: rgba(239,68,68,0.3); }
        .btn-icon { background: var(--bg-card); border: 1px solid var(--glass-border); color: var(--t2); width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; transition: all .2s; }
        .btn-icon:hover { background: var(--bg-card-hover); color: var(--t1); }

        /* === TABS === */
        .tabs { display:flex; gap:4px; padding:12px 16px; background: var(--bg2); border-bottom: 1px solid var(--glass-border); overflow-x:auto; -webkit-overflow-scrolling:touch; }
        .tabs::-webkit-scrollbar { display:none; }
        .tab { padding:8px 16px; border-radius:10px; font-size:.75em; font-weight:500; color: var(--t2); background: transparent; border: none; cursor:pointer; white-space:nowrap; transition: all .2s; }
        .tab:hover { color: var(--t1); background: var(--bg-card); }
        .tab.active { background: var(--gradient); color: #fff; font-weight:600; }

        /* === LEITOR STATUS === */
        .leitor-bar { display:flex; align-items:center; justify-content:space-between; padding:10px 20px; background: var(--glass); border-bottom: 1px solid var(--glass-border); }
        .leitor-left { display:flex; align-items:center; gap:10px; font-size:.75em; }
        .leitor-dot { width:8px; height:8px; border-radius:50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
        .leitor-dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); animation:none; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(.85)} }
        .leitor-right { display:flex; gap:16px; font-size:.7em; color: var(--t2); }
        .leitor-right .val { color: var(--accent2); font-weight:600; }
        .last-update { text-align:center; font-size:.68em; color: var(--t3); padding:6px 20px; background: var(--bg2); }

        /* === OVERVIEW CARDS (Visão Geral) === */
        .overview-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:12px; padding:16px; }
        .overview-card { background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius); padding:16px; position:relative; overflow:hidden; transition: all .3s; }
        .overview-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
        .overview-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background: var(--gradient); border-radius: var(--radius) var(--radius) 0 0; }
        .overview-label { font-size:.65em; color: var(--t2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
        .overview-value { font-size:1.8em; font-weight:700; background: var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .overview-sub { font-size:.7em; color: var(--t3); margin-top:4px; }
        .overview-card .donut-container { position:absolute; top:12px; right:12px; width:44px; height:44px; }

        /* === DATA CARDS === */
        .section-container { padding:12px 16px; }
        .section-title { font-size:.7em; color: var(--accent); text-transform:uppercase; letter-spacing:1px; font-weight:600; margin-bottom:10px; padding-left:4px; }
        .cards-grid { display:flex; flex-direction:column; gap:8px; }
        .data-card { display:flex; align-items:center; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding:14px 16px; gap:14px; transition: all .3s; cursor:pointer; position:relative; overflow:hidden; }
        .data-card:hover { background: var(--bg-card-hover); transform: translateX(4px); }
        .data-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background: var(--gradient); }
        .data-card.alarm-red::before { background: var(--red); }
        .data-card.alarm-red { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
        .data-card.alarm-red .card-value { color: var(--red); }
        .data-card.alarm-blue::before { background: var(--blue); }
        .data-card.alarm-blue { border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.05); }
        .data-card.alarm-blue .card-value { color: var(--blue); }
        .data-card.alarm-orange::before { background: var(--orange); }
        .data-card.alarm-orange { border-color: rgba(249,115,22,0.3); background: rgba(249,115,22,0.05); }
        .data-card.alarm-orange .card-value { color: var(--orange); }
        .card-info { flex-shrink:0; min-width:fit-content; }
        .card-name { font-size:.7em; color: var(--t2); text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; }
        .card-value { font-size:1.5em; font-weight:700; color: var(--t1); margin-top:2px; }
        .card-value .unit { font-size:.5em; color: var(--t3); font-weight:400; margin-left:3px; }
        .card-spark { flex:1; min-width:60px; height:50px; position:relative; }
        .card-spark canvas { width:100%; height:100%; display:block; }
        .card-trend { font-size:1.1em; width:24px; text-align:center; flex-shrink:0; }
        .trend-up { color: var(--red); }
        .trend-down { color: var(--green); }
        .trend-stable { color: var(--t3); }

        /* === ENERGIA TAB === */
        .energia-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:12px; padding:16px; }
        .trafo-card { background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius); padding:18px; position:relative; overflow:hidden; }
        .trafo-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background: var(--gradient); }
        .trafo-card.offline::before { background: var(--red); }
        .trafo-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
        .trafo-nome { font-size:.85em; font-weight:600; color: var(--t1); }
        .trafo-status { font-size:.65em; padding:3px 8px; border-radius:12px; }
        .trafo-status.online { background: rgba(34,197,94,0.15); color: var(--green); }
        .trafo-status.offline { background: rgba(239,68,68,0.15); color: var(--red); }
        .trafo-status.alerta { background: rgba(249,115,22,0.15); color: var(--orange); }
        .trafo-body { display:flex; gap:16px; align-items:center; }
        .trafo-donut { width:80px; height:80px; position:relative; flex-shrink:0; }
        .trafo-donut canvas { width:100%; height:100%; }
        .trafo-donut-label { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
        .trafo-donut-value { font-size:1.1em; font-weight:700; color: var(--t1); }
        .trafo-donut-sub { font-size:.55em; color: var(--t3); }
        .trafo-metrics { flex:1; display:flex; flex-direction:column; gap:6px; }
        .trafo-metric { display:flex; justify-content:space-between; align-items:center; font-size:.72em; }
        .trafo-metric-label { color: var(--t2); }
        .trafo-metric-value { color: var(--t1); font-weight:600; font-family:monospace; }
        .trafo-metric-value.alarm { color: var(--red); }

        /* === MODAL === */
        .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.9); z-index:200; align-items:center; justify-content:center; padding:15px; backdrop-filter:blur(8px); }
        .modal-overlay.show { display:flex; }
        .modal { background: var(--bg2); border-radius: var(--radius); width:100%; max-width:700px; max-height:90vh; overflow-y:auto; padding:24px; position:relative; border: 1px solid var(--glass-border); box-shadow: var(--shadow); }
        .modal-close { position:absolute; top:12px; right:16px; background:none; border:none; color: var(--t2); font-size:1.5em; cursor:pointer; }
        .modal h2 { background: var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; font-size:1.1em; margin-bottom:5px; }
        .modal-valor { font-size:2.2em; font-weight:700; margin-bottom:12px; }
        .modal-periodo { display:flex; gap:8px; margin-bottom:16px; }
        .modal-periodo button { background: var(--bg-card); color: var(--accent2); border: 1px solid var(--glass-border); padding:6px 14px; border-radius:8px; font-size:.75em; cursor:pointer; transition: all .2s; }
        .modal-periodo button.active { background: var(--gradient); color:#fff; border-color:transparent; }
        .modal canvas { width:100%; height:250px; display:block; border-radius: var(--radius-sm); background: var(--bg-card); }
        .modal-stats { display:flex; justify-content:space-around; margin-top:14px; font-size:.8em; color: var(--t2); }
        .modal-stats .stat-val { font-weight:700; color: var(--t1); font-size:1.2em; }

        /* === TOOLBAR === */
        .toolbar { display:flex; gap:6px; padding:8px 16px; background: var(--bg2); border-bottom: 1px solid var(--glass-border); }
        .toolbar button { background: var(--bg-card); color: var(--t2); border: 1px solid var(--glass-border); padding:6px 12px; border-radius:8px; font-size:.7em; cursor:pointer; transition: all .2s; }
        .toolbar button:hover { color: var(--t1); background: var(--bg-card-hover); }
        .toolbar button.active { background: var(--gradient); color:#fff; border-color:transparent; }

        /* === ALARMES === */
        .alarmes-section { display:none; padding:16px; }
        .alarme-item { display:flex; align-items:center; gap:10px; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding:10px 14px; font-size:.75em; margin-bottom:6px; border-left:3px solid var(--t3); }
        .alarme-item.tipo-limite { border-left-color: var(--red); }
        .alarme-item.tipo-taxa { border-left-color: var(--orange); }
        .alarme-item.tipo-tempo_faixa { border-left-color: var(--blue); }
        .alarme-item.tipo-saida { border-left-color: var(--green); }

        /* === RESPONSIVE === */
        @media (max-width: 480px) {
            .overview-grid { grid-template-columns: repeat(2, 1fr); gap:8px; }
            .energia-grid { grid-template-columns: 1fr; }
            .card-value { font-size:1.3em; }
            .overview-value { font-size:1.5em; }
        }

        /* === SCROLLBAR === */
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background: var(--bg1); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius:4px; }
    </style>
</head>

                <div class="cards-grid" id="cards-cura"></div>
            </div>
        </div>

        <!-- Vapor/Água -->
        <div id="tab-vapor" class="tab-content" style="display:none">
            <div class="section-container">
                <div class="cards-grid" id="cards-vapor"></div>
            </div>
        </div>

        <!-- Energia Elétrica -->
        <div id="tab-energia" class="tab-content" style="display:none">
            <div class="section-container">
                <div class="section-title">⚡ Subestações & Transformadores</div>
                <div class="overview-grid" id="energia-resumo"></div>
            </div>
            <div class="energia-grid" id="energia-trafos"></div>
            <div class="section-container">
                <div class="section-title">📊 Medições Gerais</div>
                <div class="cards-grid" id="cards-energia"></div>
            </div>
        </div>

        <!-- Alarmes -->
        <div id="tab-alarmes" class="tab-content" style="display:none">
            <div class="alarmes-section" style="display:block">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">

                    <div style="display:flex;gap:6px" id="alarme-filtros"></div>

                <div class="overview-grid" id="alarme-resumo" style="margin-bottom:12px"></div>
                <div id="alarmes-lista"></div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)this.classList.remove('show')">
        <div class="modal">
            <button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('show')">✕</button>
            <h2 id="modal-titulo">—</h2>
            <div class="modal-valor" id="modal-valor">—</div>
            <div class="modal-periodo">
                <button class="active" onclick="mudarPeriodo('1h',this)">1h</button>
                <button onclick="mudarPeriodo('6h',this)">6h</button>
                <button onclick="mudarPeriodo('24h',this)">24h</button>
                <button onclick="mudarPeriodo('7d',this)">7d</button>

            <div class="modal-stats">

                <div><div class="stat-val" id="stat-pts">—</div>Pontos</div>
            </div>
        </div>
    </div>

        // ===== GAUGE (CORTA-GIRO) =====
        function desenharGauge(canvasId,valor,maximo,tipo){
            var canvas=document.getElementById(canvasId);if(!canvas)return;
            var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;
            var cx=w/2,cy=h*0.55,r=w*0.38,lw=w*0.12;
            ctx.clearRect(0,0,w,h);
            var startAngle=0.75*Math.PI,endAngle=2.25*Math.PI,totalAngle=1.5*Math.PI;
            ctx.beginPath();ctx.arc(cx,cy,r,startAngle,endAngle);ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
            var pct=maximo>0?(valor/maximo):0;pct=Math.max(0,Math.min(1,pct));
            var valueAngle=startAngle+(pct*totalAngle);
            var grad=ctx.createLinearGradient(0,0,w,h);
            if(tipo==='alarme'){
                var pctA=maximo>0?((maximo-valor)/maximo):0;valueAngle=startAngle+(pctA*totalAngle);
                grad.addColorStop(0,'#22c55e');grad.addColorStop(0.5,'#eab308');grad.addColorStop(1,'#ef4444');
            }else{grad.addColorStop(0,'#ef4444');grad.addColorStop(0.5,'#eab308');grad.addColorStop(1,'#22c55e')}
            if(pct>0||tipo==='alarme'){ctx.beginPath();ctx.arc(cx,cy,r,startAngle,valueAngle);ctx.strokeStyle=grad;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke()}
            var nx=cx+Math.cos(valueAngle)*r,ny=cy+Math.sin(valueAngle)*r;
            ctx.beginPath();ctx.arc(nx,ny,lw*0.4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
            ctx.beginPath();ctx.arc(cx,cy,lw*0.3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fill();
        }

        // ===== DONUT =====
        function desenharDonut(trafoId,pct){
            var canvas=document.getElementById('donut-'+trafoId);if(!canvas)return;
            var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;
            var cx=w/2,cy=h/2,r=60,lw=12;
            ctx.clearRect(0,0,w,h);
            ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=lw;ctx.stroke();
            var angle=(pct/100)*Math.PI*2,startA=-Math.PI/2;
            var grad=ctx.createLinearGradient(0,0,w,h);
            if(pct>85){grad.addColorStop(0,'#ef4444');grad.addColorStop(1,'#f97316')}

            else{grad.addColorStop(0,'#7c3aed');grad.addColorStop(1,'#06b6d4')}
            ctx.beginPath();ctx.arc(cx,cy,r,startA,startA+angle);ctx.strokeStyle=grad;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
        }

        // ===== DATA CARD =====
        function criarDataCard(tagId,valor,cfg){
            if(!cfg)cfg={nome:tagId,u:'',limiteAlto:null,limiteBaixo:null};
            var alarm=getAlarmInfo(tagId,valor);
            var hist=historico[tagId]||[];
            var tendencia='',tClass='trend-stable';
            if(hist.length>=2){var d=hist[hist.length-1]-hist[hist.length-2];
                if(d>0.2){tendencia='▲';tClass='trend-up'}else if(d<-0.2){tendencia='▼';tClass='trend-down'}else{tendencia='─';tClass='trend-stable'}}
            var alarmClass='';
            if(alarm.cor==='red')alarmClass=' alarm-red';
            else if(alarm.cor==='blue')alarmClass=' alarm-blue';
            else if(alarm.cor==='orange')alarmClass=' alarm-orange';
            var card=document.createElement('div');card.className='data-card'+alarmClass;

                +'<div class="card-spark"><canvas data-tag="'+tagId+'" data-alarm="'+(alarm.cor||'none')+'"></canvas></div>'
                +'<div class="card-trend '+tClass+'">'+tendencia+'</div>';

        }

        // ===== SPARKLINES =====
        function redesenharSparklines(){
            document.querySelectorAll('.card-spark canvas').forEach(function(canvas){
                var tagId=canvas.getAttribute('data-tag'),alarmCor=canvas.getAttribute('data-alarm');
                var hist=historico[tagId]||[],cfg=tagConfig[tagId]||{};
                var rect=canvas.parentElement.getBoundingClientRect();
                canvas.width=Math.floor(rect.width*2);canvas.height=Math.floor(rect.height*2);
                if(hist.length>=2)desenharSparkline(canvas,hist,alarmCor,cfg);
            });
        }
        window.addEventListener('resize',function(){setTimeout(redesenharSparklines,100)});

        function desenharSparkline(canvas,valores,alarmCor,cfg){
            var ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,p=6;
            ctx.clearRect(0,0,w,h);if(valores.length<2)return;
            var min,max;
            if(cfg.escalaMin!=null&&cfg.escalaMax!=null){min=cfg.escalaMin;max=cfg.escalaMax}
            else{min=Math.min.apply(null,valores);max=Math.max.apply(null,valores);var mg=(max-min)*0.2||1;min-=mg;max+=mg}
            var range=max-min||1;
            function vY(val){var c=Math.max(min,Math.min(max,val));return h-p-((c-min)/range)*(h-p*2)}
            if(cfg.limiteAlto!=null){ctx.strokeStyle='rgba(239,68,68,0.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,vY(cfg.limiteAlto));ctx.lineTo(w,vY(cfg.limiteAlto));ctx.stroke();ctx.setLineDash([])}
            if(cfg.limiteBaixo!=null){ctx.strokeStyle='rgba(59,130,246,0.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,vY(cfg.limiteBaixo));ctx.lineTo(w,vY(cfg.limiteBaixo));ctx.stroke();ctx.setLineDash([])}
            var cL='#7c3aed',cF='rgba(124,58,237,0.15)';
            if(alarmCor==='red'){cL='#ef4444';cF='rgba(239,68,68,0.15)'}
            else if(alarmCor==='blue'){cL='#3b82f6';cF='rgba(59,130,246,0.15)'}
            else if(alarmCor==='orange'){cL='#f97316';cF='rgba(249,115,22,0.15)'}
            ctx.beginPath();for(var i=0;i<valores.length;i++){var x=(i/(valores.length-1))*w,y=vY(valores[i]);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
            ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fillStyle=cF;ctx.fill();
            ctx.beginPath();for(var j=0;j<valores.length;j++){var px=(j/(valores.length-1))*w,py=vY(valores[j]);if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}
            ctx.strokeStyle=cL;ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
            ctx.beginPath();ctx.arc(w-2,vY(valores[valores.length-1]),4,0,Math.PI*2);ctx.fillStyle=cL;ctx.fill();
        }

        };
        function carregarHistoricoModal(tagId,periodo){
            var ms={'1h':3600000,'6h':21600000,'24h':86400000,'7d':604800000};
            var desde=Date.now()-(ms[periodo]||3600000);
            db.ref('history').orderByChild('_timestamp').startAt(desde).once('value').then(function(snap){
                var dados=snap.val(),pontos=[];
                if(dados){Object.keys(dados).forEach(function(k){var e=dados[k];
                    if(e&&e[tagId]!==undefined){var val=(typeof e[tagId]==='object'&&'v' in e[tagId])?e[tagId].v:(typeof e[tagId]==='number'?e[tagId]:null);
                        if(val!==null)pontos.push({t:e._timestamp||0,v:val})}})}
                pontos.sort(function(a,b){return a.t-b.t});desenharGraficoModal(pontos,tagId);
            }).catch(function(){var hist=historico[tagId]||[],pontos=[];
                for(var i=0;i<hist.length;i++)pontos.push({t:Date.now()-(hist.length-i)*30000,v:hist[i]});desenharGraficoModal(pontos,tagId)});
        }
        function desenharGraficoModal(pontos,tagId){
            var canvas=document.getElementById('modal-canvas');var rect=canvas.getBoundingClientRect();
            canvas.width=Math.floor(rect.width*2);canvas.height=500;
            var ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,pad=40;
            ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(255,255,255,0.02)';ctx.fillRect(0,0,w,h);
            if(pontos.length<2){ctx.fillStyle='#484f58';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('Sem dados para este período',w/2,h/2);
                document.getElementById('stat-min').textContent='—';document.getElementById('stat-med').textContent='—';document.getElementById('stat-max').textContent='—';document.getElementById('stat-pts').textContent='0';return}
            var cfg=tagConfig[tagId]||{},valores=pontos.map(function(p){return p.v});
            var min,max;if(cfg.escalaMin!=null&&cfg.escalaMax!=null){min=cfg.escalaMin;max=cfg.escalaMax}
            else{min=Math.min.apply(null,valores);max=Math.max.apply(null,valores);var mg=(max-min)*0.15||1;min-=mg;max+=mg}
            var range=max-min||1;
            var vMin=Math.min.apply(null,valores),vMax=Math.max.apply(null,valores);
            var vMed=valores.reduce(function(a,b){return a+b},0)/valores.length;
            document.getElementById('stat-min').textContent=vMin.toFixed(1);
            document.getElementById('stat-med').textContent=vMed.toFixed(1);
            document.getElementById('stat-max').textContent=vMax.toFixed(1);
            document.getElementById('stat-pts').textContent=pontos.length.toString();
            function vY(val){var c=Math.max(min,Math.min(max,val));return h-pad-((c-min)/range)*(h-pad*2)}
            function tX(t){return pad+((t-pontos[0].t)/(pontos[pontos.length-1].t-pontos[0].t))*(w-pad*2)}
            // Grid
            ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
            for(var g=0;g<5;g++){var gy=pad+g*((h-pad*2)/4);ctx.beginPath();ctx.moveTo(pad,gy);ctx.lineTo(w-pad,gy);ctx.stroke();
                ctx.fillStyle='#484f58';ctx.font='18px monospace';ctx.textAlign='right';ctx.fillText((max-(g/4)*range).toFixed(1),pad-8,gy+5)}
            // Limites
            if(cfg.limiteAlto!=null){ctx.strokeStyle='rgba(239,68,68,0.5)';ctx.lineWidth=1;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(pad,vY(cfg.limiteAlto));ctx.lineTo(w-pad,vY(cfg.limiteAlto));ctx.stroke();ctx.setLineDash([])}
            if(cfg.limiteBaixo!=null){ctx.strokeStyle='rgba(59,130,246,0.5)';ctx.lineWidth=1;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(pad,vY(cfg.limiteBaixo));ctx.lineTo(w-pad,vY(cfg.limiteBaixo));ctx.stroke();ctx.setLineDash([])}
            // Cores
            var alarm=getAlarmInfo(tagId,pontos[pontos.length-1].v);
            var cL='#7c3aed',cF='rgba(124,58,237,0.15)';
            if(alarm.cor==='red'){cL='#ef4444';cF='rgba(239,68,68,0.1)'}
            else if(alarm.cor==='blue'){cL='#3b82f6';cF='rgba(59,130,246,0.1)'}
            // Fill
            ctx.beginPath();for(var i=0;i<pontos.length;i++){var x=tX(pontos[i].t),y=vY(pontos[i].v);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
            ctx.lineTo(tX(pontos[pontos.length-1].t),h-pad);ctx.lineTo(tX(pontos[0].t),h-pad);ctx.closePath();ctx.fillStyle=cF;ctx.fill();
            // Line
            ctx.beginPath();for(var j=0;j<pontos.length;j++){var px=tX(pontos[j].t),py=vY(pontos[j].v);if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}
            ctx.strokeStyle=cL;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
            // Last dot
            var lx=tX(pontos[pontos.length-1].t),ly=vY(pontos[pontos.length-1].v);
            ctx.beginPath();ctx.arc(lx,ly,6,0,Math.PI*2);ctx.fillStyle=cL;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
            // Time labels
            ctx.fillStyle='#484f58';ctx.font='16px monospace';ctx.textAlign='center';
            var nL=Math.min(6,pontos.length);
            for(var l=0;l<nL;l++){var idx=Math.floor(l*(pontos.length-1)/(nL-1));var lxx=tX(pontos[idx].t);
                var dt=new Date(pontos[idx].t);ctx.fillText(dt.getHours().toString().padStart(2,'0')+':'+dt.getMinutes().toString().padStart(2,'0'),lxx,h-8)}
        }

        // ===== ALARMES LOG =====
        function renderAlarmes(){
            var desde=Date.now()-(24*60*60*1000);
            db.ref('alarmes_log').orderByChild('timestamp').startAt(desde).once('value',function(snap){
                var lista=document.getElementById('alarmes-lista');lista.innerHTML='';
                var logs=[];snap.forEach(function(c){logs.push(c.val())});
                logs.sort(function(a,b){return b.timestamp-a.timestamp});
                var total=0,criticos=0,taxa=0,tempo=0,normalizados=0;
                for(var i=0;i<logs.length;i++){total++;var a=logs[i];
                    if(a.tipo==='limite')criticos++;else if(a.tipo==='taxa')taxa++;else if(a.tipo==='tempo_faixa')tempo++;else if(a.tipo==='saida')normalizados++}
                var resumo=document.getElementById('alarme-resumo');
                resumo.innerHTML='<div class="overview-card"><div class="overview-label">Total</div><div class="overview-value">'+total+'</div></div>'
                    +'<div class="overview-card"><div class="overview-label">Críticos</div><div class="overview-value" style="-webkit-text-fill-color:var(--red)">'+criticos+'</div></div>'
                    +'<div class="overview-card"><div class="overview-label">Taxa</div><div class="overview-value" style="-webkit-text-fill-color:var(--orange)">'+taxa+'</div></div>'
                    +'<div class="overview-card"><div class="overview-label">Tempo</div><div class="overview-value" style="-webkit-text-fill-color:var(--blue)">'+tempo+'</div></div>'
                    +'<div class="overview-card"><div class="overview-label">Normalizados</div><div class="overview-value" style="-webkit-text-fill-color:var(--green)">'+normalizados+'</div></div>';
                for(var j=0;j<Math.min(logs.length,50);j++){var l=logs[j];
                    var dt=new Date(l.timestamp);var hora=dt.getHours().toString().padStart(2,'0')+':'+dt.getMinutes().toString().padStart(2,'0');
                    var icone='🚨';if(l.tipo==='taxa')icone='📈';else if(l.tipo==='tempo_faixa')icone='⏱️';else if(l.tipo==='saida')icone='✅';
                    var div=document.createElement('div');div.className='alarme-item tipo-'+(l.tipo||'limite');
                    div.innerHTML='<span style="color:var(--t3);font-family:monospace;min-width:50px">'+hora+'</span><span style="font-size:1.2em">'+icone+'</span><span style="flex:1;color:var(--t1)">'+(l.mensagem||l.tagId)+'</span>';
                    lista.appendChild(div)}
                if(!logs.length)lista.innerHTML='<div style="text-align:center;color:var(--t3);padding:30px;font-size:.8em">✅ Nenhum alarme nas últimas 24h</div>';
            });
        }

        // ===== HELPERS =====
        function getVal(data,key){
            if(!data||!data[key])return null;
            if(typeof data[key]==='object'&&'v' in data[key])return data[key].v;
            if(typeof data[key]==='number')return data[key];return null;
        }
        function getAlarmInfo(tagId,valor){
            var cfg=tagConfig[tagId];if(!cfg)return{tipo:'none',cor:null};
            if(cfg.limiteAlto!=null&&valor>cfg.limiteAlto)return{tipo:'alto',cor:cfg.corAlto||'red'};
            if(cfg.limiteBaixo!=null&&valor<cfg.limiteBaixo)return{tipo:'baixo',cor:cfg.corBaixo||'blue'};
            return{tipo:'none',cor:null};
        }
        function atualizarHistorico(data){
            var keys=Object.keys(data);
            for(var i=0;i<keys.length;i++){if(keys[i].startsWith('_'))continue;
                var val=data[keys[i]],valor=null;
                if(val&&typeof val==='object'&&'v' in val)valor=val.v;else if(typeof val==='number')valor=val;
                if(valor===null)continue;
                if(!historico[keys[i]])historico[keys[i]]=[];
                historico[keys[i]].push(valor);
                if(historico[keys[i]].length>MAX_HIST)historico[keys[i]].shift();
            }
        }
        function atualizarStatusLeitor(status){
            var dot=document.getElementById('leitor-dot'),label=document.getElementById('leitor-label');
            if(!status){dot.className='leitor-dot offline';label.textContent='Leitor: desconectado';return}
            var agora=Date.now(),diff=agora-(status.lastHeartbeat||0);
            if(diff<30000&&status.ativo){dot.className='leitor-dot';label.textContent='Leitor: ativo'}
            else{dot.className='leitor-dot offline';label.textContent='Leitor: offline ('+Math.floor(diff/1000)+'s)'}
            document.getElementById('leitor-leituras').textContent=status.leituras||0;
            if(status.uptime){var m=Math.floor(status.uptime/60),h=Math.floor(m/60);document.getElementById('leitor-uptime').textContent=h.toString().padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
            var ovUp=document.getElementById('ov-uptime');if(ovUp&&status.uptime){var m2=Math.floor(status.uptime/60),h2=Math.floor(m2/60);ovUp.textContent=h2+'h'+String(m2%60).padStart(2,'0')}
        }
        function atualizarIndicadorTempo(){
            var el=document.getElementById('last-update');
            if(ultimosDados&&ultimosDados._readAt)el.textContent='Última atualização: '+ultimosDados._readAt;
            else el.textContent='Aguardando dados...';
        }

        // ===== NOTIFICAÇÕES =====
        function verificarAlarmesNotif(data){
            if(!notificacoesAtivas)return;
            var keys=Object.keys(tagConfig);
            for(var i=0;i<keys.length;i++){
                var val=getVal(data,keys[i]);if(val===null)continue;
                var alarm=getAlarmInfo(keys[i],val);
                if(alarm.tipo!=='none'&&!alarmesAtivosNotif[keys[i]]){
                    alarmesAtivosNotif[keys[i]]=true;
                    if(Notification.permission==='granted')new Notification('🚨 '+tagConfig[keys[i]].nome,{body:'Valor: '+val.toFixed(1)+' '+tagConfig[keys[i]].u,icon:'icon-192.png'});
                }else if(alarm.tipo==='none'){delete alarmesAtivosNotif[keys[i]]}
            }
        }
        window.toggleNotificacoes=function(){
            if(!notificacoesAtivas){Notification.requestPermission().then(function(p){if(p==='granted'){notificacoesAtivas=true;document.getElementById('btn-notif').style.background='var(--accent)';document.getElementById('btn-notif').style.color='#fff'}})}
            else{notificacoesAtivas=false;document.getElementById('btn-notif').style.background='';document.getElementById('btn-notif').style.color=''}
        };

        // ===== THEME =====
        window.toggleTheme=function(){
            var r=document.documentElement,btn=document.getElementById('btn-theme');
            if(r.style.getPropertyValue('--bg1')==='#f5f5f5'){r.style.setProperty('--bg1','#0d1117');r.style.setProperty('--bg2','#161b22');r.style.setProperty('--t1','#ffffff');r.style.setProperty('--t2','#8b949e');r.style.setProperty('--t3','#484f58');r.style.setProperty('--bg-card','rgba(255,255,255,0.05)');r.style.setProperty('--bg-card-hover','rgba(255,255,255,0.08)');r.style.setProperty('--glass-border','rgba(255,255,255,0.08)');btn.textContent='☀️'}
            else{r.style.setProperty('--bg1','#f5f5f5');r.style.setProperty('--bg2','#ffffff');r.style.setProperty('--t1','#1a1a1a');r.style.setProperty('--t2','#666666');r.style.setProperty('--t3','#999999');r.style.setProperty('--bg-card','rgba(0,0,0,0.03)');r.style.setProperty('--bg-card-hover','rgba(0,0,0,0.06)');r.style.setProperty('--glass-border','rgba(0,0,0,0.08)');btn.textContent='🌙'}
        };

        // ===== CSV =====
        window.exportarCSV=function(){
            if(!ultimosDados)return;var csv='Tag,Valor,Unidade,Timestamp\n';
            var keys=Object.keys(ultimosDados);
            for(var i=0;i<keys.length;i++){if(keys[i].startsWith('_'))continue;
                var v=ultimosDados[keys[i]];var val=(typeof v==='object'&&'v' in v)?v.v:v;var u=(typeof v==='object'&&'u' in v)?v.u:'';
                csv+=keys[i]+','+val+','+u+','+(ultimosDados._readAt||'')+'\n'}
            var blob=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='utilidades_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
        };

        // ===== LOGOUT =====
        window.logout=function(){localStorage.removeItem('modo_acesso');localStorage.removeItem('login_timestamp');firebase.auth().signOut().then(function(){window.location.href='index.html'})};

        // ===== SW + REFRESH =====
        if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
        setInterval(function(){if(tabAtual!=='overview'&&tabAtual!=='alarmes'&&tabAtual!=='energia')redesenharSparklines()},5000);
    })();
    </script>
