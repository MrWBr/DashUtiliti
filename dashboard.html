
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilidades - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e1a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1a1f3a, #0d1117);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2f45;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header h1 {
            font-size: 1em;
            color: #4fc3f7;
            font-weight: 600;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-logout {
            background: #333;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7em;
        }

        /* LEITOR STATUS BAR */
        .leitor-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #0d1117;
            border-bottom: 1px solid #1a2035;
            font-size: 0.75em;
        }
        .leitor-status .left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .leitor-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: blink 2s infinite;
        }
        .leitor-status .dot.offline {
            background: #ef5350;
            animation: none;
        }
        .leitor-status .dot.warning {
            background: #ffa726;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .leitor-status .info {
            color: #888;
        }
        .leitor-status .info strong {
            color: #e0e0e0;
        }
        .leitor-status .right {
            display: flex;
            gap: 12px;
            color: #888;
        }
        .leitor-status .right span {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .battery-bar {
            display: inline-block;
            width: 20px;
            height: 9px;
            border: 1px solid #666;
            border-radius: 2px;
            position: relative;
            vertical-align: middle;
        }
        .battery-bar::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 2px;
            width: 2px;
            height: 5px;
            background: #666;
            border-radius: 0 1px 1px 0;
        }
        .battery-bar .fill {
            height: 100%;
            border-radius: 1px;
            background: #4caf50;
        }
        .battery-bar .fill.low { background: #ef5350; }
        .battery-bar .fill.mid { background: #ffa726; }

        /* LAST UPDATE */
        .last-update {
            text-align: center;
            font-size: 0.7em;
            color: #555;
            padding: 6px;
            background: #0d1117;
        }

        /* CARDS CONTAINER */
        .cards-container {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* CARD ROW */
        .card-row {
            display: flex;
            align-items: center;
            background: #141929;
            border-radius: 8px;
            padding: 10px 12px;
            border-left: 3px solid #4fc3f7;
            gap: 10px;
            transition: background 0.2s;
        }
        .card-row:hover { background: #1a2035; }
        .card-row.alarm {
            border-left-color: #ef5350;
            background: #1a1015;
        }
        .card-row.alarm:hover { background: #251520; }

        .card-info {
            flex: 1;
            min-width: 0;
        }
        .card-nome {
            font-size: 0.7em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-valor {
            font-size: 1.3em;
            font-weight: 700;
            color: #fff;
            margin-top: 2px;
        }
        .card-valor .unidade {
            font-size: 0.55em;
            color: #666;
            font-weight: 400;
            margin-left: 3px;
        }
        .card-row.alarm .card-valor { color: #ef5350; }
        .card-row.alarm .card-nome { color: #ef9a9a; }

        .card-spark {
            width: 100px;
            height: 35px;
            flex-shrink: 0;
        }
        .card-spark canvas {
            width: 100%;
            height: 100%;
        }

        .card-trend {
            font-size: 1em;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .trend-up { color: #ef5350; }
        .trend-down { color: #4caf50; }
        .trend-stable { color: #555; }

        .section-title {
            font-size: 0.75em;
            color: #4fc3f7;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 12px 4px;
            font-weight: 600;
        }

        /* Sem dados */
        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }
        .no-data .icon { font-size: 3em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏭 Utilidades</h1>
        <div class="header-right">
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
    </div>

    <!-- STATUS DO LEITOR -->
    <div class="leitor-status" id="leitor-bar">
        <div class="left">
            <div class="dot" id="leitor-dot"></div>
            <div class="info" id="leitor-info">Leitor: <strong>Verificando...</strong></div>
        </div>
        <div class="right">
            <span id="leitor-battery">
                <div class="battery-bar"><div class="fill" id="battery-fill" style="width:0%"></div></div>
                <span id="battery-text">--%</span>
            </span>
            <span id="leitor-leituras">📖 --</span>
        </div>
    </div>

    <div class="last-update" id="last-update">Aguardando dados...</div>
    
    <div class="cards-container" id="cards-container">
        <div class="no-data">
            <div class="icon">📡</div>
            <p>Aguardando dados do leitor...</p>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBLx0ECcSQdS8uKnaXzDIuygK7Hi3JTcuU",
            authDomain: "dshutili.firebaseapp.com",
            databaseURL: "https://dshutili-default-rtdb.firebaseio.com",
            projectId: "dshutili",
            storageBucket: "dshutili.firebasestorage.app",
            messagingSenderId: "1065134772507",
            appId: "1:1065134772507:web:aed91d6d1953f69cb403be",
            measurementId: "G-B3NS6YKTLV"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        firebase.auth().onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                initDashboard();
            }
        });

        // ============ CONFIG TAGS ============
        var tagConfig = {
            "TO8001_2_3_4": { nome: "Torres C.A.G.", grupo: "temp", limiteAlto: 32, limiteBaixo: null },
            "TO8006_Retorno": { nome: "Torre Wafer", grupo: "temp", limiteAlto: 35, limiteBaixo: null },
            "CH8007": { nome: "Chiller 8007", grupo: "temp", limiteAlto: 2, limiteBaixo: -5 },
            "CH8008": { nome: "Chiller 8008", grupo: "temp", limiteAlto: 2, limiteBaixo: -5 },
            "CH8011_14": { nome: "Chillers 8011/14", grupo: "temp", limiteAlto: 2, limiteBaixo: -5 },
            "CV8004_Retorno": { nome: "Sala de Gorduras", grupo: "temp", limiteAlto: 50, limiteBaixo: null },
            "Ar_Comp_DM": { nome: "Ar Comp Dry Mix", grupo: "ar", limiteAlto: null, limiteBaixo: 5.5 },
            "Ar_Comp_DM_Boge": { nome: "Ar Comp Boge", grupo: "ar", limiteAlto: null, limiteBaixo: 5.5 },
            "Ar_Comp_Choco": { nome: "Ar Comp Chocolate", grupo: "ar", limiteAlto: null, limiteBaixo: 5.5 },
            "Vacuo_Dry_Mix": { nome: "Vácuo Dry Mix", grupo: "ar", limiteAlto: null, limiteBaixo: 15 },
            "Agua_6C": { nome: "Água Gelada 6°C", grupo: "agua", limiteAlto: 8, limiteBaixo: null },
            "Pressao_Cavalete_BG": { nome: "Pressão B&G", grupo: "vapor", limiteAlto: null, limiteBaixo: 10 },
            "Pressao_Vapor_Choco": { nome: "Pressão Vapor Choco", grupo: "vapor", limiteAlto: null, limiteBaixo: 5 },
            "Nivel_TQ_CD8006_7": { nome: "Nível TQ CD8006/7", grupo: "vapor", limiteAlto: null, limiteBaixo: 40 },
            "Umidade_Ar_Comp_Chocolate": { nome: "Umidade Ar Choco", grupo: "qualidade", limiteAlto: 15, limiteBaixo: null },
            "Temperatura_Ar_Comp_Chocolate": { nome: "Temp Ar Choco", grupo: "qualidade", limiteAlto: 50, limiteBaixo: null },
            "Umidade_Ar_Comp_BG": { nome: "Umidade Ar B&G", grupo: "qualidade", limiteAlto: 15, limiteBaixo: null },
            "Temperatura_Ar_Comp_BG": { nome: "Temp Ar B&G", grupo: "qualidade", limiteAlto: 50, limiteBaixo: null }
        };

        var grupos = {
            "temp": "🌡️ Temperaturas",
            "ar": "💨 Ar Comprimido / Vácuo",
            "agua": "💧 Água",
            "vapor": "♨️ Vapor / Pressão",
            "qualidade": "📊 Qualidade do Ar"
        };

        var historico = {};
        var MAX_HIST = 30;

        function initDashboard() {
            // Escutar dados em tempo real
            db.ref('current').on('value', function(snapshot) {
                var data = snapshot.val();
                if (!data) return;
                
                atualizarHistorico(data);
                renderCards(data);
                
                document.getElementById('last-update').textContent = 
                    '🔄 ' + (data._readAt || new Date().toLocaleString('pt-BR'));
            });

            // Escutar status do leitor
            db.ref('leitor_status').on('value', function(snapshot) {
                var status = snapshot.val();
                atualizarStatusLeitor(status);
            });

            // Status conexão Firebase
            db.ref('.info/connected').on('value', function(snap) {
                // Pode usar para indicar se o dashboard está online
            });
        }

        // ============ STATUS DO LEITOR ============
        function atualizarStatusLeitor(status) {
            var dot = document.getElementById('leitor-dot');
            var info = document.getElementById('leitor-info');
            var batteryFill = document.getElementById('battery-fill');
            var batteryText = document.getElementById('battery-text');
            var leituras = document.getElementById('leitor-leituras');

            if (!status) {
                dot.className = 'dot offline';
                info.innerHTML = 'Leitor: <strong>Nunca conectado</strong>';
                return;
            }

            var agora = Date.now();
            var lastHB = status.lastHeartbeat || 0;
            var diffSeg = Math.floor((agora - lastHB) / 1000);

            // Status baseado no heartbeat
            if (status.ativo && diffSeg < 30) {
                // Online
                dot.className = 'dot';
                info.innerHTML = 'Leitor: <strong style="color:#4caf50">Online</strong> <span style="color:#555">(' + diffSeg + 's atrás)</span>';
            } else if (status.ativo && diffSeg < 60) {
                // Warning - heartbeat atrasado
                dot.className = 'dot warning';
                info.innerHTML = 'Leitor: <strong style="color:#ffa726">Instável</strong> <span style="color:#555">(' + diffSeg + 's)</span>';
            } else {
                // Offline
                dot.className = 'dot offline';
                var desconStr = '';
                if (status.desconectadoEm) {
                    desconStr = ' — ' + new Date(status.desconectadoEm).toLocaleString('pt-BR');
                }
                info.innerHTML = 'Leitor: <strong style="color:#ef5350">Offline</strong> <span style="color:#555">' + desconStr + '</span>';
            }

            // Bateria
            var bat = status.bateria;
            if (bat !== null && bat !== undefined) {
                batteryFill.style.width = bat + '%';
                batteryFill.className = 'fill' + (bat < 20 ? ' low' : bat < 50 ? ' mid' : '');
                batteryText.textContent = (status.carregando ? '⚡' : '') + bat + '%';
            } else {
                batteryText.textContent = '--';
            }

            // Leituras
            if (status.leituras !== undefined) {
                leituras.textContent = '📖 ' + status.leituras;
            }
        }

        // Atualizar status do leitor a cada 5 segundos (para atualizar o "Xs atrás")
        setInterval(function() {
            db.ref('leitor_status').once('value').then(function(snap) {
                atualizarStatusLeitor(snap.val());
            });
        }, 5000);

        // ============ HISTÓRICO ============
        function atualizarHistorico(data) {
            var keys = Object.keys(data);
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                if (key.startsWith('_')) continue;
                
                var val = data[key];
                var valor = null;
                
                if (val && typeof val === 'object' && 'v' in val) {
                    valor = val.v;
                } else if (typeof val === 'number') {
                    valor = val;
                }
                
                if (valor !== null && typeof valor === 'number') {
                    if (!historico[key]) historico[key] = [];
                    historico[key].push(valor);
                    if (historico[key].length > MAX_HIST) historico[key].shift();
                }
            }
        }

        // ============ RENDER CARDS ============
        function renderCards(data) {
            var container = document.getElementById('cards-container');
            container.innerHTML = '';

            var vars = [];
            var keys = Object.keys(data);
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                if (key.startsWith('_')) continue;
                
                var val = data[key];
                if (val && typeof val === 'object' && 'v' in val) {
                    vars.push({ id: key, nome: val.nome || key, v: val.v, u: val.u || '' });
                } else if (typeof val === 'number') {
                    vars.push({ id: key, nome: key, v: val, u: '' });
                }
            }

            if (vars.length === 0) {
                container.innerHTML = '<div class="no-data"><div class="icon">📡</div><p>Aguardando dados...</p></div>';
                return;
            }

            // Agrupar
            var gruposOrdem = ['temp', 'ar', 'agua', 'vapor', 'qualidade', 'outro'];
            var agrupados = {};
            
            for (var j = 0; j < vars.length; j++) {
                var v = vars[j];
                var cfg = tagConfig[v.id];
                var grupo = cfg ? cfg.grupo : 'outro';
                if (!agrupados[grupo]) agrupados[grupo] = [];
                agrupados[grupo].push(v);
            }

            for (var g = 0; g < gruposOrdem.length; g++) {
                var grupoKey = gruposOrdem[g];
                var items = agrupados[grupoKey];
                if (!items || items.length === 0) continue;

                var titulo = document.createElement('div');
                titulo.className = 'section-title';
                titulo.textContent = grupos[grupoKey] || '📌 Outros';
                container.appendChild(titulo);

                for (var k = 0; k < items.length; k++) {
                    container.appendChild(criarCardRow(items[k]));
                }
            }
        }

        // ============ CRIAR CARD ============
        function criarCardRow(item) {
            var cfg = tagConfig[item.id] || {};
            var nome = cfg.nome || item.nome || item.id.replace(/_/g, ' ');
            var valor = item.v;
            var unidade = item.u;

            var alarme = false;
            if (cfg.limiteAlto != null && valor > cfg.limiteAlto) alarme = true;
            if (cfg.limiteBaixo != null && valor < cfg.limiteBaixo) alarme = true;

            var hist = historico[item.id] || [];
            var tendencia = '';
            var tendenciaClass = 'trend-stable';
            if (hist.length >= 2) {
                var diff = hist[hist.length - 1] - hist[hist.length - 2];
                if (diff > 0.2) { tendencia = '▲'; tendenciaClass = 'trend-up'; }
                else if (diff < -0.2) { tendencia = '▼'; tendenciaClass = 'trend-down'; }
                else { tendencia = '─'; tendenciaClass = 'trend-stable'; }
            }

            var row = document.createElement('div');
            row.className = 'card-row' + (alarme ? ' alarm' : '');

            var info = document.createElement('div');
            info.className = 'card-info';
            info.innerHTML = '<div class="card-nome">' + nome + '</div>' +
                '<div class="card-valor">' + (typeof valor === 'number' ? valor.toFixed(1) : valor) +
                '<span class="unidade">' + unidade + '</span></div>';

            var sparkDiv = document.createElement('div');
            sparkDiv.className = 'card-spark';
            var canvas = document.createElement('canvas');
            canvas.width = 100;
            canvas.height = 35;
            sparkDiv.appendChild(canvas);

            var trendDiv = document.createElement('div');
            trendDiv.className = 'card-trend ' + tendenciaClass;
            trendDiv.textContent = tendencia;

            row.appendChild(info);
            row.appendChild(sparkDiv);
            row.appendChild(trendDiv);

            if (hist.length >= 2) {
                desenharSparkline(canvas, hist, alarme);
            }

            return row;
        }

        // ============ SPARKLINE ============
        function desenharSparkline(canvas, valores, alarme) {
            var ctx = canvas.getContext('2d');
            var w = canvas.width;
            var h = canvas.height;
            var padding = 3;

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = 'rgba(20, 25, 40, 0.5)';
            ctx.fillRect(0, 0, w, h);

            if (valores.length < 2) return;

            var min = Math.min.apply(null, valores);
            var max = Math.max.apply(null, valores);
            var range = max - min || 1;

            // Média
            var media = valores.reduce(function(a, b) { return a + b; }, 0) / valores.length;
            var mediaY = h - padding - ((media - min) / range) * (h - padding * 2);
            ctx.strokeStyle = 'rgba(100, 100, 120, 0.3)';
            ctx.lineWidth = 0.5;
            ctx.setLineDash([2, 2]);
            ctx.beginPath();
            ctx.moveTo(0, mediaY);
            ctx.lineTo(w, mediaY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Área
            ctx.beginPath();
            for (var i = 0; i < valores.length; i++) {
                var x = (i / (valores.length - 1)) * w;
                var y = h - padding - ((valores[i] - min) / range) * (h - padding * 2);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            ctx.fillStyle = alarme ? 'rgba(239, 83, 80, 0.1)' : 'rgba(79, 195, 247, 0.1)';
            ctx.fill();

            // Linha
            ctx.beginPath();
            for (var j = 0; j < valores.length; j++) {
                var px = (j / (valores.length - 1)) * w;
                var py = h - padding - ((valores[j] - min) / range) * (h - padding * 2);
                if (j === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.strokeStyle = alarme ? '#ef5350' : '#4fc3f7';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Ponto atual
            var lastX = w;
            var lastY = h - padding - ((valores[valores.length - 1] - min) / range) * (h - padding * 2);
            ctx.beginPath();
            ctx.arc(lastX - 2, lastY, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = alarme ? '#ef5350' : '#4fc3f7';
            ctx.fill();
        }

        function logout() {
            localStorage.removeItem('modo_acesso');
            localStorage.removeItem('login_timestamp');
            firebase.auth().signOut().then(function() {
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
